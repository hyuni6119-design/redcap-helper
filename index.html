<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레드캡 유리수리 워크플로우 V115 단독 HTML (속도개선)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#F3F5F9;
  --panel:#FFFFFF;
  --panel-2:#F7F9FC;
  --line:#E1E6EE;
  --ink:#182238;
  --ink-soft:#54607A;
  --ink-faint:#8C97AE;

  --brand:#2F5FE0;
  --brand-dark:#1E44B8;
  --brand-soft:#EAF0FF;

  --glass:#0EA5B7;
  --glass-soft:#E4F7F9;

  --amber:#C9790F;
  --amber-bg:#FCF0DC;
  --green:#1E8F5C;
  --green-bg:#E5F5EC;
  --red:#D14343;
  --red-bg:#FBE8E8;
  --gray-bg:#EEF1F6;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:28px; --sp-7:40px;

  --radius-sm:8px;
  --radius:12px;
  --radius-lg:18px;
  --radius-pill:999px;

  /* 차량번호·금액 등 숫자 표시용으로 별도 모노스페이스 폰트를 쓰고 있었는데,
     한글과 섞이면서 글씨체가 뒤죽박죽으로 보인다는 피드백이 있어 사이트 전체를 Noto Sans KR 하나로 통일합니다. */
  --mono:'Noto Sans KR', 'Malgun Gothic', '맑은 고딕', Arial, sans-serif;
  --sans:'Noto Sans KR', 'Malgun Gothic', '맑은 고딕', Arial, sans-serif;

  --shadow-sm: 0 1px 2px rgba(24,34,56,.05);
  --shadow: 0 1px 2px rgba(24,34,56,.04), 0 8px 24px -12px rgba(24,34,56,.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#app{display:flex; min-height:100vh;}

/* ---- crack motif ---- */
.crack-divider{width:100%; height:10px; opacity:.5;}
.crack-divider path{stroke:var(--glass); stroke-width:1.4; fill:none;}

/* ---- sidebar ---- */
#sidebar{
  width:300px; min-width:300px; background:var(--panel);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  height:100vh; position:sticky; top:0;
}
.sidebar-head{padding:20px 18px 14px; border-bottom:1px solid var(--line);}
.brand-mark{display:flex; align-items:center; gap:10px;}
.brand-mark svg{flex:none;}
.brand-title{font-weight:800; font-size:16.5px; letter-spacing:-.01em;}
.brand-sub{font-size:13px; color:var(--ink-faint); margin-top:2px; font-family:var(--mono);}
.new-case-btn{
  margin-top:14px; width:100%; padding:10px 12px; border-radius:var(--radius); border:none;
  background:var(--brand); color:#fff; font-weight:700; font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  transition:background .15s;
}
.new-case-btn:hover{background:var(--brand-dark);}
.case-list{flex:1; overflow-y:auto; padding:10px 10px 20px;}
.case-list-empty{padding:30px 14px; text-align:center; color:var(--ink-faint); font-size:14px; line-height:1.6;}
.case-card{
  padding:12px 12px; border-radius:var(--radius); margin-bottom:8px; cursor:pointer;
  border:1px solid transparent; transition:.12s;
}
.case-card:hover{background:var(--panel-2);}
.case-card.active{background:var(--brand-soft); border-color:var(--brand-soft);}
.case-plate{font-family:var(--mono); font-weight:800; font-size:14.5px; color:var(--brand-dark); background:var(--brand-soft); border-radius:var(--radius-sm); padding:2px 7px; display:inline-block;}
.case-model{font-size:13.5px; color:var(--ink-soft); margin-top:3px; font-weight:600;}
.status-pill{
  display:inline-flex; align-items:center; gap:5px; margin-top:8px;
  font-size:12px; font-weight:700; padding:3px 8px; border-radius:var(--radius-pill);
}
.dot{width:6px; height:6px; border-radius:50%; flex:none;}

/* ---- main ---- */
#main{flex:1; min-width:0; height:100vh; overflow-y:auto;}
.empty-state{
  height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--ink-faint); text-align:center; padding:40px;
}
.empty-state h2{color:var(--ink); font-size:19px; margin:14px 0 6px;}
.empty-state p{font-size:14.5px; max-width:360px; line-height:1.7;}

.case-header{
  position:sticky; top:0; z-index:5; background:rgba(238,242,247,.9); backdrop-filter:blur(6px);
  padding:22px 32px 0;
}
.case-header-row{display:flex; align-items:flex-start; justify-content:space-between; gap:16px;}
.case-title{font-size:22px; font-weight:800; letter-spacing:-.01em; display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
.case-title .plate-badge{font-family:var(--mono); font-weight:800; color:#fff; background:var(--brand); border-radius:var(--radius-sm); padding:5px 11px; font-size:19px; letter-spacing:.01em; display:inline-flex; align-items:center; gap:8px;}
.case-title .plate-copy-btn{background:rgba(255,255,255,.22); border:none; color:#fff; border-radius:6px; font-size:12px; font-weight:700; padding:3px 7px; cursor:pointer; letter-spacing:0;}
.case-title .plate-copy-btn:hover{background:rgba(255,255,255,.36);}
.case-title .model-text{color:var(--ink-soft); font-weight:700; font-size:17px;}
.case-title .header-tint-warning{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #F0A43A;background:#FFF2CC;color:#A33A16;border-radius:8px;padding:7px 11px;font-family:inherit;font-size:14px;font-weight:900;line-height:1.25;cursor:pointer;box-shadow:0 3px 10px rgba(163,58,22,.12);}
.case-title .header-tint-warning:hover{background:#FFE7A0;border-color:#E48722;}
.case-title .header-tint-warning:focus-visible{outline:3px solid rgba(36,87,214,.28);outline-offset:2px;}
.case-meta{font-size:17px; color:var(--ink); font-weight:700; margin-top:6px;}
.case-info-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.case-info-item{display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:5px 10px;}
.case-info-item .lbl{font-size:12px; font-weight:800; color:var(--ink-faint);}
.case-info-item .val{font-size:14px; font-weight:700; color:var(--ink);}
.case-info-item.deductible{background:var(--amber-bg,#fff4cf); border-color:#efbf4d;}
.case-info-item.deductible .lbl{color:#8A5A16;}
.case-info-item.deductible .val{color:#8A5A16;}
.repair-type-item-restore{background:#EAF4FB; border-color:#9CC7E8;}
.repair-type-item-restore .lbl,.repair-type-item-restore .val{color:#1B5A8A;}
.repair-type-item-replace{background:#F2F8F5; border-color:#9ED2B5;}
.repair-type-item-replace .lbl,.repair-type-item-replace .val{color:#1B6B47;}
.repair-type-item-pending{background:#F3F3F5; border-color:#C7CAD3;}
.repair-type-item-pending .lbl,.repair-type-item-pending .val{color:#5A5F6D;}
.tool-memo-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
.tool-memo-head label{margin:0!important;}
.tool-memo-head .btn{padding:4px 12px;font-size:12.5px;}
.delete-case{
  border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:13.5px;
  padding:6px 10px; border-radius:var(--radius-sm);
}
.delete-case:hover{background:var(--red-bg); color:var(--red);}

.step-tabs{display:flex; flex-wrap:wrap; gap:6px; margin-top:18px; overflow-x:auto; padding-bottom:2px;}
.step-tab{
  flex:none; padding:10px 16px; font-size:14.5px; font-weight:800; color:var(--ink-faint);
  border:2px solid transparent; background:var(--gray-bg); cursor:pointer; border-radius:var(--radius); position:relative;
  white-space:nowrap;
}
.step-tab .num{font-family:var(--mono); font-size:12px; margin-right:5px; opacity:.7;}
.step-tab.active{color:#fff; background:var(--brand); border-color:var(--brand);}
.step-tab.done:not(.active)::after{
  content:''; position:absolute; top:6px; right:6px; width:6px; height:6px; border-radius:50%; background:var(--green);
}
.step-tab.current-stage:not(.active){color:var(--brand-dark); background:var(--brand-soft); border-color:var(--brand); font-weight:800;}

.step-body{background:var(--panel); margin:0 32px 40px; border-radius:0 14px 14px 14px; box-shadow:var(--shadow); padding:26px 30px;}

h3.section-title{font-size:16.5px; font-weight:800; margin:0 0 4px;}
p.section-sub{font-size:16.5px; color:var(--ink-soft); margin:0 0 18px; line-height:1.65;}

label.field-label{display:block; font-size:15px; font-weight:700; color:var(--ink-soft); margin:16px 0 6px;}
label.field-label:first-child{margin-top:0;}
textarea.field, input.field, select.field{
  width:100%; border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px;
  font-family:var(--sans); font-size:15px; color:var(--ink); background:var(--panel-2);
  outline:none; transition:.12s;
}
textarea.field{font-family:var(--mono); font-size:14px; line-height:1.6;}
.field:focus{border-color:var(--brand); background:#fff; box-shadow:0 0 0 3px rgba(31,95,224,.12);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}

.btn{
  border:2px solid transparent; border-radius:var(--radius); padding:10px 18px; font-weight:800; font-size:14.5px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; transition:.12s;
}
.btn-primary{background:var(--brand); color:#fff;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-ghost{background:#fff; color:var(--ink); border:2px solid var(--line);}
.btn-ghost:hover{border-color:var(--brand); color:var(--brand-dark);}
.btn-sm{padding:7px 13px; font-size:13.5px; border-radius:var(--radius-sm);}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.parsed-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; margin-top:6px;}
.parsed-item{background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:6px 9px;}
.parsed-item .k{font-size:11px; color:var(--ink-faint); font-weight:700;}
.parsed-item.key-field{background:var(--brand-soft); border:1.5px solid var(--brand);}
.parsed-item.key-field .k{color:var(--brand-dark); font-weight:800; font-size:11px;}
.parsed-item.key-field .parsed-field-text{font-family:var(--mono); font-weight:800; font-size:13px; color:var(--brand-dark); background:transparent;}
.parsed-item.large-field .parsed-field-text{font-size:13px; font-weight:700; color:var(--ink);}
.parsed-item.warn-field{background:var(--red-bg); border:1.5px solid var(--red);}
.parsed-item.warn-field .k{color:var(--red); font-weight:800;}
.parsed-item.warn-field .parsed-field-text{background:transparent;}
.parsed-warn-note{font-size:12px; color:var(--red); font-weight:700; margin-top:4px; line-height:1.4;}
.parsed-field-row{display:flex; gap:7px; align-items:flex-start;}
.parsed-field-row .parsed-field-text{flex:1;}
.parsed-copy-btn{flex:none; border:none; background:var(--brand); color:#fff; font-weight:700; font-size:11.5px; border-radius:var(--radius-sm); padding:6px 10px; cursor:pointer; white-space:nowrap; margin-top:2px;}
.parsed-copy-btn:hover{background:var(--brand-dark);}
.parsed-item input{border:none; background:none; width:100%; font-size:14.5px; padding:2px 0 0; font-family:var(--sans); outline:none;}
.parsed-item.compact-field{padding:4px 8px;}
.parsed-item.compact-field .parsed-field-text{min-height:30px;padding:2px 0;line-height:1.35;}
.parsed-item.wide-field{grid-column:1 / -1;}

.copy-block{
  background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-top:10px;
  white-space:pre-wrap; font-size:14.5px; line-height:1.75; position:relative;
}
.copy-block .copy-btn{position:absolute; top:10px; right:10px;}
.copy-label{font-size:14.5px; font-weight:700; color:var(--brand-dark); text-transform:uppercase; letter-spacing:.03em; margin:18px 0 4px; display:block;}
.copy-label:first-child{margin-top:0;}

.search-box{position:relative;}
.search-results{
  position:absolute; z-index:10; top:calc(100% + 4px); left:0; right:0; background:#fff;
  border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); max-height:260px; overflow-y:auto;
}
.search-item{padding:9px 12px; cursor:pointer; font-size:14.5px; border-bottom:1px solid var(--panel-2);}
.search-item:last-child{border-bottom:none;}
.search-item:hover{background:var(--panel-2);}
.search-item .sm{font-size:12.5px; color:var(--ink-faint); font-family:var(--mono);}

.part-card{
  border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; background:linear-gradient(180deg,var(--panel-2),#F3F7FD);
  margin-top:14px;
}
.part-card-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
.part-card-head .model{font-weight:800; font-size:17px;}
.part-card-head .partno{font-family:var(--mono); font-size:13.5px; color:var(--brand-dark); background:#E3EDFD; padding:3px 8px; border-radius:var(--radius-sm);}
.price-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; margin-top:8px;}
.price-side-row{display:flex; gap:16px; align-items:stretch; flex-wrap:wrap; margin-top:8px;}
.price-side-row .price-grid.single{display:flex; margin-top:0; flex:0 0 auto;}
.price-side-row .price-grid.single .price-tile{min-width:240px; padding:16px 22px;}
.price-side-row .price-grid.single .price-tile .lab{font-size:14px;}
.price-side-row .price-grid.single .price-tile .val{font-size:27px; margin-top:4px;}
.price-side-row .price-side-note{flex:1 1 280px; margin-top:0; align-self:center;}
@media(max-width:640px){.price-side-row{flex-direction:column;}.price-side-row .price-grid.single{flex:1 1 auto;}}
.price-tile{background:#fff; border:2px solid var(--line); border-radius:var(--radius); padding:9px 11px;}
.price-tile .lab{font-size:13px; color:var(--ink-soft); font-weight:800;}
.price-tile .val{font-family:var(--mono); font-weight:800; font-size:17px; margin-top:2px;}
.price-tile.muted .val{color:var(--ink-faint); font-weight:400;}
.price-tile.hl{border:3px solid var(--brand); background:var(--brand-soft);}
.price-tile.hl .lab{color:var(--brand-dark);}
.price-tile.hl .val{color:var(--brand-dark); font-size:20px;}

.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.chip{
  padding:8px 15px; border-radius:var(--radius-pill); border:1px solid var(--line); background:#fff; font-size:15px;
  font-weight:600; cursor:pointer; transition:.12s;
}
.chip.active{background:var(--brand); border-color:var(--brand); color:#fff;}
.chip.tint-auto::after{content:' ✓ 추천'; font-size:11.5px; font-weight:700; opacity:.85;}

.total-banner{
  margin-top:16px; display:flex; align-items:center; justify-content:space-between;
  background:var(--ink); color:#fff; border-radius:var(--radius); padding:14px 18px;
}
.total-banner .lab{font-size:13.5px; opacity:.7; font-weight:700;}
.total-banner .amt{font-family:var(--mono); font-size:26px; font-weight:700; margin-top:2px;}

.franchise-item{
  border:1px solid var(--line); border-radius:var(--radius); padding:13px 15px; margin-bottom:10px;
  display:flex; justify-content:space-between; align-items:center; gap:12px; cursor:pointer;
}
.franchise-item:hover{border-color:var(--brand);}
.franchise-item.selected{border-color:var(--brand); background:var(--brand-soft);}
.franchise-item .fname{font-weight:800; font-size:15.5px;}
.franchise-item .faddr{font-size:13.5px; color:var(--ink-soft); margin-top:2px;}
.franchise-item .fowner{font-family:var(--mono); font-size:13px; color:var(--ink-faint); margin-top:4px;}
.franchise-actions{display:flex; gap:6px; flex:none;}

.checklist{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
.check-item{display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--panel-2); border-radius:var(--radius); border:1px solid var(--line);}
.check-item input{width:16px; height:16px; accent-color:var(--brand);}
.check-item.checked{opacity:.5; text-decoration:line-through;}
.check-item label{font-size:14.5px; flex:1; cursor:pointer;}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:10px 18px; border-radius:var(--radius); font-size:14.5px; font-weight:600;
  box-shadow:var(--shadow); z-index:100; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

.footer-nav{display:flex; justify-content:space-between; margin:18px 32px 40px;}

.reminder-badge{
  display:flex; align-items:center; gap:8px; background:var(--amber-bg); color:var(--amber);
  border-radius:var(--radius); padding:10px 14px; font-size:15.5px; font-weight:700; margin-top:10px;
}

.model-select-note{font-size:14.5px; color:var(--ink-faint); margin-top:6px; line-height:1.55;}
.strong-info-banner{margin:14px 0;padding:13px 16px;background:#eaf3ff;border:1.5px solid var(--brand);border-left:5px solid var(--brand-dark);border-radius:10px;color:var(--brand-dark);font-size:15px;font-weight:700;line-height:1.6;}
.strong-info-banner b{color:var(--brand-dark);}
.franchise-info-card{margin-top:10px;padding:12px 14px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);}
.franchise-info-name{font-weight:800;font-size:15px;color:var(--ink);}
.franchise-info-type{font-weight:600;font-size:12px;color:var(--ink-faint);}
.franchise-info-address{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}

/* ---- editable copy blocks ---- */
.copy-block.edit-block{padding:0; overflow:hidden;}
.editable-text{
  width:100%; border:none; background:none; resize:vertical; outline:none;
  font-family:var(--sans); font-size:16px; line-height:1.75; color:var(--ink);
  padding:14px 44px 14px 16px; box-sizing:border-box; display:block;
}
.copy-block.edit-block .copy-btn{top:10px; right:10px;}
.copy-block.edit-block.no-copy-btn .editable-text{padding-right:16px;}

/* ---- modal ---- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(18,32,62,.45); z-index:200;
  display:none; align-items:center; justify-content:center; padding:24px;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:#fff; border-radius:var(--radius-lg); max-width:560px; width:100%; max-height:80vh; overflow-y:auto;
  padding:24px 26px; box-shadow:0 20px 60px -12px rgba(18,32,62,.35);
}
.modal-box h3{margin:0 0 14px; font-size:16px; font-weight:800;}
.modal-close{float:right; border:none; background:var(--panel-2); border-radius:var(--radius-sm); padding:5px 10px; cursor:pointer; font-size:13.5px; font-weight:700;}
.modal-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--panel-2); font-size:15px;}
.modal-row .mk{color:var(--ink-faint); font-weight:700;}
.modal-row .mv{font-family:var(--mono); font-weight:600;}

/* ---- in-step subnav ---- */
.subnav{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px;}
.subnav-item{
  padding:7px 14px; border-radius:var(--radius-pill); background:var(--panel-2); border:1px solid var(--line);
  font-size:14px; font-weight:700; cursor:pointer; color:var(--ink-soft);
}
.subnav-item:hover{border-color:var(--brand);}
.section-anchor{scroll-margin-top:20px; transition:background .4s, box-shadow .4s; border-radius:var(--radius);}
.section-anchor.flash{background:var(--brand-soft); box-shadow:0 0 0 3px var(--brand-soft);}

/* ---- price table view ---- */
.price-table-wrap{margin:0 32px 40px; background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 26px;}
.price-table-head{display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap;}
table.price-editor{width:100%; border-collapse:collapse; font-size:14px;}
table.price-editor th{
  position:sticky; top:0; background:var(--panel-2); text-align:left; padding:8px 8px; font-size:12.5px;
  color:var(--ink-faint); font-weight:700; white-space:nowrap; border-bottom:1px solid var(--line);
}
table.price-editor td{padding:2px; border-bottom:1px solid var(--panel-2);}
table.price-editor input{
  width:100%; min-width:64px; border:1px solid transparent; background:none; padding:6px 6px; font-size:14px;
  border-radius:var(--radius-sm); font-family:var(--mono); color:var(--ink);
}
table.price-editor input:focus{border-color:var(--brand); background:#fff;}
table.price-editor input.txt{font-family:var(--sans); min-width:120px;}
.price-table-scroll{overflow-x:auto; max-height:70vh; overflow-y:auto; border:1px solid var(--line); border-radius:var(--radius);}
.row-del-btn{border:none; background:none; color:var(--red); cursor:pointer; font-size:16.5px; padding:4px 8px;}


/* ---- v2 업무 개선 ---- */
.manager-top{margin-top:14px;}
.manager-top label{display:block;font-size:12.5px;font-weight:800;color:var(--ink-faint);margin-bottom:5px;}
.manager-top input{width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-size:14px;background:var(--panel-2);outline:none;}
.manager-top input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(31,95,224,.10);}
.case-card-photo{margin-top:9px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#fff;}
.case-card-photo img{display:block;width:100%;max-height:150px;object-fit:cover;}
.case-card-substatus{font-size:12px;color:var(--ink-soft);margin-top:6px;font-weight:700;}
.case-tools{width:310px;display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:start;}
.case-tools .tool-status{grid-column:1/2;}
.case-tools .tool-memo{grid-column:2/3;grid-row:1/3;}
.case-tools label{display:block;font-size:12px;color:var(--ink-faint);font-weight:800;margin-bottom:4px;}
.case-tools select,.case-tools textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:7px 8px;font-size:13.5px;font-family:var(--sans);outline:none;}
.case-tools textarea{min-height:58px;resize:vertical;line-height:1.4;}
.progress-box{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:var(--radius);font-size:13.5px;font-weight:800;margin-top:8px;}
.process-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:800;margin-top:7px;margin-left:7px;}
.process-badge-restore{background:#E5F5EC;color:#1E8F5C;}
.process-badge-replace{background:#EAF0FF;color:#2F5FE0;}
.photo-panel{margin-top:18px;border:1px dashed #B8C7DD;border-radius:var(--radius);padding:14px;background:var(--panel-2);}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.photo-paste-area{display:none;margin-top:10px;padding:18px;border:2px dashed #9DB3D1;border-radius:var(--radius);background:white;text-align:center;color:var(--ink-soft);font-size:14.5px;outline:none;}
.photo-paste-area.show{display:block;}
.photo-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:12px;}
.photo-item{position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;}
.photo-item img{display:block;width:100%;height:135px;object-fit:cover;}
.photo-del{position:absolute;right:6px;top:6px;border:none;border-radius:var(--radius-sm);background:rgba(18,32,62,.78);color:white;padding:4px 7px;font-size:12.5px;cursor:pointer;}
.diamond-raw{font-family:var(--mono)!important;line-height:1.5!important;min-height:56px;}
.original-sheet-frame{max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);padding:10px;}
.original-sheet-frame img{display:block;max-width:none;width:auto;height:auto;background:white;box-shadow:0 2px 12px rgba(0,0,0,.12);}
.alarm-grid{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:10px;background:#fff;}
.alarm-row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line);}
.alarm-row:last-child{border-bottom:none;}
.alarm-key{background:var(--panel-2);font-weight:800;font-size:13.5px;padding:10px 12px;color:var(--ink-soft);}
.alarm-val{font-size:14.5px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;}
.accident-memo{min-height:60px!important;}
.inline-info-note{padding:10px 12px;background:#F2F6FC;border:1px solid #DCE6F5;border-radius:var(--radius);font-size:15px;color:var(--ink-soft);line-height:1.6;margin-top:10px;}
@media (max-width:1100px){
  .case-tools{width:100%;grid-template-columns:1fr;}
  .case-tools .tool-status,.case-tools .tool-memo{grid-column:auto;grid-row:auto;}
  .case-header-row{flex-wrap:wrap;}
}

::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:#C7D1E0; border-radius:var(--radius-pill);}
::-webkit-scrollbar-track{background:transparent;}



/* ---- V10: 접수 상태 필터 / 백업 ---- */
.case-filter-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.case-filter-btn{border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:var(--radius-pill);padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer;}
.case-filter-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.sidebar-backup-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
.sidebar-mini-btn{border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);padding:7px 6px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
.sidebar-mini-btn:hover{border-color:var(--brand);color:var(--brand-dark);}
.assignment-overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 18px;}
.assignment-overview-card{border:1px solid var(--line);background:var(--panel-2);border-radius:var(--radius);padding:11px 12px;min-width:0;}
.assignment-overview-card .lab{font-size:12px;color:var(--ink-faint);font-weight:800;margin-bottom:4px;}
.assignment-overview-card .main{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.assignment-overview-card .sub{font-size:13px;color:var(--ink-soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media (max-width:900px){.assignment-overview{grid-template-columns:1fr;}.sidebar-backup-row{grid-template-columns:1fr;}}

/* ---- 가맹점 · 협력점 연락망 ---- */
.shop-directory-wrap{margin:0 32px 40px;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 26px;}
.shop-directory-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.shop-tabs{display:flex;gap:7px;flex-wrap:wrap;}
.shop-tab{border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:var(--radius-pill);padding:7px 14px;font-size:14px;font-weight:700;cursor:pointer;}
.shop-tab.active{background:var(--brand);border-color:var(--brand);color:#fff;}
.shop-table-scroll{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:var(--radius);}
table.shop-directory{width:100%;min-width:1080px;border-collapse:collapse;font-size:14px;}
table.shop-directory th{position:sticky;top:0;z-index:2;background:var(--panel-2);padding:9px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line);color:var(--ink-faint);font-size:13px;}
table.shop-directory td{padding:9px 10px;border-bottom:1px solid var(--panel-2);vertical-align:top;}
table.shop-directory tr:hover td{background:var(--panel-2);}
.shop-type-badge{display:inline-flex;padding:3px 8px;border-radius:var(--radius-pill);font-size:12px;font-weight:800;white-space:nowrap;}
.shop-type-badge.franchise{background:var(--brand-soft);color:var(--brand-dark);}
.shop-type-badge.partner{background:var(--green-bg);color:var(--green);}
.shop-copy{border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);padding:4px 7px;cursor:pointer;font-size:12.5px;font-weight:700;white-space:nowrap;}
.shop-copy:hover{border-color:var(--brand);color:var(--brand-dark);}
.shop-note{max-width:260px;white-space:normal;line-height:1.45;color:var(--ink-soft);}
table.shop-directory-editable td{padding:2px;}
table.shop-directory-editable input, table.shop-directory-editable select{
  width:100%; min-width:90px; border:1px solid transparent; background:none; padding:7px 8px; font-size:13.5px;
  border-radius:var(--radius-sm); font-family:var(--sans); color:var(--ink);
}
table.shop-directory-editable input:focus, table.shop-directory-editable select:focus{border-color:var(--brand); background:#fff;}
table.shop-directory-editable input:hover, table.shop-directory-editable select:hover{background:var(--panel-2);}
table.shop-directory-editable .row-del-btn{font-size:12.5px;border:1px solid var(--line);border-radius:var(--radius-sm);white-space:nowrap;padding:5px 8px;}
table.shop-directory-editable .row-del-btn:hover{border-color:var(--red);background:var(--red-bg);}
/* 시공점명 · 대표자는 왼쪽 고정, 관리(삭제)는 오른쪽 고정 — 가운데 정보칸만 가로 스크롤 */
.shop-col-type{width:84px;min-width:84px;max-width:84px;}
.shop-col-name{width:170px;min-width:170px;max-width:170px;}
.shop-col-owner{width:110px;min-width:110px;max-width:110px;}
.shop-col-actions{width:230px;min-width:230px;max-width:230px;}
table.shop-directory .shop-col-frozen{position:sticky;background:#fff;z-index:3;box-shadow:2px 0 4px -2px rgba(24,34,56,.12);}
table.shop-directory thead .shop-col-frozen{background:var(--panel-2);z-index:5;}
table.shop-directory .shop-col-type{left:0;}
table.shop-directory .shop-col-name{left:84px;}
table.shop-directory .shop-col-owner{left:254px;}
table.shop-directory .shop-col-frozen-right{position:sticky;right:0;background:#fff;z-index:3;box-shadow:-2px 0 4px -2px rgba(24,34,56,.12);}
table.shop-directory thead .shop-col-frozen-right{background:var(--panel-2);z-index:5;}
table.shop-directory tr:hover .shop-col-frozen,
table.shop-directory tr:hover .shop-col-frozen-right{background:var(--panel-2);}
.shop-action-btns{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}

@media (max-width:900px){
  #sidebar{position:fixed; z-index:20; transform:translateX(-100%); transition:.2s; box-shadow:var(--shadow);}
  #sidebar.open{transform:translateX(0);}
  .step-body{margin:0 14px 30px; padding:18px;}
  .case-header{padding:16px 14px 0;}
  .footer-nav{margin:14px 14px 30px;}
  .field-row,.field-row3{grid-template-columns:1fr;}
}


/* ---- 처리내용 시트 연동 ---- */
.processing-sheet-box{margin-top:28px;border:1px solid var(--line);border-radius:var(--radius);background:#FBFCFE;padding:18px;}
.processing-sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px;}
.processing-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px;}
.processing-field{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-width:0;}
.processing-field .pf-label{font-size:12.5px;font-weight:800;color:var(--ink-soft);display:flex;align-items:center;gap:5px;}
.processing-field .pf-col{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);}
.processing-field input,.processing-field select,.processing-field textarea{width:100%;border:none;border-bottom:1px solid var(--line);outline:none;padding:7px 2px 5px;background:transparent;font-family:var(--sans);font-size:14.5px;color:var(--ink);}
.processing-field textarea{resize:vertical;min-height:54px;}
.processing-field .pf-note{font-size:12px;color:var(--amber);background:var(--amber-bg);border-radius:var(--radius-sm);padding:5px 7px;margin-top:6px;line-height:1.45;white-space:pre-wrap;}
.processing-field.formula{background:#F5F8FC;}
.processing-field.formula input{color:var(--ink-faint);font-family:var(--mono);}
.processing-copy-preview{margin-top:12px;font-family:var(--mono);font-size:13px;line-height:1.55;background:#fff;border:1px dashed var(--line);padding:10px 12px;border-radius:var(--radius);color:var(--ink-soft);overflow-x:auto;white-space:nowrap;}
@media (max-width:1100px){.processing-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:700px){.processing-grid{grid-template-columns:1fr;}}


/* ---- v6 사진 · 처리내용 엑셀형 UI ---- */
.case-card{user-select:none;}
.case-card-expandhint{font-size:11.5px;color:var(--ink-faint);margin-top:5px;}
.case-card-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);}
.case-card-thumb{height:86px;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:#fff;cursor:zoom-in;position:relative;}
.case-card-thumb img{display:block;width:100%;height:100%;object-fit:cover;}
.case-card-thumb .photo-num{position:absolute;left:5px;bottom:5px;background:rgba(18,32,62,.72);color:#fff;font-size:10.5px;padding:2px 5px;border-radius:var(--radius-sm);}
.photo-paste-area{display:block;min-height:92px;cursor:pointer;transition:.15s;}
.photo-paste-area.dragover{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(31,95,224,.12);}
.photo-item img{cursor:zoom-in;}
.photo-viewer{display:flex;flex-direction:column;align-items:center;gap:10px;}
.photo-viewer img{display:block;width:auto;height:auto;max-width:min(95vw,1400px);max-height:82vh;object-fit:contain;background:var(--ink);border-radius:var(--radius-sm);box-shadow:0 12px 36px rgba(0,0,0,.28);}
.photo-viewer-note{font-size:13.5px;color:var(--ink-soft);}
.photo-drop-title{font-weight:800;color:var(--brand-dark);font-size:14.5px;margin-bottom:4px;}

.processing-sheet-box{padding:0;background:#fff;overflow:hidden;border-color:#AAB3C2;}
.processing-sheet-head{padding:16px 18px 10px;margin:0;background:#F7F8FA;border-bottom:1px solid #CCD2DB;}
.excel-helpbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 12px;background:#F2F3F5;border-bottom:1px solid var(--line);font-size:13px;color:#424B57;}
.excel-helpbar .actions{display:flex;gap:7px;flex-wrap:wrap;}
.processing-excel-scroll{overflow:auto;max-width:100%;background:var(--line);padding-bottom:4px;}
.processing-excel-table{border-collapse:collapse;table-layout:fixed;min-width:2280px;background:#fff;font-family:var(--sans);font-size:12.5px;user-select:none;}
.processing-excel-table th,.processing-excel-table td{border:1px solid #A9A9A9;padding:0;vertical-align:middle;box-sizing:border-box;}
.processing-excel-table .excel-colletters th{height:22px;background:#E6E6E6;color:var(--ink-soft);font-weight:400;text-align:center;font-size:12px;border-color:#C6C6C6;}
.processing-excel-table .excel-signs td{height:20px;background:#BFBFBF;color:#D60000;text-align:center;font-weight:700;font-size:11.5px;}
.processing-excel-table .excel-header th{height:42px;background:#000;color:#fff;font-weight:700;text-align:center;white-space:pre-line;line-height:1.25;position:relative;}
.processing-excel-table .excel-header th.yellow{color:#FFFF00;}
.processing-excel-table .excel-header th.has-note:after{content:'';position:absolute;right:1px;top:1px;border-top:7px solid #E31D1D;border-left:7px solid transparent;width:0;height:0;}
.processing-excel-table .excel-data td{height:42px;text-align:center;background:#fff;color:var(--ink);white-space:pre-wrap;overflow:hidden;cursor:cell;padding:4px 5px;line-height:1.28;}
.processing-excel-table .excel-data td.money-green{background:#E2F0D9;}
.processing-excel-table .excel-data td.money-yellow{background:var(--amber-bg);}
.processing-excel-table .excel-data td.money-pink{background:#FCE4D6;}
.processing-excel-table .excel-data td.formula-cell{color:var(--ink-soft);background:#F6F7F9;}
.processing-excel-table .excel-data td.wide-note{text-align:left;overflow:visible;}
.processing-excel-table .excel-data td.proc-selected{background:var(--brand-soft)!important;outline:2px solid #217346;outline-offset:-2px;}
.processing-excel-table .excel-data td.proc-editing{background:#FFF!important;outline:2px solid #217346;outline-offset:-2px;user-select:text;cursor:text;}
.processing-excel-table .excel-data td:focus{outline:2px solid #217346;outline-offset:-2px;}
.excel-copy-status{padding:8px 12px;background:#fff;border-top:1px solid #D0D4D9;font-size:12.5px;color:var(--ink-soft);}
.excel-notes{padding:10px 12px;background:var(--amber-bg);border-top:1px solid #E7D8A3;font-size:12px;line-height:1.55;color:#78591F;}


/* ---- v7 업무성 개선 ---- */
.intake-compare{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:16px;align-items:stretch;}
.intake-panel{border:1px solid var(--line);border-radius:var(--radius);background:#FAFBFD;padding:14px;min-width:0;display:flex;flex-direction:column;}
.intake-panel h3{margin-top:0;}
.intake-panel .parsed-grid{grid-template-columns:1fr 1fr;gap:8px;}
.intake-panel textarea#rawText{min-height:280px;height:auto;resize:vertical;overflow-y:hidden;}
.intake-panel .intake-result-scroll{flex:1;overflow-y:visible;padding-right:2px;}
.intake-compare-note{font-size:12.5px;color:var(--ink-faint);margin-top:7px;line-height:1.5;}
@media(max-width:1180px){.intake-compare{grid-template-columns:1fr;}.intake-panel textarea#rawText{min-height:210px;height:auto;}.intake-panel .intake-result-scroll{min-height:0;max-height:none;}}

.case-tools{width:390px;grid-template-columns:120px 1fr;}
.case-tools .tool-save{grid-column:1/3;display:flex;justify-content:flex-end;gap:8px;align-items:center;}
.case-tools .save-hint{font-size:11.5px;color:var(--ink-faint);}
@media(max-width:1100px){.case-tools{width:100%;}.case-tools .tool-save{grid-column:auto;}}

.photo-item{user-select:none;}
.photo-item[draggable="true"],.case-card-thumb[draggable="true"]{cursor:grab;}
.photo-item[draggable="true"]:active,.case-card-thumb[draggable="true"]:active{cursor:grabbing;}
.photo-quick-actions{display:flex;gap:5px;padding:6px;background:var(--panel-2);border-top:1px solid var(--line);}
.photo-quick-actions .btn{flex:1;justify-content:center;padding:5px 7px;font-size:12px;}
.photo-drag-tip{margin-top:8px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--brand-soft);color:#284A82;font-size:13px;line-height:1.55;}

.assignment-checkboard{margin-top:16px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;}
.assignment-check-title{padding:10px 12px;background:#F3F6FA;font-size:13.5px;font-weight:800;color:var(--ink-soft);border-bottom:1px solid var(--line);}
.assignment-check-item{display:flex;align-items:flex-start;gap:9px;padding:11px 14px;border-radius:var(--radius-sm);margin-bottom:6px;font-size:14.5px;font-weight:700;line-height:1.45;}
.assignment-check-item:last-child{margin-bottom:0;}
.assignment-check-item.ok{color:var(--green);background:var(--green-bg);border:2px solid var(--green);}
.assignment-check-item.bad{color:var(--amber);background:var(--amber-bg);border:2px solid #E6B552;}
.assignment-check-dot{font-weight:900;min-width:15px;}
.assignment-blocked{margin-top:10px;padding:11px 14px;border:2px solid var(--red);border-radius:var(--radius);background:var(--red-bg);color:#9D2E2E;font-size:14.5px;font-weight:800;line-height:1.55;}
.no-match-banner{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:14px 16px;border:2.5px solid var(--red);border-radius:var(--radius);background:var(--red-bg);}
.no-match-icon{font-size:22px;line-height:1;flex:none;}
.no-match-title{font-size:16px;font-weight:900;color:#9D2E2E;}
.no-match-desc{font-size:14px;font-weight:600;color:#9D2E2E;margin-top:4px;line-height:1.55;}
.assignment-ready{margin-top:10px;padding:9px 11px;border:1px solid #B9DEC9;border-radius:var(--radius);background:var(--green-bg);color:var(--green);font-size:13.5px;font-weight:800;}
.assignment-confirm-row{display:flex;align-items:center;gap:10px;margin-top:10px;padding:11px 14px;border-radius:var(--radius);background:var(--amber-bg);border:2px solid #E6B552;font-size:15px;font-weight:800;color:#8A5A16;}
.assignment-confirm-row:has(input:checked){background:var(--green-bg);border-color:var(--green);color:var(--green);}
.assignment-confirm-row input{width:19px;height:19px;accent-color:currentColor;}
.tint-decision{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 10px;}
.tint-decision label{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-size:13.5px;font-weight:700;cursor:pointer;}
.tint-decision label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark);}
.assignment-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px;}
.assignment-summary-tile{padding:10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;min-width:0;}
.assignment-summary-tile .t{font-size:12px;color:var(--ink-faint);font-weight:800;}

.processing-excel-table .excel-data.pending-row td{background:var(--amber-bg)!important}.processing-excel-table .excel-data.alarm-pending td{color:#D00000!important;font-weight:700}.processing-excel-table .excel-data.alarm-sent td{color:var(--ink)!important}.processing-excel-table .excel-data.completed-row td{background:#fff}.processing-excel-table .excel-data.pending-row td.proc-selected{background:var(--brand-soft)!important}

.case-list{padding:12px 10px 22px;}
.case-card{padding:13px;border:1px solid transparent;border-radius:10px;margin-bottom:7px;}
.case-card:hover{background:#F7F9FC;border-color:var(--line);}
.case-card.active{background:var(--brand-soft);border-color:#BFCDF8;box-shadow:inset 3px 0 0 var(--brand);}
.case-plate{padding:3px 8px;background:#fff;border:1px solid #C9D5F7;color:var(--brand-dark);}

/* Header and top navigation */
.case-header{background:rgba(244,246,249,.92);backdrop-filter:blur(12px);padding:20px 28px 0;}
.case-header-row{align-items:center;}
.case-title{font-size:21px;letter-spacing:-.025em;}
.case-title .plate-badge{border-radius:8px;padding:6px 10px;font-size:18px;box-shadow:0 4px 12px rgba(36,87,214,.16);}
.case-title .model-text{font-size:16px;color:var(--ink-soft);}
.case-meta{font-size:14px;color:var(--ink-soft);font-weight:600;}
.delete-case{border:1px solid transparent;}
.step-tabs{gap:4px;margin-top:16px;padding-bottom:10px;}
.step-tab{padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink-soft);font-size:13.5px;}
.step-tab:hover{border-color:#AFC0E8;color:var(--brand-dark);background:#F8FAFF;}
.step-tab.active{border-color:var(--brand);box-shadow:0 3px 10px rgba(36,87,214,.17);}
.step-tab.current-stage:not(.active){border-color:#B9C8F0;background:var(--brand-soft);}

/* Main surfaces */
.step-body,.price-table-wrap,.shop-directory-wrap{
  margin:18px 28px 34px;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 28px;
}
.step-body{margin-top:18px!important;}
h3.section-title{font-size:17px;letter-spacing:-.025em;color:var(--ink);}
p.section-sub{font-size:14px;margin-bottom:19px;color:var(--ink-soft);}
.section-anchor+.section-anchor{border-top:1px solid var(--line);padding-top:24px;margin-top:24px;}
.subnav{padding:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;gap:6px;}
.subnav-item{background:transparent;border-color:transparent;border-radius:7px;padding:7px 11px;font-size:13px;}
.subnav-item:hover{background:#fff;border-color:var(--line);}

/* Forms */
label.field-label{font-size:13px;color:#445168;margin-bottom:7px;}
textarea.field,input.field,select.field,.case-tools select,.case-tools textarea{
  min-height:42px;border-color:var(--line-strong);background:#fff;border-radius:8px;padding:10px 11px;
}
textarea.field{line-height:1.65;}
.field:focus,.case-tools select:focus,.case-tools textarea:focus{
  border-color:var(--brand);box-shadow:0 0 0 3px rgba(36,87,214,.11);
}
.parsed-grid{gap:7px;}
.parsed-item{padding:6px 9px;background:var(--panel-2);border-radius:8px;}
.parsed-item.key-field{background:var(--brand-soft);border-color:#B9C8F0;}

/* Buttons and selectable controls */
.btn{min-height:40px;border-width:1px;border-radius:8px;padding:9px 15px;font-size:13.5px;justify-content:center;}
.btn:hover{transform:translateY(-1px);}
.btn-primary{box-shadow:0 3px 9px rgba(36,87,214,.16);}
.btn-ghost{border-color:var(--line-strong);background:#fff;}
.btn-sm{min-height:32px;padding:6px 11px;font-size:12.5px;}
.chip-row{gap:7px;}
.chip{min-height:36px;padding:7px 13px;border-color:var(--line-strong);border-radius:8px;font-size:13.5px;}
.chip:hover{border-color:var(--brand);color:var(--brand-dark);background:#F8FAFF;}
.chip.active{box-shadow:0 3px 9px rgba(36,87,214,.15);}
.copy-block{background:var(--panel-2);border-color:var(--line);border-radius:9px;}
.copy-label{font-size:12px;letter-spacing:.04em;}

/* Cards and status */
.workflow-stage,.part-card,.franchise-item,.processing-field,.assignment-overview-card,.photo-panel,.photo-archive-box{
  border-color:var(--line);border-radius:10px;box-shadow:none;
}
.workflow-stage{padding:16px;background:#fff;}
.workflow-stage.done{border-color:#A8D7C4;background:#F2FBF7;box-shadow:inset 3px 0 0 var(--green);}
.workflow-stage.wait-photo{border-color:#E7C487;background:#FFF9EF;box-shadow:inset 3px 0 0 var(--amber);}
.assignment-overview-card{background:#fff;padding:13px;}
.status-pill,.process-badge,.progress-box{border-radius:7px;}
.total-banner{background:linear-gradient(135deg,#172033 0%,#273A60 100%);border-radius:10px;box-shadow:0 7px 18px rgba(23,32,51,.16);}
.price-tile{border-width:1px;border-color:var(--line);border-radius:9px;}
.price-tile.hl{border-width:2px;border-color:var(--brand);}
.reminder-badge,.inline-info-note{border:1px solid rgba(185,107,8,.18);}

/* Tables */
.price-table-scroll,.shop-table-scroll{border-color:var(--line);border-radius:10px;background:#fff;}
table.price-editor th,table.shop-directory th{background:#F3F6FA;color:#536077;font-size:12px;letter-spacing:.01em;}
table.price-editor td,table.shop-directory td{border-bottom-color:#E9EDF3;}
table.shop-directory tr:hover td{background:#F7F9FC;}
.processing-sheet-box{border-color:var(--line-strong);border-radius:10px;box-shadow:var(--shadow-sm);}
.processing-sheet-head{background:#F6F8FB;border-bottom-color:var(--line);}

/* Overlays and feedback */
.modal-overlay{background:rgba(15,23,42,.48);backdrop-filter:blur(3px);}
.modal-box{border:1px solid rgba(255,255,255,.6);box-shadow:0 24px 70px rgba(15,23,42,.26);}
.modal-close{background:var(--gray-bg);color:var(--ink-soft);}
.toast{border-radius:8px;box-shadow:0 12px 32px rgba(15,23,42,.25);}
.footer-nav{margin:14px 28px 34px;}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#BCC6D4;border:2px solid transparent;background-clip:padding-box;}

@media(max-width:900px){
  #sidebar{width:286px;min-width:286px;}
  .case-header{padding:14px 14px 0;}
  .step-body,.price-table-wrap,.shop-directory-wrap{margin:12px 12px 24px;padding:19px 16px;border-radius:12px;}
  .step-tabs{padding-bottom:8px;}
  .step-tab{padding:8px 11px;}
  .footer-nav{margin:12px 12px 26px;}
}

/* ===== V37: 업무상태·메모사항 정렬 정리 — px 단위로 라벨선·입력창선·높이·여백을 통일 ===== */
.case-tools,.case-tools *{box-sizing:border-box;}
.case-tools{width:420px;display:flex;flex-direction:column;gap:10px;}
.case-tools .case-tools-row{display:flex;gap:12px;align-items:flex-start;grid-column:auto;grid-row:auto;}
.case-tools .case-tools-row .tool-status{flex:0 0 140px;display:flex;flex-direction:column;grid-column:auto;grid-row:auto;}
.case-tools .case-tools-row .tool-memo{flex:1;min-width:0;display:flex;flex-direction:column;grid-column:auto;grid-row:auto;}
/* 라벨선: 두 칼럼 모두 높이 20px, 세로 중앙정렬로 베이스라인 통일 */
.case-tools .tool-status>label,
.case-tools .tool-memo-head{
  height:20px;line-height:20px;margin:0 0 8px!important;padding:0;
  font-size:12px;font-weight:800;color:var(--ink-faint);
  display:flex;align-items:center;
}
.case-tools .tool-memo-head{justify-content:space-between;width:100%;}
.case-tools .tool-memo-head label{height:20px;line-height:20px;margin:0!important;padding:0;font-size:12px;font-weight:800;color:var(--ink-faint);}
.case-tools .tool-memo-head .btn{height:20px;min-height:20px;line-height:1;padding:0 10px;font-size:12px;display:inline-flex;align-items:center;border-radius:6px;}
/* 입력창선: 라벨(20px)+여백(8px)=28px 지점에서 두 칼럼 모두 동일하게 시작 */
.case-tools .tool-status select,
.case-tools .tool-memo textarea{
  width:100%;height:40px;min-height:40px;
  border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font-size:13.5px;font-family:var(--sans);
  background:#fff;line-height:1.4;
}
.case-tools .tool-memo textarea{resize:vertical;}
.case-tools .tool-hold{grid-column:auto;grid-row:auto;width:100%;}
.case-tools .tool-hold label{height:20px;line-height:20px;margin:0 0 8px!important;font-size:12px;font-weight:800;color:var(--ink-faint);display:flex;align-items:center;}
.case-tools .tool-hold input{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;}
@media(max-width:1100px){.case-tools{width:100%;}}
@media(max-width:640px){.case-tools .case-tools-row{flex-direction:column;}.case-tools .case-tools-row .tool-status{flex:none;width:100%;}}

/* ===== V36: 단계 탭 · 서브탭 · 카드열 간격 통일 ===== */
.step-tabs,.subnav,.attention-tabs{gap:8px!important;}
.step-tabs{margin-top:18px!important;}
.subnav{margin:0 0 18px!important;}
.assignment-overview{gap:8px!important;margin:0 0 22px!important;}

/* ===== V37: 대표님 확정 배정금액 카드 — 위 카드열과 동일한 너비, 2칸 나란히 배열 ===== */
.assignment-cost-card{max-width:none!important;}
.assignment-cost-card .assignment-cost-row{grid-template-columns:1fr 1fr;}

:root{
  --v34-navy:#17315f;--v34-blue:#2563eb;--v34-blue-soft:#eff6ff;--v34-line:#dbe3ef;
  --v34-bg:#f5f7fb;--v34-card:#fff;--v34-text:#162033;--v34-muted:#667085;
  --v34-radius:14px;--v34-shadow:0 8px 24px rgba(23,49,95,.07);
}
body{background:var(--v34-bg);color:var(--v34-text);letter-spacing:-.01em}
.app-header,.topbar{border-bottom:1px solid var(--v34-line);box-shadow:0 3px 14px rgba(23,49,95,.06)}
.sidebar,.attention-sidebar{background:#fff;border-color:var(--v34-line)}
.case-card,.part-card,.assignment-overview-card,.followup-box,.alarm-grid,.tint-guide,.call-header-extra{
  border:1px solid var(--v34-line)!important;border-radius:var(--v34-radius)!important;background:var(--v34-card)!important;
  box-shadow:var(--v34-shadow)!important;
}
.section-title{font-size:18px!important;line-height:1.35;color:var(--v34-navy)!important;letter-spacing:-.025em;margin-bottom:5px!important}
.section-sub{color:var(--v34-muted)!important;line-height:1.6!important;margin-top:0!important}
.field-label{display:block;color:#344054!important;font-size:13px!important;font-weight:750!important;margin:14px 0 6px!important}
.field,.field-input,input.field,textarea.field,select.field{border:1px solid #cfd8e6!important;border-radius:10px!important;background:#fff!important;color:var(--v34-text)!important;min-height:42px;transition:border-color .15s,box-shadow .15s,background .15s}
.field:hover,.field-input:hover{border-color:#aab9cf!important}
.field:focus,.field-input:focus{border-color:var(--v34-blue)!important;box-shadow:0 0 0 3px rgba(37,99,235,.12)!important;outline:0!important}
textarea.field{min-height:112px;line-height:1.62;padding:11px 12px!important;resize:vertical}
.btn,.global-tool-btn,.step-tab,.subnav-item,.attention-tab,.alarm-copy-btn{border-radius:10px!important;font-weight:750!important;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s!important}
.btn:active,.global-tool-btn:active,.step-tab:active,.subnav-item:active{transform:translateY(1px)}
.btn-primary{background:var(--v34-blue)!important;border-color:var(--v34-blue)!important;box-shadow:0 4px 10px rgba(37,99,235,.18)}
.btn-ghost,.global-tool-btn{background:#fff!important;border:1px solid var(--v34-line)!important;color:#344054!important}
.step-tabs,.subnav,.attention-tabs{gap:7px!important;padding:7px!important;background:#edf2f8!important;border:1px solid var(--v34-line)!important;border-radius:13px!important}
.step-tab,.subnav-item,.attention-tab{border:0!important;background:transparent!important;color:#58677c!important;min-height:40px!important}
.step-tab.active,.subnav-item.active,.attention-tab.active{background:#fff!important;color:var(--v34-blue)!important;box-shadow:0 2px 8px rgba(23,49,95,.10)!important}
.v34-customer-check{margin:14px 0 22px;padding:18px;border:1px solid var(--v34-line);border-radius:16px;background:linear-gradient(180deg,#fff,#fbfcff);box-shadow:var(--v34-shadow)}
.v34-customer-check__top{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
.v34-field-card{min-width:0;padding:14px;border:1px solid #e2e8f2;border-radius:12px;background:#fff}
.v34-field-card .field-label:first-child{margin-top:0!important}
.v34-guide{margin-top:9px;border:1px solid #e9c96c;border-radius:10px;background:#fff9e8;overflow:hidden}
.v34-guide summary{cursor:pointer;list-style:none;padding:10px 12px;color:#78550a;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.v34-guide summary::-webkit-details-marker{display:none}.v34-guide summary:after{content:'＋';font-size:17px}.v34-guide[open] summary:after{content:'−'}
.v34-guide__body{padding:0 12px 12px;color:#725518;font-size:12.5px;line-height:1.65}
.alarm-row{display:grid!important;grid-template-columns:minmax(130px,.32fr) minmax(260px,1fr) auto!important;gap:10px!important;padding:11px!important;border-bottom:1px solid #e7ecf3!important}
.alarm-row:last-child{border-bottom:0!important}.alarm-key{padding-top:10px!important;color:#344054!important;font-weight:800!important}.alarm-val{width:100%!important}
.assignment-summary-tile{border:1px solid var(--v34-line)!important;border-radius:12px!important;background:#f8faff!important;padding:12px!important}
.assignment-address-change{margin:10px 0 14px}
.assignment-address-toggle{min-width:112px}
.assignment-address-panel{margin-top:9px;padding:15px;border:1px solid #a9c1ec;border-radius:12px;background:#f7faff}
.assignment-address-title{font-size:15px;font-weight:800;color:#244b86}.assignment-address-help{font-size:12.5px;color:var(--v34-muted);margin-top:4px;line-height:1.5}
.assignment-original-address{font-size:12.5px;color:#475467;margin-top:9px;padding:8px 10px;background:#fff;border:1px solid #dbe3ef;border-radius:8px}
.assignment-address-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* 고객 통화 화면은 문구 사이의 과도한 공백을 줄여 한 흐름으로 읽히게 한다. */
#stepBody .copy-label{margin-top:11px;margin-bottom:3px;letter-spacing:0;text-transform:none}
#stepBody .copy-block{margin-top:5px;padding-top:12px;padding-bottom:12px;line-height:1.62}
#stepBody .call-result-box{margin-top:11px;padding:12px}
#stepBody .faq-details{margin-top:11px}
#stepBody .followup-box{margin-top:11px!important}
@media(max-width:900px){.v34-customer-check__top{grid-template-columns:1fr}.alarm-row{grid-template-columns:1fr!important}.alarm-key{padding-top:0!important}.alarm-copy-btn{justify-self:start}.step-tabs,.subnav{overflow-x:auto;flex-wrap:nowrap!important}}



.call-header-extra-grid{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:14px!important;padding:14px!important;margin-top:0!important;align-items:stretch!important}
.call-header-extra-grid>.v35-confirm-field{min-width:0;display:flex;flex-direction:column;padding:0!important}
.call-header-extra-grid>.v35-confirm-field .field-label{margin:0 0 6px!important}
.call-header-extra-grid>.v35-confirm-field textarea{flex:1;min-height:104px!important}
.call-header-extra-grid #deductible{width:100%}
.call-header-extra .v34-guide{margin-top:9px!important}
@media(max-width:760px){.call-header-extra-grid{grid-template-columns:1fr!important}}



/* =====================================================================
   V38: 사이트 전체 디자인 시스템 통일 레이어
   - 기능/데이터 처리 로직은 건드리지 않고, 간격·정렬·카드·버튼·입력창 규칙만 통일합니다.
   - 8px 그리드 기준, 카드 내부 여백 20~24px, 카드 사이 간격 16~20px,
     입력창/버튼 기본 높이 44~48px 규칙을 사이트 전역에 적용합니다.
   ===================================================================== */
:root{
  --v38-sp-1:8px; --v38-sp-2:16px; --v38-sp-3:24px;
  --v38-card-pad:22px; --v38-card-gap:18px;
  --v38-control-h:46px;
  --v38-content-max:1180px;
  --v38-radius:14px;
}

/* 본문 최대 너비를 잡아 화면 중앙에 안정적으로 정렬 (1920px 이상 대응) */
/* min-width:0은 step-body가 flex 부모(#main)보다 넓어져 오른쪽 고정 패널과 겹치는 것을 막습니다 */
.step-body{max-width:var(--v38-content-max);width:100%!important;margin-left:28px!important;margin-right:auto!important;box-sizing:border-box;min-width:0!important;}
#main{min-width:0!important;}

/* ---------- 상단 고정 단계 메뉴: 겹침 방지 + 세로 중앙 정렬 ---------- */
/* 단계 탭이 좁은 화면에서 가로 스크롤로 잘려 보이는 문제가 있어, 다 안 들어가면 다음 줄로 자연스럽게 줄바꿈되게 합니다 */
.step-tabs{display:flex!important;align-items:stretch!important;gap:var(--v38-sp-1)!important;flex-wrap:wrap!important;overflow-x:visible!important;overflow-y:hidden!important;padding:7px!important;}
.step-tab{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-height:44px!important;height:auto!important;padding:9px 16px!important;line-height:1.3!important;white-space:nowrap!important;box-sizing:border-box!important;}
.step-tab .num{position:static!important;margin-right:5px!important;}
.step-tab.done:not(.active)::after{top:7px!important;right:7px!important;}
@media(max-width:900px){.step-tabs{flex-wrap:wrap!important;}}

/* ---------- 카드류 통일: 여백 · 모서리 · 카드 사이 간격 ---------- */
.part-card,.franchise-item,.processing-field,.photo-panel,.photo-archive-box,
.followup-box,.call-header-extra,.intake-deductible-card,
.absence-flow,.workflow-stage,.alarm-send-settings,.assignment-cost-card,
.franchise-info-card,.faq-details,.tint-spec-choice,.tint-product-picker{
  box-sizing:border-box;
  border-radius:var(--v38-radius)!important;
}
.part-card,.franchise-item,.processing-field,.photo-panel,.photo-archive-box,
.followup-box,.intake-deductible-card,.absence-flow,.workflow-stage,
.alarm-send-settings,.assignment-cost-card{
  padding:var(--v38-card-pad)!important;
  margin-top:var(--v38-card-gap)!important;
}

/* ---------- 입력칸 / 버튼 기본 높이 통일 (자동 줄바꿈 복사 텍스트영역은 제외) ---------- */
select.field,
input.field:not([type="checkbox"]):not([type="date"]),
.chip-row .chip{
  min-height:var(--v38-control-h)!important;
  box-sizing:border-box!important;
  display:inline-flex;align-items:center;
}
input.field:not([type="checkbox"]){min-height:var(--v38-control-h)!important;box-sizing:border-box!important;}
.btn{min-height:42px!important;box-sizing:border-box!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;}
.btn.btn-sm{min-height:36px!important;}
/* 상단 업무상태/메모사항 저장 버튼은 V37에서 픽셀 단위로 맞춘 높이를 그대로 유지합니다 */
.case-tools .tool-memo-head .btn{min-height:20px!important;height:20px!important;}
.alarm-copy-btn{min-height:0!important;}

/* 라벨과 입력칸 사이 간격 8px 통일 */
.field-label{display:block;margin-bottom:var(--v38-sp-1)!important;}

/* ---------- 발송 제목 / 알림톡 템플릿 / 시공점 연락처 ---------- */
.alarm-send-settings{background:#fff;border:1px solid var(--line);}
.alarm-send-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--v38-sp-2);align-items:start;}
.alarm-send-field{min-width:0;}
.alarm-title-row{display:flex;gap:8px;align-items:stretch;}
.alarm-title-row textarea.field{flex:1;min-height:var(--v38-control-h)!important;resize:vertical;}
.alarm-title-row select.field{flex:1;}
.alarm-title-row .btn{flex:none;white-space:nowrap;}
.alarm-shop-contact{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:var(--v38-sp-2);padding:11px 13px;border:1px solid #c9daf7;border-radius:10px;background:#eef5ff;color:#244b86;font-size:13.5px;line-height:1.5;}
.alarm-shop-contact-label{font-weight:800;flex:none;}
.alarm-shop-contact-info{flex:1;min-width:160px;word-break:break-word;}
.alarm-send-note{font-size:13px;color:var(--ink-faint);margin-top:var(--v38-sp-1);line-height:1.55;}
@media(max-width:760px){.alarm-send-grid{grid-template-columns:1fr;}}

/* ---------- 차종·차량번호 등 항목명/내용/복사 버튼 3열 목록 ---------- */
.alarm-key{display:flex;align-items:center;}
.alarm-val{display:flex;align-items:center;word-break:break-word;}
.alarm-copy-btn{min-width:52px;}

/* ---------- 긴 문구·차량정보가 카드 밖으로 넘치지 않도록 ---------- */
.step-body, .part-card, .franchise-item, .processing-field, .call-result-box,
.alarm-send-settings, .alarm-shop-contact, .model-select-note, .strong-info-banner{
  word-break:break-word;overflow-wrap:break-word;
}
.step-body{overflow-x:hidden;}
.intake-panel, .intake-compare{min-width:0;}

/* 브라우저 확대율 100% 기준, 1366~1920px 사이에서 카드/칩/버튼이 줄바꿈되며 무너지지 않도록 */
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.field-row{flex-wrap:wrap;}



.restore-to-replace-btn{border:1.5px solid #d18a3a!important;background:#fff7ec!important;color:#8a5416!important;font-weight:800!important;}
.restore-to-replace-btn:hover{background:#fdeecf!important;}
.restore-to-replace-btn.active{background:#d18a3a!important;color:#fff!important;border-color:#d18a3a!important;}
.restore-to-replace-panel{margin-top:10px;border:1.5px solid #d18a3a;background:#fff7ec;border-radius:var(--radius);padding:14px 16px;}
.restore-to-replace-panel .t{font-weight:800;color:#8a5416;margin-bottom:6px;}
.restore-to-replace-panel .d{font-size:13.5px;color:#6e5a30;line-height:1.55;}



/* =====================================================================
   V42: 전면 정렬/간격 정돈 레이어 (기능·문구·데이터 로직 변경 없음, 디자인/레이아웃만)
   - 8px 그리드: 최소 간격 8px, 요소 간격 12~16px, 섹션 간격 24px
   - 버튼/입력창/드롭다운 기본 높이를 하나의 기준(42px)으로 통일
   - 기존 V38 변수(--v38-control-h 등)를 재정의해 이미 이 변수를 쓰는 곳까지 함께 정돈
   ===================================================================== */
:root{
  --v38-control-h:42px;
  --v38-card-pad:24px;
  --v38-card-gap:16px;
}

/* ---------- 버튼: 높이 통일 + 글자 길이에 따라 높이가 바뀌거나 줄바꿈되지 않도록 ---------- */
.btn{
  min-height:var(--v38-control-h)!important;
  height:auto;
  padding:9px 16px!important;
  white-space:nowrap;
  box-sizing:border-box!important;
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  line-height:1.2;
}
.btn.btn-sm{min-height:34px!important;padding:6px 12px!important;font-size:12.5px;}
/* 상단 업무상태/메모사항 저장 버튼은 기존 V37 픽셀 높이를 그대로 유지 */
.case-tools .tool-memo-head .btn{min-height:20px!important;height:20px!important;padding:0 8px!important;}
.alarm-copy-btn{min-height:0!important;}

/* ---------- 입력창 · 드롭다운: 버튼과 동일한 기준 높이 ---------- */
select.field,
input.field:not([type="checkbox"]):not([type="date"]){
  min-height:var(--v38-control-h)!important;
  box-sizing:border-box!important;
}

/* ---------- 같은 줄에 놓인 버튼/입력창의 세로 중앙선을 맞춤 ---------- */
.chip-row,.field-row,.assignment-address-actions,.absence-checks,
.alarm-title-row,.franchise-copy-actions,.case-info-grid,
.sidebar-backup-row,.attention-tabs{
  align-items:center;
}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:760px){.field-row{grid-template-columns:1fr;}}

/* ---------- 우측 상단 유틸리티 툴바: 버튼 높이·간격이 고른 그리드로 재배치 ---------- */
#globalUtility{
  display:grid!important;
  grid-auto-flow:row;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:8px!important;
  align-items:stretch!important;
  padding:12px 14px!important;
}
#globalUtility .manager-top{grid-column:1/-1;display:flex!important;align-items:center;gap:8px;margin:0 0 4px 0!important;}
#globalUtility .manager-top input{min-height:var(--v38-control-h);}
#globalUtility .sidebar-backup-row{grid-column:1/-1;display:grid!important;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px!important;margin:0!important;}
#globalUtility .global-tool-btn,#globalUtility .sidebar-mini-btn{
  min-height:var(--v38-control-h);
  box-sizing:border-box;
  display:inline-flex;align-items:center;justify-content:center;
  white-space:nowrap;
  padding:8px 10px;
}

/* ---------- 하단 이전/다음 버튼 영역: 본문(step-body)과 동일한 폭으로 중앙 정렬 ---------- */
.footer-nav{
  max-width:var(--v38-content-max);
  width:auto;
  margin-left:auto!important;
  margin-right:auto!important;
  box-sizing:border-box;
  align-items:center;
}

/* ---------- 카드류: 섹션 제목과 본문 사이 간격 통일 ---------- */
.section-title{margin-bottom:8px;}
.section-sub{margin-bottom:16px;}

/* ---------- 라벨 - 입력창 수직 정렬: 같은 field-row 안에서 라벨 높이를 맞춰 입력창 시작선을 통일 ---------- */
.field-row>div{display:flex;flex-direction:column;}
.field-row .field-label{min-height:20px;}



/* 계약면책금/사고경과 메모 줄에서는 위쪽 시작선을 맞춥니다 (전체 공통 규칙보다 뒤에 와서 우선 적용) */
.deductible-memo-row{align-items:start!important;}

/* 파손사진 첨부 박스를 크고 장식적인 드롭존 대신 얇은 한 줄 안내로 축소 */
.photo-paste-area{
  min-height:0!important;
  padding:9px 12px!important;
  text-align:left!important;
  font-size:12.5px!important;
  color:var(--ink-faint)!important;
  border-style:dashed;
}
.photo-drop-title{display:none;}

/* 사진 카드의 복사/저장/삭제 버튼이 3개가 한 줄에 들어가도 잘리지 않도록 */
.photo-item{min-width:0;}
.photo-gallery{grid-template-columns:repeat(auto-fill,minmax(178px,1fr));}
.photo-quick-actions{padding:6px!important;gap:4px!important;flex-wrap:nowrap!important;}
.photo-quick-actions .btn{
  min-height:30px!important;
  height:30px!important;
  padding:0 4px!important;
  font-size:11.5px!important;
  white-space:nowrap!important;
  flex:1 1 0!important;
  min-width:0!important;
  overflow:hidden;
  text-overflow:ellipsis;
}



/* 검색창: 박스 자체를 오른쪽으로 붙여서 배치 (너비를 줄여야 오른쪽 정렬이 실제로 보임) */
.sidebar-search{display:flex;justify-content:flex-end;}
.sidebar-search input{width:82%;text-align:left;}

/* 미완료/완료대기/전체 필터 버튼도 검색창과 같은 기준으로 오른쪽 정렬 */
.case-filter-row{justify-content:flex-end;}

/* 담당자명 영역 접기/펼치기 토글 — 접으면 썬팅단가표 버튼 등 나머지 상단 툴바 전체가 함께 접힘 */
#globalUtility{padding-right:44px!important;}
.gu-toggle-btn{position:absolute;top:8px;right:8px;z-index:2;border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 8px;font-size:11.5px;font-weight:800;color:var(--ink-soft);cursor:pointer;}
.gu-toggle-btn:hover{border-color:var(--brand);color:var(--brand-dark);}
#globalUtility.gu-collapsed{padding:8px 44px 8px 14px!important;min-height:0!important;}
#globalUtility.gu-collapsed>*:not(.gu-toggle-btn){display:none!important;}

/* 단계 탭(상태바)과 본문 박스 사이 여백을 넉넉하게 */
.step-tabs{margin-bottom:14px!important;}
.step-body{margin-top:30px!important;}

/* 다이아몬드 조회결과 붙여넣기 칸을 절반 정도로 축소 */
#partPasteAll.diamond-raw{min-height:56px!important;}

/* 부품명 · 부품번호 · 부품단가를 한 줄로 정렬 */
.assignment-parts-row{display:grid;grid-template-columns:1.4fr 1.2fr 1fr;gap:14px;margin-top:16px;}
@media(max-width:760px){.assignment-parts-row{grid-template-columns:1fr;}}

/* 유리복원 양식: 사진판정 메뉴와 파손사진 저장 메뉴를 양옆으로 배열 */
.v45-photo-judge-row{display:flex;gap:16px;align-items:stretch;margin:14px 0;}
.v45-photo-judge-row>.v45-judge-box{margin:0;flex:1 1 0;min-width:0;}
.v45-photo-judge-row>.photo-panel{flex:1 1 0;min-width:0;}
@media(max-width:900px){.v45-photo-judge-row{flex-direction:column;}}

/* 배정비용 확인받기: 번호별(①②③④⑤) 메뉴를 각각 박스로 뚜렷하게 구분 */
.section-anchor{border:1px solid var(--line);border-radius:14px;background:#fff;padding:18px 20px;box-shadow:0 1px 3px rgba(24,34,56,.05);}
.section-anchor+.section-anchor{border-top:1px solid var(--line);padding-top:18px;}

/* 미완료 카드 상단에 접수일자 · 경과일을 바로 보이게 표시 */
.attention-card-date{font-size:12.5px;font-weight:800;color:var(--brand-dark);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.attention-card-date .elapsed{color:#B45309;font-weight:800;margin-left:2px;}
.attention-detail-toggle{border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
.attention-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:2px 0 8px;padding:8px 9px;background:#F6F8FC;border:1px solid var(--line);border-radius:8px;}
.attention-detail-item{display:flex;flex-direction:column;gap:1px;font-size:12.5px;min-width:0;}
.attention-detail-item .k{color:var(--ink-faint);font-weight:700;font-size:11px;}
.attention-detail-item .v{color:var(--ink);font-weight:700;white-space:normal;overflow-wrap:anywhere;min-width:0;}
/* 카드 오른쪽에 삭제(×) 버튼 공간을 확보하려고 우측 여백이 좌측보다 넓었던 것을 박스 요소들만 좌우 대칭으로 보정 */
.attention-card .attention-franchise-box,
.attention-card .attention-detail-grid,
.attention-card .attention-summary-row,
.attention-card .attention-namdonggu-warn,
.attention-card .attention-reason-banner,
.attention-card .attention-card-memo{margin-right:-26px!important;}

/* 검색창 · 필터 버튼을 오른쪽 패널 상단으로 옮긴 뒤의 스타일 */
#attentionSidebar .sidebar-search{margin:0 0 8px;}
#attentionSidebar .sidebar-search input{width:100%;}
#attentionSidebar .case-filter-row{justify-content:flex-start;margin:0 0 4px;}



/* 옛 왼쪽 케이스 목록/필터(#caseList, #caseFilterRow)는 더 이상 사용하지 않습니다.
   접수 목록은 오른쪽 패널(미완료 · 완료대기 · 전체)로 통일합니다. */
#caseList{display:none!important;}
#caseFilterRow{display:none!important;}



/* 알림톡 입력칸: 복사 버튼을 입력칸 왼쪽에 배치(항목명·복사·입력칸 순서), 스크롤 없이 내용에 맞게 늘어남 */
.alarm-row{grid-template-columns:140px 58px 1fr!important;gap:8px!important;align-items:stretch!important;}
.alarm-copy-btn{border-left:1px solid var(--line)!important;border-right:1px solid var(--line)!important;}
.alarm-val{overflow:hidden!important;resize:none!important;}
@media(max-width:900px){.alarm-row{grid-template-columns:100px 50px 1fr!important;}}



/* =====================================================================
   v46: 화면 전체 좌우 정렬 기준 통일
   상단 01~06 단계 상태바(.case-header 안의 .step-tabs)와 아래 본문 카드(.step-body)가
   서로 다른 margin/padding 값을 쓰고 있어서 좌우 시작선·끝선이 어긋나 있었습니다.
   두 영역을 동일한 max-width · 좌우 padding · margin(auto 중앙정렬) 기준으로 통일합니다.
   기능·문구·데이터·버튼 동작은 건드리지 않고 가로 정렬 값만 맞춥니다.
   (데스크톱 기준. 900px 이하 모바일 레이아웃은 기존 값을 그대로 둡니다.)
   ===================================================================== */
@media(min-width:901px){
  .case-header,
  .step-body{
    box-sizing:border-box!important;
    width:100%!important;
    max-width:var(--v38-content-max,1180px)!important;
    margin-left:auto!important;
    margin-right:auto!important;
    padding-left:28px!important;
    padding-right:28px!important;
  }
  /* step-tabs 자체에 걸려있던 좌우 padding이 case-header 기준선보다 더 안쪽으로 밀어넣고 있던 것을 제거 */
  .step-tabs{
    padding-left:0!important;
    padding-right:0!important;
    margin-left:0!important;
    margin-right:0!important;
  }
}
/* 단톡방 원본 / 자동 추출 결과: 정확히 1:1 비율 2열 + 동일 간격 */
.intake-compare{grid-template-columns:1fr 1fr!important;gap:16px!important;}



/* 업무상태·메모사항 박스를 예전처럼 오른쪽 정렬 · 좁은 폭으로 되돌리고,
   접수일자는 그 박스(저장 버튼) 바로 위 우측 상단 코너에 작게 배치합니다. */
.case-tools-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;}
.ht-created-corner{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-faint);font-weight:800;}
.ht-created-corner input{border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:12.5px;font-family:inherit;font-weight:600;color:var(--ink);outline:none;}
.case-tools-wrap .case-tools{width:320px;}
.case-header .tool-hold{margin:8px 0 0;}
.case-header .case-info-grid{margin-top:12px;}
@media(max-width:900px){
  .case-header-row{flex-direction:column;align-items:stretch!important;}
  .case-tools-wrap{align-items:stretch;width:100%;}
  .case-tools-wrap .case-tools{width:100%;}
  .ht-created-corner{align-self:flex-end;}
}
/* "접수 확인" 큰 제목을 네모 박스 안으로 */
.section-title-box{display:inline-block;padding:8px 16px;border:1.5px solid var(--line);border-radius:10px;background:#fff;margin:0 0 14px;}
/* 계약면책금: 라벨과 입력칸을 한 줄로, 칸을 나눠서 표시 */
.deductible-inline-field{display:flex!important;flex-direction:row!important;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;height:42px;}
.deductible-inline-field label{flex:none;display:flex;align-items:center;padding:0 12px;background:#F6F8FC;border-right:1px solid var(--line);font-size:13px;white-space:nowrap;}
.deductible-inline-field input{flex:1;border:none!important;border-radius:0!important;height:100%;}
/* 계약면책금 · 사고경과 메모는 왼쪽 칸에 위아래로, "면책금 안내 참고사항"은 오른쪽 칸에 두 칸 높이로 배치 */
.deductible-memo-row{align-items:stretch!important;grid-template-rows:auto auto;}
.deductible-memo-row .deductible-inline-field{grid-column:1;grid-row:1;}
.deductible-memo-row .intake-memo-field{grid-column:1;grid-row:2;display:flex;flex-direction:column;}
.deductible-memo-row .intake-memo-field textarea{flex:1;min-height:64px;}
.deductible-memo-row .v34-guide{grid-column:2;grid-row:1 / span 2;margin-top:0!important;border-radius:10px;box-sizing:border-box;height:auto;display:flex;flex-direction:column;}
.deductible-memo-row .v34-guide summary{flex:none;box-sizing:border-box;}
.deductible-memo-row .v34-guide__body{flex:1;}
/* 배정시공점을 날짜 바로 아래에 눈에 띄는 박스로 표시 */
.attention-franchise-box{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:700;}
.attention-franchise-box .k{color:var(--ink-faint);font-weight:800;flex:none;}
.attention-franchise-box .v{color:var(--ink);font-weight:800;overflow-wrap:anywhere;}
.attention-franchise-box.assigned{background:#EEF4FF;border:1.5px solid #B9D0FA;}
.attention-franchise-box.assigned .v{color:#1F5FE0;}
.attention-franchise-box.unassigned{background:#FFF1CF;border:1.5px solid #E6A93A;}
.attention-franchise-box.unassigned .v{color:#8A5A00;}
/* 고정멘트(라벨)와 바뀌는멘트(내용) 사이 간격을 화면 전체에서 통일 */
#stepBody .copy-label{margin-top:20px!important;margin-bottom:6px!important;display:block!important;}
#stepBody .copy-label:first-child{margin-top:0!important;}
#stepBody .copy-block{margin-top:0!important;}
/* 미완료 대기줄 카드: "지금 뭘 해야 하는지"가 한눈에 보이도록 최상단에 강조 배너로 표시 */
.attention-reason-banner{margin:0 0 8px;padding:8px 11px;border-radius:9px;font-size:13px;font-weight:800;line-height:1.4;background:#FFE9E4;color:#B3331A;border:1.5px solid #F3B2A2;}
.attention-reason-banner.ok{background:#E8F7EE;color:#1B6B47;border-color:#BFE2D0;}



.history-price-box{margin:12px 0;padding:14px;border:1.5px solid #8EB4F4;border-radius:12px;background:#F3F7FF;}
.history-price-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.history-price-title{font-size:15px;font-weight:900;color:#174EA6;}
.history-price-desc{margin-top:4px;font-size:13px;line-height:1.55;color:#526174;}
.history-price-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:11px;}
.history-price-value{padding:9px 10px;border:1px solid #CBD9F1;border-radius:9px;background:#fff;}
.history-price-value .k{font-size:11.5px;font-weight:800;color:#68758A;}
.history-price-value .v{margin-top:3px;font-size:15px;font-weight:900;color:#18243A;overflow-wrap:anywhere;}
.history-price-table{width:100%;margin-top:11px;border-collapse:collapse;background:#fff;font-size:12.5px;}
.history-price-table{table-layout:fixed!important;min-width:0!important;max-width:100%!important;}
.history-price-table th,.history-price-table td{padding:7px 8px;border:1px solid #D9E2F1;text-align:left;white-space:normal!important;overflow-wrap:anywhere;word-break:keep-all;}
.history-price-table th:nth-child(1){width:15%;}.history-price-table th:nth-child(2){width:25%;}.history-price-table th:nth-child(3),.history-price-table th:nth-child(4){width:17%;}.history-price-table th:nth-child(5){width:26%;}
.history-price-table th{background:#E8F0FE;color:#25456F;font-weight:800;}
.history-price-caution{margin-top:8px;font-size:12.5px;line-height:1.5;color:#8A5700;font-weight:700;}
.original-history-reference{margin:12px 0 14px;padding:13px;border:1.5px solid #8EB4F4;border-radius:10px;background:#F3F7FF;}
@media(max-width:760px){.history-price-summary{grid-template-columns:1fr;}.history-price-table{font-size:12px;}}



.excel-link-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#526174;}
.excel-link-status:before{content:'';width:8px;height:8px;border-radius:50%;background:#AAB3C0;}
.excel-link-status.on{color:#176B45}.excel-link-status.on:before{background:#27A66B;box-shadow:0 0 0 3px #DDF4E8;}
.excel-link-panel{line-height:1.55}.excel-link-panel .excel-link-file{margin:12px 0;padding:11px;border:1px solid var(--line);border-radius:9px;background:#F7F9FC;font-weight:800;overflow-wrap:anywhere;}
.excel-link-actions{display:flex;gap:8px;flex-wrap:wrap}.excel-link-help{margin-top:12px;padding:10px 12px;border-radius:9px;background:#FFF7E6;border:1px solid #F0D28A;color:#76510A;font-size:13px;}
@media(max-width:760px){.history-price-table{font-size:11px!important}.history-price-table th,.history-price-table td{padding:6px 4px!important}.history-price-table th:nth-child(5){width:24%;}}

@media(max-width:760px){.selected-tint-overview-grid{grid-template-columns:1fr;}}

/* 고객 통화: 구분 제목과 안내문 박스를 더 또렷하고 간결하게 */
#stepBody .copy-label{display:inline-flex!important;align-items:center!important;width:auto!important;margin:18px 0 7px!important;padding:5px 9px;border-radius:7px;background:#EAF2FF;color:#174EA6!important;font-size:15.5px!important;font-weight:900!important;letter-spacing:-.01em!important;text-transform:none!important;}

/* 클릭형 선택지를 실제 체크박스처럼 보이게 하고 선택 상태를 색으로 구분 */

}

  content:'';position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;border:2px solid #9AA9BD;border-radius:4px;background:#fff;box-sizing:border-box;
}
#stepBody .call-result-box .chip.active,#stepBody [data-calldamage].active,#stepBody #tintDetailsBlock [data-tintchoice].active{background:#EAF2FF!important;border-color:#2B63D9!important;color:#174EA6!important;}
#stepBody .call-result-box .chip.active:before,#stepBody [data-calldamage].active:before,#stepBody #tintDetailsBlock [data-tintchoice].active:before{content:'✓';display:flex;align-items:center;justify-content:center;background:#2B63D9;border-color:#2B63D9;color:#fff;font-size:11px;font-weight:900;}

/* ===== v115 성능: 사진 표시 최적화 =====
   파손사진은 수백 KB 짜리 data URL 문자열입니다. 화면을 다시 그릴 때마다 이 긴 문자열이
   HTML 안에 그대로 들어가 매번 다시 해석·디코딩되어 버튼 반응이 느려졌습니다.
   innerHTML 로 넣기 직전에 짧은 blob: 주소로 바꿔 한 번만 디코딩하도록 합니다.
   (저장되는 사진 데이터 c.photos 는 그대로 data URL 이므로 복사/드래그/엑셀 기능에는 영향 없음) */
(function(){
  try{
    const desc=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');
    if(!desc||!desc.set||!desc.get||typeof Blob==='undefined'||!window.URL||!URL.createObjectURL)return;
    const cache=new Map();
    const LIMIT=150;
    function toBlobUrl(d){
      let u=cache.get(d);
      if(u){cache.delete(d);cache.set(d,u);return u;}
      try{
        const comma=d.indexOf(',');
        const mime=d.slice(5,d.indexOf(';'));
        const bin=atob(d.slice(comma+1));
        const arr=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
        u=URL.createObjectURL(new Blob([arr],{type:mime}));
        cache.set(d,u);
        if(cache.size>LIMIT){const k=cache.keys().next().value;const old=cache.get(k);cache.delete(k);setTimeout(()=>{try{URL.revokeObjectURL(old);}catch(_e){}},60000);}
        return u;
      }catch(_e){return d;}
    }
    window.__photoSrc=function(p){const v=String(p||'');return (v.length>4000&&v.startsWith('data:image/'))?toBlobUrl(v):v;};
    /* 정규식 대신 indexOf 로 훑어서 긴 문자열에서도 빠르게 처리 */
    function swapDataUrls(html){
      let out='',pos=0;
      while(true){
        const start=html.indexOf('data:image/',pos);
        if(start===-1)break;
        const q=html.charAt(start-1);
        if(q!=='"'&&q!=="'"){out+=html.slice(pos,start+11);pos=start+11;continue;}
        const end=html.indexOf(q,start);
        if(end===-1)break;
        const b64=html.indexOf(';base64,',start);
        if(end-start<4000||b64===-1||b64>start+60){out+=html.slice(pos,end);pos=end;continue;}
        out+=html.slice(pos,start)+toBlobUrl(html.slice(start,end));
        pos=end;
      }
      return pos===0?html:out+html.slice(pos);
    }
    Object.defineProperty(Element.prototype,'innerHTML',{
      configurable:true,enumerable:desc.enumerable,
      get:desc.get,
      set:function(v){
        if(typeof v==='string'&&v.length>8000&&v.indexOf('data:image/')!==-1){
          try{v=swapDataUrls(v);}catch(_e){}
        }
        desc.set.call(this,v);
      }
    });
  }catch(e){console.warn('photo url optimize',e);}
})();
