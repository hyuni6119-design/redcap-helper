function applyRepairCategory(c,category){
  c.repairCategory=category;
  c.repairCategoryManual=true;
  const type=/복원/.test(category)?'복원':/교체/.test(category)?'교체':'';
  if(type&&c.repairType!==type){
    c.repairType=type;
    c.repairAssessment='';c.ceoConfirmed=false;c.assignmentConfirmed=false;
    c.glassPriceChecked=false;c.tintSpecChecked=false;c.tintPriceChecked=false;
    if(type==='복원'){c.tintDecision='없음';c.tintGrade='';c.customerTintChoice='안함';}
    else {c.tintDecision='';c.customerTintChoice='';}
  }
  if(type==='교체'){
    c.tintDecision=/썬팅/.test(category)?'진행':'없음';
    c.customerTintChoice=/썬팅/.test(category)?'진행':'안함';
    c.tintSpecChecked=false;c.tintPriceChecked=false;c.assignmentConfirmed=false;
    if(c.textOverrides)delete c.textOverrides.assignment_final;
  }
}
function syncRepairCategoryToProcess(c){
  if(c.repairType==='복원'){c.repairCategory='유리복원';c.repairCategoryManual=true;}
  else if(c.repairType==='교체'&&c.repairCategory==='유리복원'){
    const position=String(c.glassPosition||'전면');
    c.repairCategory=(position.startsWith('측면')?'측면':position==='후면'?'후면':'전면')+'유리교체';
    c.repairCategoryManual=true;
  }
}

  if(cat.includes('측면')) return '측면강화';

}

function parseLooseNumber(v){ const m=String(v??'').replace(/,/g,'').match(/-?\d+(?:\.\d+)?/); return m?m[0]:''; }
function parseTravelMinutesInput(v){
  const s=String(v??'').trim();
  if(!s) return '';
  const h=s.match(/(\d+(?:\.\d+)?)\s*시간/);
  const m=s.match(/(\d+(?:\.\d+)?)\s*분/);
  if(h||m) return String(Math.round((h?Number(h[1]):0)*60+(m?Number(m[1]):0)));
  return parseLooseNumber(s);
}

function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

async function loadCases(){
  try{
    const out = [];
    for(let i=0; i<localStorage.length; i++){
      const key = localStorage.key(i);
      if(!key || !key.startsWith(storageKey('case:'))) continue;
      try{
        const raw = localStorage.getItem(key);

    out.forEach(migrateLegacyManualState);
    out.forEach(c=>{if(c.repairCategoryManual&&c.repairCategory==='유리복원'&&c.repairType!=='복원')applyRepairCategory(c,c.repairCategory);});

function migrateLegacyManualState(c){
  // 예전 버전에서 저장된 업무상태 값을 지금 쓰는 값으로 옮겨줌 (보류/재확인 필요/카톡발송완료/완료는 더 이상 드롭다운에 없음)
  if(!c || !c.manualState) return;
  const legacyMap = {'보류':'확인중', '재확인 필요':'확인중', '카톡발송완료':'확인중'};
  if(legacyMap[c.manualState]){
    c.manualState = legacyMap[c.manualState];
  } else if(c.manualState==='완료'){
    if(!c.status) c.status='done';
    c.manualState='';
  }
}

function normalizeVehiclePriceRows(list){
  let changed=false;
  const rows=(Array.isArray(list)?list:[]).map((v,index)=>{
    if(!v||typeof v!=='object')return v;

    const shifted=noText&&!/^\d+$/.test(noText)&&/^(정품|비품)$/i.test(modelText);
    if(!shifted)return v;
    changed=true;
    return {
      no:index+1,model:noText,type:modelText,vin:v.type??'',partNo:v.vin??'',
      restore:v.partNo??null,replaceFront:v.restore??null,
      sideTempered:v.replaceFront??null,sideLaminated:v.sideTempered??null,rear:v.sideLaminated??null,
      tint30:v.rear??null,tint50:v.tint30??null,tint70:v.tint50??null,tint90:v.tint70??null,
      tintSide:v.tint90??null,tintRear:v.tintSide??null,tintRearRedo:v.tintRear??null
    };
  });
  return {rows,changed};
}

function autoGrowTextareas(root=document){
  /* v115: 칸마다 높이 쓰기→읽기를 반복하면 칸 수만큼 화면 재계산이 일어나 버튼이 느려집니다.
     모든 칸을 먼저 auto로 바꾸고, 한 번에 높이를 읽은 뒤, 한 번에 적용합니다. */
  const jobs=[];
  const bind=(el,grow)=>{ if(!el.dataset.autogrowBound){el.addEventListener('input',grow);el.dataset.autogrowBound='1';} };
  root.querySelectorAll('textarea.parsed-field-text, textarea.editable-text, textarea.note-box').forEach(el=>{
    const minH=el.dataset.compact?30:42;
    const calc=h=>Math.min(Math.max(h,minH),320)+'px';
    bind(el,()=>{el.style.height='auto'; el.style.height=calc(el.scrollHeight);});
    jobs.push([el,calc]);
  });
  root.querySelectorAll('textarea.alarm-val').forEach(el=>{
    const calc=h=>Math.max(h,38)+'px';
    bind(el,()=>{el.style.height='auto'; el.style.height=calc(el.scrollHeight);});
    jobs.push([el,calc]);
  });
  root.querySelectorAll('textarea#rawText').forEach(el=>{
    const calc=h=>Math.max(h,280)+'px';
    bind(el,()=>{el.style.height='auto'; el.style.height=calc(el.scrollHeight);});
    jobs.push([el,calc]);
  });
  if(!jobs.length) return;
  jobs.forEach(([el])=>{el.style.height='auto';});
  const heights=jobs.map(([el])=>el.scrollHeight);
  jobs.forEach(([el,calc],i)=>{el.style.height=calc(heights[i]);});
}
function getActiveCase(){ return state.cases.find(c=>c.id===state.activeId) || null; }
function computeStatus(c){
  if(c.status==='done' || c.manualState==='완료') return 'done';
  if(!c.rawText || !c.plate || !c.model) return 'intake';
  if(!c.repairType || !c.ceoConfirmed) return 'ceo_wait';
  if(!c.assignmentConfirmed) return 'assignment_wait';
  if(c.customerTintChoice==='고민중' && c.repairType==='교체') return 'tint_pending';
  if(!stepDone(c,'call')) return 'call_wait';
  return 'wrapup';
}

function currentStageKey(c){
  const st=computeStatus(c);
  if(st==='done') return '';
  if(st==='intake') return 'intake';
  if(st==='ceo_wait') return 'ceo';
  if(st==='assignment_wait'||st==='tint_pending') return 'assignment';
  if(st==='call_wait') return 'call';
  if(st==='wrapup') return 'wrapup';
  if(st==='shop_schedule_wait') return 'shopSchedule';
  if(st==='pending_photo') return 'shopSchedule';
  return '';
}
function holdState(c){
  if((c.manualState||'')!=='보류') return {active:false,due:false,overdue:false,text:''};
  if(!c.holdUntil) return {active:true,due:false,overdue:false,text:'보류 중 · 재확인 시간 미지정'};
  const t=new Date(c.holdUntil); const now=new Date();
  const overdue=!isNaN(t)&&t.getTime()<=now.getTime();
  const fmt=isNaN(t)?c.holdUntil:t.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  return {active:true,due:!overdue,overdue,text:overdue?`재확인 지남 · ${fmt}`:`보류 · ${fmt} 재확인`};
}
function nextActionText(c){
  const hs=holdState(c); if(hs.active) return hs.overdue?'⚠ '+hs.text:'⏸ '+hs.text;
  const st=computeStatus(c);
  if(st==='intake') return '다음: 단톡방 원본 확인 · 접수정보 추출';
  if(st==='ceo_wait') return '다음: 대표님께 복원/교체 확인';
  if(st==='assignment_wait') return '다음: 부품·썬팅·시공점·배정비용 확인';
  if(st==='tint_pending') return '다음: 고객 썬팅 재확인';
  if(st==='call_wait') return '다음: 고객 확인사항 · 일정 확정';
  if(st==='wrapup') return '다음: 시공점 전달 · 알림톡 · 처리내용 정리';
  if(st==='done') return '처리 완료';
  return '다음 업무 확인';
}
function finalValidation(c){
  const missing=[];
  if(!c.plate) missing.push('차량번호');
  if(!c.model) missing.push('차종');
  if(!c.region) missing.push('고객지역');
  if(!c.repairType || !c.ceoConfirmed) missing.push('대표님 복원/교체 확인');
  if(!c.assignmentConfirmed) missing.push('배정비용 확인 완료');
  if(!c.franchise) missing.push('시공점');
  if(c.repairType==='교체'){
    if(!c.partNoInput && !(c.matchedPart&&c.matchedPart.partNo)) missing.push('부품번호');
    const d=resolvedTintDecision(c);
    if(!d || d==='확인필요') missing.push('썬팅 사양 확정');
    const tv=resolvedTintVat(c); if(tv===null || tv<=0) missing.push('썬팅 금액');
    if(!c.deductible) missing.push('계약면책금');
  }
  if(!c.notifiedSent) missing.push('카톡·파손사진 전달');
  if(!c.alarmSent) missing.push('알림톡 발송');
  return {ready:missing.length===0,missing};
}

  else renderMain();

function renderSidebar(){
  const list = document.getElementById('caseList');
  // 현재 UI에서는 예전 왼쪽 접수 목록이 숨겨져 있습니다. 숨은 DOM을 매 동작마다
  // 전부 다시 만드는 작업은 건수가 쌓일수록 큰 지연을 만들므로 즉시 건너뜁니다.
  if(list && getComputedStyle(list).display==='none') return;
  const q=(state.sidebarSearch||'').trim().toLowerCase();
  const statusFilter=state.sidebarStatusFilter||'미완료';
  const shown=state.cases.filter(c=>{
    const manual=c.manualState||'접수 확인중';
    const st=computeStatus(c);
    const isDone=(manual==='완료'||st==='done');
    const isPendingPhoto=(!isDone&&st==='pending_photo');
    let statusOk=true;
    if(statusFilter==='미완료') statusOk=!isDone&&!isPendingPhoto;
    else if(statusFilter==='완료대기') statusOk=isPendingPhoto;
    else if(statusFilter==='완료') statusOk=isDone;
    else if(statusFilter==='전체') statusOk=true;
    else statusOk=(manual===statusFilter);
    if(!statusOk) return false;
    if(!q) return true;
    const f=c.franchise||null;
    const hay=[c.plate,c.model,c.customerName,c.customerPhone,c.region,c.client,f&&f.name,c.caseMemo,c.manualState].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
  if(state.cases.length===0){
    list.innerHTML = `<div class="case-list-empty">아직 접수된 건이 없습니다.<br>“+ 새 접수”로 레드캡 단톡방 내용을 붙여넣어 시작하세요.</div>`;

function stepDone(c, key){
  switch(key){
    case 'intake': return !!(c.plate && c.model);
    case 'ceo': return !!(c.repairType && c.ceoConfirmed);
    case 'assignment': return !!c.assignmentConfirmed;
    case 'call': return !!c.schedule || c.customerTintChoice==='고민중';
    case 'wrapup': return !!c.shopForwarded;
    case 'shopSchedule': return !!c.workCompleted;
    default: return false;
  }
}

/* Canonical tint label used across intake, assignment, representative text and 알림톡. */
function canonicalTintInfoText(value){
  let s=String(value==null?'':value).replace(/\s+/g,' ').trim();
  if(!s)return '';
  s=s.replace(/\s*\/\s*/g,' ');
  s=s.replace(/루마\s+GG/gi,'루마GG');
  return s.replace(/루마GG\s+(?=\d{1,3}\s*%)/i,'루마GG ').replace(/\s+/g,' ').trim();
}

/* ============ 사진 저장 헬퍼 ============ */
function compressPhotoFile(file, maxSide=1400, quality=.74){
  return new Promise((resolve,reject)=>{
    if(!file || !file.type || !file.type.startsWith('image/')) return reject(new Error('이미지 파일이 아닙니다.'));
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('사진을 읽을 수 없습니다.'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('사진 형식을 읽을 수 없습니다.'));
      img.onload=()=>{
        let w=img.width,h=img.height;
        const scale=Math.min(1,maxSide/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function addCasePhoto(c,file){
  try{
    const dataUrl=await compressPhotoFile(file);
    c.photos=c.photos||[];
    if(c.photos.length>=6){ showToast('사진은 접수 건당 최대 6장까지 저장합니다.'); return; }
    c.photos.push(dataUrl);
    await commit(c);
    if(document.getElementById('photoGalleryWrap')){ patchPhotoGallery(c); } else { renderMain(); }
    renderSidebar();
    showToast('파손사진이 이 접수 건에 저장되었습니다.');
  }catch(err){ showToast('사진 저장 실패: '+err.message); }
}

async function addCasePhotos(c, files){
  const arr=[...(files||[])].filter(f=>f && f.type && f.type.startsWith('image/'));
  if(!arr.length){ showToast('이미지 파일을 찾지 못했습니다.'); return; }
  let added=0;
  for(const file of arr){
    if((c.photos||[]).length>=6) break;
    try{
      const dataUrl=await compressPhotoFile(file,1400,.72);
      c.photos=c.photos||[]; c.photos.push(dataUrl); added++;
    }catch(e){}
  }
  if(added){
    c.noPhotoConfirmed=false;
    await commit(c);
    if(document.getElementById('photoGalleryWrap')){ patchPhotoGallery(c); } else { renderMain(); }
    renderSidebar();
    showToast(`파손사진 ${added}장 저장되었습니다.`);
  }
  else showToast('추가할 수 있는 사진이 없습니다.');
}

function dataUrlToFile(dataUrl,name){
  try{const parts=dataUrl.split(','),meta=parts[0]||'',mime=(meta.match(/data:([^;]+)/)||[])[1]||'image/jpeg',bin=atob(parts[1]||''),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new File([arr],name||'photo.jpg',{type:mime});}catch(e){return null;}
}
async function copyPhotoToClipboard(src){
  try{
    const img=new Image();img.src=src;await img.decode();
    const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;canvas.getContext('2d').drawImage(img,0,0);
    const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
    if(!blob||!navigator.clipboard||!window.ClipboardItem)throw new Error('clipboard unsupported');
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);showToast('사진이 복사되었습니다. 카카오톡에서 Ctrl+V 하세요.');
  }catch(e){showToast('사진 복사가 차단되었습니다. GitHub Pages(https)에서 다시 시도하거나 사진을 드래그하세요.');}
}
function wirePhotoDragElements(root=document){
  root.querySelectorAll('[data-dragphoto]').forEach(el=>{
    if(el.dataset.dragwired==='1')return;el.dataset.dragwired='1';
    el.addEventListener('dragstart',e=>{
      const caseId=el.dataset.casephoto;const cc=(caseId?state.cases.find(x=>x.id===caseId):null)||getActiveCase();const idx=Number(el.dataset.dragphoto);const src=cc?.photos?.[idx];if(!src)return;
      const name=`${(cc.plate||'레드캡').replace(/[^0-9A-Za-z가-힣_-]/g,'_')}_파손사진_${idx+1}.jpg`;const file=dataUrlToFile(src,name);
      try{if(file&&e.dataTransfer.items)e.dataTransfer.items.add(file);}catch(_e){}
      try{e.dataTransfer.setData('DownloadURL',`${file?.type||'image/jpeg'}:${name}:${src}`);e.dataTransfer.setData('text/uri-list',src);}catch(_e){}
      e.dataTransfer.effectAllowed='copy';showToast('카카오톡 대화창에 놓으세요.');
    });
  });
}

function parseRawText(raw){
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const map = {};
  // 레드캡 단톡방의 양식 제목으로 복원/교체를 우선 자동판정합니다.
  // 예: [ 유리교체 양식 ], [유리복원 양식]
  // 반드시 맨 첫 줄(제목)만 보고 판정 — 본문 요청사항 등에 "복원"/"교체" 단어가 섞여 있어도

  const headerLine = (raw||'').split('\n').map(s=>s.trim()).find(Boolean) || '';
  const normalizedHeader = headerLine.replace(/\s+/g,'');
  if(/\[?유리복원양식\]?/i.test(normalizedHeader) || /\[?복원양식\]?/i.test(normalizedHeader)){
    map.repairType='복원';
    map.intakeTemplate='유리복원 양식';
  } else if(/\[?유리교체양식\]?/i.test(normalizedHeader) || /\[?교체양식\]?/i.test(normalizedHeader)){
    map.repairType='교체';
    map.intakeTemplate='유리교체 양식';
  }
  lines.forEach(line=>{
    // 단톡방 원문처럼 앞에 ㅇ 표시가 있는 형식과, 사용자가 직접 붙여넣은
    // "차량번호: ..." 형식을 모두 허용합니다. 콜론 뒤 값이 짧아도(예: 차대번호: 3)
    // 그대로 보존해 수동 입력값으로 이어지도록 합니다.
    const m = line.match(/^(?:[ㅇoO0\-\*·]\s*)?([^:：]+)\s*[:：]\s*(.*)$/);
    if(!m) return;
    const key = m[1].trim();
    const val = m[2].trim();
    if(key.includes('차량번호')) map.plate = val;
    else if(key.includes('차종')) map.model = val;
    else if(key.includes('차대번호')) map.vin = val;
    else if(key.includes('고객사')) map.client = val;
    else if(key.includes('고객정보')){
      const phoneMatch = val.match(/01[0-9][-\s]?\d{3,4}[-\s]?\d{4}/);
      if(phoneMatch){
        map.customerPhone = phoneMatch[0].trim();
        map.customerName = val.replace(phoneMatch[0], '').replace(/[\/,]/g,' ').trim();
      } else {
        const parts = val.split('/').map(s=>s.trim());
        map.customerName = parts[0]||'';
        map.customerPhone = parts[1]||'';
      }
    }
    else if(key.includes('고객지역')) map.region = val;
    else if(key.includes('파손부위')) map.damage = val;
    else if(key.includes('썬팅')) map.tintInfo = val ? canonicalTintInfoText(val) : '';
    else if(key.includes('요청')) map.request = val;
  });
  // 실제 사용 중인 단일 HTML 추출기에서도 ㅇ썬팅여부 라벨을 확실히 보존한다.
  if(!map.tintInfo){

    if(tintLine){
      const tm=tintLine.match(/^\s*[ㅇoO0]?\s*썬팅(?:여부)?\s*[:：]\s*(.*)$/i);
      if(tm)map.tintInfo=canonicalTintInfoText(tm[1].trim());
    }

  // 고객지역이 라벨로 명시되지 않았어도, 주소 형식(시/도 + 시군구 등)으로 된 줄이 있으면 바로 고객지역으로 연동합니다.
  if(!map.region){
    const addrPattern=/(서울특별시|서울|부산광역시|부산|대구광역시|대구|인천광역시|인천|광주광역시|광주|대전광역시|대전|울산광역시|울산|세종특별자치시|세종|경기도|경기|강원특별자치도|강원도|강원|충청북도|충북|충청남도|충남|전북특별자치도|전라북도|전북|전라남도|전남|경상북도|경북|경상남도|경남|제주특별자치도|제주)[가-힣0-9()\-,.\s]{2,}(시|군|구|읍|면|동|로|길)/;
    const addrLine = lines.find(line=>{
      const t=line.trim().replace(/^[ㅇoO0\-\*·]\s*/,'').replace(/^[^:：]{1,12}[:：]\s*/,'');
      return addrPattern.test(t);
    });
    if(addrLine){
      map.region = addrLine.trim().replace(/^[ㅇoO0\-\*·]\s*/,'').replace(/^[^:：]{1,12}[:：]\s*/,'').trim();
    }
  }
  map.repairCategory = guessRepairCategory(map);
  return map;
}
function guessRepairCategory(map){
  const damage=(map.damage||'')+' '+(map.request||'');
  const hasTint = map.tintInfo && !isTintNoneText(map.tintInfo);
  if(map.repairType==='복원') return '유리복원';
  if(/파노라마/.test(damage)) return '파노라마교체';
  if(/고정창/.test(damage)){
    if(/조수석/.test(damage)) return '고정창(조수석)교체';
    if(/운전석/.test(damage)) return '고정창(운전석)교체 및 썬팅';
  }
  if(/후면/.test(damage)){
    if(/탈부착/.test(damage)) return '후면유리탈부착';
    return hasTint ? '후면유리교체 및 썬팅' : '후면유리교체';
  }
  if(/측면/.test(damage)){
    return hasTint ? '측면유리교체 및 썬팅' : '측면유리교체';
  }
  if(/전면/.test(damage)){
    if(/썬팅만|썬팅\s*단독/.test(damage) && !/교체/.test(damage)) return '전면유리썬팅';
    return hasTint ? '전면유리교체 및 썬팅' : '전면유리교체';
  }
  return '';
}

function normalizeRegionText(v){
  let s=(v||'').toString().replace(/\s+/g,' ').trim();

  s=s.replace(/^서울시(?=\s|$)/,'서울특별시').replace(/^서울(?=\s|$)/,'서울특별시')
     .replace(/^경기(?=\s|$)/,'경기도').replace(/^충북(?=\s|$)/,'충청북도').replace(/^충남(?=\s|$)/,'충청남도')
     .replace(/^전북(?=\s|$)/,'전라북도').replace(/^전남(?=\s|$)/,'전라남도');
  return s;
}
function regionTokens(v){ return normalizeRegionText(v).replace(/[(),]/g,' ').split(/\s+/).filter(Boolean); }
function provinceKey(v){
  const t=regionTokens(v); if(!t.length) return '';

  const map={'강원특별자치도':'강원도','전북특별자치도':'전라북도','서울':'서울특별시','경기':'경기도','인천':'인천광역시','강원':'강원도','대전':'대전광역시','세종':'세종특별자치시','충남':'충청남도','충북':'충청북도','광주':'광주광역시','전남':'전라남도','전북':'전라북도','부산':'부산광역시','경남':'경상남도','울산':'울산광역시','대구':'대구광역시','경북':'경상북도'};
  return map[p]||p;
}
function localAdminTokens(v){ return regionTokens(v).filter(t=>/(시|군|구|읍|면|동)$/.test(t)); }
function regionScore(addr,region,point){
  if(!region) return 0;
  const a=normalizeRegionText(addr), r=normalizeRegionText(region), rt=regionTokens(r);
  let score=0; const ap=provinceKey(a), rp=provinceKey(r);
  if(ap&&rp&&ap===rp) score+=20;
  localAdminTokens(r).forEach((t,idx)=>{ if(a.includes(t)) score += idx===0?70:35; });

}
function matchingHistoryEntries(region){
  const r=normalizeRegionText(region); if(!r) return [];
  const matched=[];
  Object.entries(ASSIGNMENT_HISTORY_BY_REGION).forEach(([key,items])=>{
    const k=normalizeRegionText(key);

function shopIntakeDetails(c){

  const detected=isSmileCarGwangjuCase(c)?smileCarShopDetails(c):{name:'',address:'',phone:''};
  return {
    name:String(c.intakeShopName||detected.name||'').trim(),
    address:String(c.intakeShopAddress||detected.address||'').trim(),
    phone:String(c.intakeShopPhone||detected.phone||'').trim()
  };
}
function assignmentTargetAddress(c){
  if(isShopIntakeCase(c)){
    const d=shopIntakeDetails(c);
    if(d.address)return d.address;
  }
  return c?(c.customerAltAddress||c.roadAddress||c.region||''):'';
}
function candidateFranchises(region){
  if(!region) return [];
  const fixed=fixedDestinationAssignment(region),fixedPick=fixed&&fixed.franchise;
  if(fixedPick) return [{...fixedPick, matchCount:9999, matchReason:fixed.rule.reason||('고정 배정 규칙: 이 도착지는 항상 '+fixedPick.name+'(으)로 배정'), historyKey:'fixed'}];
  const learnedHistory=learnedHistoryEntries(region);
  const exactHistory=matchingHistoryEntries(region);
  const out=[]; const used=new Set();
  const add=(f,count,reason,historyKey='')=>{
    if(!f) return;
    const n=Number(count)||0;
    if(used.has(f.name)){
      const prev=out.find(x=>x.name===f.name);
      if(prev){
        if(n>prev.matchCount) prev.matchCount=n;
        if(historyKey) prev.historyKey=historyKey;
        if(reason && !prev.matchReason.includes(reason)) prev.matchReason += ` / ${reason}`;
      }
      return;
    }
    used.add(f.name);
    out.push({...f, matchCount:n, matchReason:reason, historyKey});
  };

  // 과거 데이터의 지역단위보다 고객주소가 더 자세할 때(구/동 등),
  // 그 세부지역에 실제 위치한 현재 가맹점/협력점이 있으면 먼저 보여준다.
  // 예: 서울특별시(과거자료) + 서초구(현재 고객주소) → 서초점 우선.
  if(exactHistory.length){
    const historyKey=exactHistory[0].historyKey||'';
    const extraLocal=localAdminTokens(region).filter(t=>!normalizeRegionText(historyKey).includes(t));
    if(extraLocal.length){
      FRANCHISE_DATA.map(f=>{
        const a=normalizeRegionText(f.address);
        const hits=extraLocal.filter(t=>a.includes(t));
        return {f,hits};
      }).filter(x=>x.hits.length)
        .sort((a,b)=>b.hits.length-a.hits.length || (a.f.type==='가맹점'?-1:1))
        .forEach(x=>add(x.f,0,`현재 시공점 주소가 고객 세부지역(${x.hits.join(', ')})과 직접 일치`,historyKey));
    }
  }

  // V8: 이 도구에서 실제로 확정한 배정을 가장 먼저 학습해서 사용합니다.
  learnedHistory.forEach(x=>{
    const f=FRANCHISE_DATA.find(p=>p.name===x.name);
    add(f,x.count,`이 프로그램에서 ${x.historyKey} 배정 누적 ${x.count}건`,x.historyKey);
  });

  // 기존 엑셀 과거배정 데이터도 이어서 참고합니다.
  exactHistory.sort((a,b)=>b.count-a.count).forEach(x=>{
    const f=FRANCHISE_DATA.find(p=>p.name===x.name);
    add(f,x.count,`과거 ${x.historyKey} 실제 배정 ${x.count}건`,x.historyKey);
  });

  // 같은 지역 과거 이력이 없으면 현재 주소가 같은 시/군/구인 시공점을 우선 사용.
  if(!out.length){
    currentLocalServicePoints(region).forEach(f=>add(f,0,f.matchReason,''));
  }

  // 그 다음은 같은 광역시/도 과거 배정 횟수순.
  if(!out.length){
    const p=provinceKey(region);
    (ASSIGNMENT_HISTORY_BY_PROVINCE[p]||[]).forEach(x=>{
      const f=FRANCHISE_DATA.find(s=>s.name===x.name);
      add(f,x.count,`과거 ${p} 실제 배정 ${x.count}건`,p);
    });
  }

  // 마지막 보조후보. API를 호출하지 않고 미리 저장된 지역 목록만 사용.
  if(!out.length){
    const p=provinceKey(region);
    (REGIONAL_FALLBACKS[p]||[]).forEach(name=>{
      const f=FRANCHISE_DATA.find(s=>s.name===name);
      add(f,0,'저장된 지역 보조 후보','');
    });
  }
  const province=provinceKey(region);
  const local=out.filter(f=>provinceKey(f.address||'')===province);
  if(province){
    FRANCHISE_DATA.filter(f=>provinceKey(f.address||'')===province)
      .sort((a,b)=>regionScore(b.address,region,b)-regionScore(a.address,region,a))
      .forEach(f=>{if(!local.some(x=>x.name===f.name))local.push({...f,matchCount:0,matchReason:'고객 주소와 같은 광역시·도',historyKey:''});});
  }
  return (local.length?local:out).slice(0,12);
}

function sanitizeAutoFranchise(c){
  if(!c||!c.franchise||c.franchiseManual)return;
  const target=assignmentTargetAddress(c)||c.region||'';
  const shopAddress=typeof window.__distanceGoalForCase==='function'?window.__distanceGoalForCase(c,c.franchise):c.franchise.address;
  const wanted=provinceKey(target), actual=provinceKey(shopAddress||'');
  /* 고객 시·도 안에 실제 시공점이 있을 때만 다른 시·도 자동배정을 지웁니다.
     (주소가 '수원시…'처럼 시·도 없이 시작하거나 세종처럼 지역 시공점이 없으면
      지웠다 다시 추천하기를 끝없이 반복해 화면이 계속 새로 그려졌습니다.) */
  const hasLocalShop=wanted&&(FRANCHISE_DATA||[]).some(f=>provinceKey(f.address||'')===wanted);
  if(wanted&&actual&&wanted!==actual&&hasLocalShop){
    c.franchise=null;
    c.matchRegion='';
    c.matchCandidates=[];
    c.travelMinutes='';
    c.travelKm='';
    c.franchiseChecked=false;
    resetAssignmentConfirmed(c);
  }
}

function guessTintGrade(tintInfo){
  if(!tintInfo) return '';
  const low = tintInfo.toLowerCase();
  for(const grade of Object.keys(TINT_GRADE_BRANDS)){
    if(TINT_GRADE_BRANDS[grade].some(b=>low.includes(b))) return grade;
  }
  return '';
}
function searchVehicles(q){
  if(!q || q.trim().length<1) return [];
  const tokens = q.toLowerCase().replace(/[()]/g,' ').split(/\s+/).filter(Boolean);
  return VEHICLE_DATA.filter(v=>{
    const hay = (v.model+' '+(v.partNo||'')).toLowerCase();
    return tokens.some(t=>hay.includes(t));
  }).slice(0,25);
}
function matchByPartNo(q){
  const norm = s => (s||'').toString().toUpperCase().replace(/[\s\-]/g,'').replace(/\([^)]*\)$/,'');
  const nq = norm(q);
  if(!nq) return null;
  return VEHICLE_DATA.find(v=>{
    const raw=String(v.partNo||'').toUpperCase().trim();
    const chunks=raw.split(/[=,]/).map(x=>x.trim()).filter(Boolean);
    const prefix=((chunks[0]||'').match(/^([A-Z0-9]+-)/)||[])[1]||'';
    const variants=chunks.map((x,i)=>i>0&&prefix&&!x.includes('-')?prefix+x:x).map(norm);
    return variants.includes(nq);
  }) || null;
}
function matchByVin(q){
  const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const n=norm(q); if(!n) return null;
  return VEHICLE_DATA.find(v=>norm(v.vin)===n)||null;
}
function vehicleNamesCompatible(a,b){
  const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9가-힣]/g,'')
    .replace(/그랜져|그렌져/g,'그랜저').replace(/산타페/g,'싼타페');
  const x=norm(a),y=norm(b); if(!x||!y)return true;
  if(x===y||x.includes(y)||y.includes(x))return true;
  // 트림·연식·프로젝트 코드가 달라도 차종명이 같으면 같은 차량입니다.
  const omit=new Set(['현대','기아','제네시스자동차','르노','삼성','쉐보레','한국gm','쌍용',
    '가솔린','디젤','하이브리드','전기','모던','프리미엄','인스퍼레이션','익스클루시브',
    '시그니처','노블레스','터보','신형','구형','페이스리프트','전면유리','후면유리','측면유리']);
  const tokens=s=>[...String(s||'').toLowerCase().replace(/그랜져|그렌져/g,'그랜저').replace(/산타페/g,'싼타페')
    .matchAll(/[가-힣]{2,}|[a-z]+\d+/g)].map(m=>m[0]).filter(t=>!omit.has(t));
  const left=tokens(a),right=tokens(b);
  if(left.some(t=>right.includes(t)))return true;
  // 명확한 차종명이 양쪽에 있을 때만 불일치로 판정합니다.
  return !left.length||!right.length;
}
function matchCandidatesByVehicleName(q){
  const norm=s=>(s||'').toString().toUpperCase().replace(/[^A-Z0-9가-힣]/g,'');
  const nq=norm(q);
  if(!nq) return [];
  const exact=VEHICLE_DATA.filter(v=>norm(v.model)===nq);
  if(exact.length) return exact;
  return VEHICLE_DATA.filter(v=>{
    const nm=norm(v.model);
    return nm && nq.length>=3 && (nm.includes(nq)||nq.includes(nm));
  }).slice(0,12);
}

}

// (기존 코드 흐름 유지를 위해 되살린 원본 선언 — 이후 블록에서 재정의됨)
function assignmentReportText(c){
  const p = c.matchedPart;
  const f = c.franchise || nearestFranchise(c.region);
  const franchiseName = f ? f.name : '시공점 미배정';
  const travel = [c.travelMinutes?fmtTravelMinutes(c.travelMinutes):'', c.travelKm?`${c.travelKm}km`:''].filter(Boolean).join(' / ');
  const lines = [];
  if(c.repairType==='복원'){
    const restoreAmt = c.partPrice?fmtNum(c.partPrice):'-';
    const replaceAmt = p && p.replaceFront ? fmtNum(p.replaceFront) : '-';
    lines.push([c.model||(p&&p.model)||'-', c.partName||'-', c.partNoInput||(p&&p.partNo)||'-', restoreAmt].join('  '));
    lines.push('');
    lines.push(`유리교체시 ${replaceAmt}`);
    lines.push(` ${franchiseName}${travel?' '+travel:''} / 배정금액 확인부탁드립니다.`);
    return lines.join('\n');
  }
  const line1 = [c.model||(p&&p.model)||'-', c.partName||'-', c.partNoInput||(p&&p.partNo)||'-', c.partPrice?fmtNum(c.partPrice):'-'].join('\t');
  lines.push(line1);
  if(c.repairType==='교체'){
    const replaceAmt = p && p.replaceFront ? fmtNum(p.replaceFront) : '-';
    let line2 = `유리교체시 ${replaceAmt}`;
    const vat = resolvedTintVat(c);
    // 고객통화 중 "다른 등급 문의"로 썬팅 사양을 바꾸면 금액(resolvedTintVat)은 바로 반영되는데,
    // 여기 사양 표시는 항상 접수 당시 원문(c.tintInfo)을 우선해서 보여줘서 금액과 사양이 서로
    // 다른 걸 가리키는 문제가 있었습니다. 실제 전달 사양(변경분 포함)을 우선 사용하도록 고쳤습니다.
    const deliverySpec=(typeof window.__tintDeliverySpec==='function'?window.__tintDeliverySpec(c):(typeof window.tintDeliverySpec==='function'?window.tintDeliverySpec(c):''))||'';
    const tintLabel = deliverySpec || (effectiveTintGrade(c)?TINT_GRADE_LABEL[effectiveTintGrade(c)]:'') || c.tintInfo || '';
    if(vat!==null) line2 += `  썬팅 ${fmtNum(vat)}(부가세포함)${tintLabel?`(${tintLabel})`:''}`;
    lines.push(line2);
  }
  lines.push(`${franchiseName}${travel?' '+travel:''} / 배정금액 확인부탁드립니다.`);
  return lines.join('\n');
}

function fmtTravelMinutes(min){
  const n = Number(String(min||'').replace(/[^0-9.-]/g,''));
  if(!min || isNaN(n) || n<=0) return '';
  const total = Math.round(n);
  if(total < 60) return `${total}분`;
  const h = Math.floor(total/60), m = total%60;
  return m>0 ? `${h}시간 ${m}분` : `${h}시간`;
}
function tintVatAmount(c){
  const p = c.matchedPart;
  const pos = c.tintPosition||'전면';
  const fixedNoVat={측면:50000,후면:90000,후면재:140000};
  if(pos!=='전면'){
    const matched=p?(pos==='측면'?p.tintSide:pos==='후면'?p.tintRear:p.tintRearRedo):null;
    const noVat=(matched!==undefined&&matched!==null&&matched!=='')?matched:fixedNoVat[pos];
    return noVat===undefined?null:Math.round(Number(noVat)*1.1);
  }
  if(!p) return null;
  const map = {'기본':p.tint30,'일반':p.tint50,'중급':p.tint70,'고급':p.tint90};
  let noVat = pos==='전면' ? map[c.tintGrade||guessTintGrade(c.tintInfo)] : (pos==='측면'?p.tintSide:pos==='후면'?p.tintRear:p.tintRearRedo);
  if(noVat===undefined||noVat===null) return null;
  return Math.round(noVat*1.1);
}


function isTintNoneText(s){
  if(!s) return false;
  const t=String(s).trim().replace(/\s+/g,'');
  return ['없음','없다','무','안함','미포함','해당없음','-','x','X','no','No','NO','none','None'].includes(t);
}
function resolvedTintDecision(c){
  if(c.customerTintChoice==='안함')return '없음';
  if(c.customerTintChoice==='진행'&&c.tintSpecMode==='different'&&c.tintGrade)return c.tintGrade==='기본'?'기본':'등급선택';
  if(c.tintDecision) return c.tintDecision;
  if(/교체/.test(c.repairCategory||''))return /썬팅/.test(c.repairCategory)?(c.tintInfo&&!isTintNoneText(c.tintInfo)?'기존정보':'진행'):'없음';
  if(isTintNoneText(c.tintInfo)) return '없음';
  return c.tintInfo ? '기존정보' : '';
}
function effectiveTintGrade(c){
  const decision=resolvedTintDecision(c);
  if(decision==='없음') return '';
  /* 고객통화에서 확정한 등급은 접수값보다 우선합니다. */
  if((c.tintSpecMode==='different'||c.tintSpecMode==='same')&&c.tintGrade) return c.tintGrade;
  /* 접수정보에 제품명이 있으면 tintDecision의 오래된 기본값보다 제품 매칭 결과를 우선합니다. */
  const inferred=typeof guessTintGrade==='function'?guessTintGrade(c.tintInfo):'';
  if(inferred) return inferred;
  if(decision==='기본') return '기본';
  return c.tintGrade || '';
}
function resolvedTintVat(c){
  if(resolvedTintDecision(c)==='없음') return 0;
  const manual=Number(digitsOnly(c.manualTintVat||''));
  if(manual>0) return manual;
  if(c.repairType!=='교체') return null;
  const decision=resolvedTintDecision(c);
  const pos=c.tintPosition||'전면';
  if(pos!=='전면'){
    const p=c.matchedPart;
    const matched=p?(pos==='측면'?p.tintSide:pos==='후면'?p.tintRear:p.tintRearRedo):null;
    const fixedNoVat={측면:50000,후면:90000,후면재:140000};
    const noVat=(matched!==undefined&&matched!==null&&matched!=='')?matched:fixedNoVat[pos];
    if(noVat===undefined||noVat===null||noVat==='') return null;
    return Math.round(Number(noVat)*1.1);
  }
  if(decision==='기본' && !c.tintInfo) return 132000;
  const p=c.matchedPart;
  const grade=effectiveTintGrade(c);
  if(!grade) return null;
  const base=(window.__TINT_BASE_NOVAT&&window.__TINT_BASE_NOVAT[grade])||null;
  if(!p) return base?Math.round(base*1.1):null;
  const map={'기본':p.tint30,'일반':p.tint50,'중급':p.tint70,'고급':p.tint90};
  const noVat=map[grade];
  if(noVat===undefined||noVat===null||noVat==='') return base?Math.round(base*1.1):(grade==='기본'?132000:null);
  return Math.round(Number(noVat)*1.1);
}
// 전면 위치 · 등급이 정해졌는데 이 차종의 실제 단가표 값이 없어서 단가표 원본 기준금액(참고용)으로
// 대체된 경우 true. 대표님께 실제 금액을 다시 확인해야 한다는 안내에 사용합니다.
function tintVatIsFallback(c){
  if(c.repairType!=='교체') return false;
  if(resolvedTintDecision(c)==='없음') return false;
  if(Number(digitsOnly(c.manualTintVat||''))>0) return false;
  const pos=c.tintPosition||'전면';
  if(pos!=='전면') return false;
  const grade=effectiveTintGrade(c);
  if(!grade) return false;
  if(c.tintInfo && !isTintNoneText(c.tintInfo)) return false;
  const p=c.matchedPart;
  if(!p) return !!(window.__TINT_BASE_NOVAT&&window.__TINT_BASE_NOVAT[grade]);
  const map={'기본':p.tint30,'일반':p.tint50,'중급':p.tint70,'고급':p.tint90};
  const noVat=map[grade];
  return (noVat===undefined||noVat===null||noVat==='');
}
function tintVatForRestoreReport(c){
  // 복원 건도 원본에 썬팅정보가 있으면 참고용으로 단가표 매칭 금액을 계산 (resolvedTintVat은 교체 건 전용이라 별도 계산)
  const manual=Number(digitsOnly(c.manualTintVat||''));
  if(manual>0) return manual;
  const decision=resolvedTintDecision(c);
  if(decision==='없음') return 0;
  const pos=c.tintPosition||'전면';
  const p=c.matchedPart;
  if(pos!=='전면'){
    if(!p) return null;
    const noVat=pos==='측면'?p.tintSide:pos==='후면'?p.tintRear:p.tintRearRedo;
    if(noVat===undefined||noVat===null||noVat==='') return null;
    return Math.round(Number(noVat)*1.1);
  }
  if(decision==='기본' && !c.tintInfo) return 132000;
  const grade=effectiveTintGrade(c);
  if(!p || !grade) return null;
  const map={'기본':p.tint30,'일반':p.tint50,'중급':p.tint70,'고급':p.tint90};
  const noVat=map[grade];
  if(noVat===undefined||noVat===null||noVat==='') return grade==='기본'?132000:null;
  return Math.round(Number(noVat)*1.1);
}
function restoreTintFollowupReportText(c){

  const lines=[

    `희망 등급: ${gradeLabel}${vat!==null?`  /  금액: ${fmtNum(vat)}(부가세포함)`:'  /  금액 확인 부탁드립니다.'}`,
    ` ${franchiseName}${travel?' '+travel:''} / 썬팅 포함 배정금액 확인부탁드립니다.`

}
function tintChoiceChips(decision,effectiveGrade,pos){
  if(pos && pos!=='전면'){
    const items=[['진행','진행'],['없음','미진행']];
    return items.map(([val,label])=>`<div class="chip ${decision===val?'active':''}" data-tintdecision="${val}">${label}</div>`).join('');
  }
  const gradeItems = (!pos||pos==='전면') ? [['기본','기본','tintgrade'],['일반','일반','tintgrade'],['중급','중급','tintgrade'],['고급','고급','tintgrade']] : [];
  const items=[['없음','없음','tintdecision'],...gradeItems,['확인필요','확인 필요','tintdecision']];
  return items.map(([val,label,kind])=>{
    const active = kind==='tintdecision' ? decision===val : effectiveGrade===val;
    const attr = kind==='tintdecision' ? `data-tintdecision="${val}"` : `data-tintgrade="${val}"`;
    return `<div class="chip ${active?'active':''}" ${attr}>${label}</div>`;
  }).join('');
}
function glassAmountForCase(c){

}
function replacementGlassAmount(c){
  const p=c.matchedPart; if(!p) return null;
  const pos=effectiveGlassPosition(c);
  if(pos==='측면강화') return p.sideTempered;
  if(pos==='측면접합') return p.sideLaminated;
  if(pos==='후면') return p.rear;
  return p.replaceFront;
}
function detectPositionFromText(text){
  const t=String(text||'');
  if(/측면|사이드|옆유리|옆문|앞도어(?!.*앞유리)|뒷도어(?!.*뒷유리)|프론트도어|리어도어|앞문유리|뒷문유리/.test(t)) return '측면';
  if(/후면|뒷유리|리어글라스|리어윈도우|백글라스|뒷창/.test(t)) return '후면';
  if(/파노라마|썬루프|선루프/.test(t)) return '파노라마';
  if(/고정창/.test(t)) return '고정창';
  if(/전면|앞유리|프론트글라스|윈드쉴드|윈드실드/.test(t)) return '전면';
  return '';
}
/* 측면유리는 다이아몬드 조회 부품명·파손부위 원문에 '앞문유리'/'뒷문유리'로 그대로 표기되는 경우가 많습니다.
   이 표기를 감지해 화면(파손부위 확인 칩·단가 카드·처리내용)에 그대로 반영합니다. */
function detectSideDoorFromText(text){
  const t=String(text||'');
  if(/뒷문유리|뒷문|뒷도어|리어도어|2열\s*도어|뒤도어/.test(t)) return '뒷문';
  if(/앞문유리|앞문|앞도어|프론트도어|1열\s*도어/.test(t)) return '앞문';
  return '';
}
function effectiveSideDoor(c){
  if(!c) return '';
  if(c.sideDoor) return c.sideDoor;
  return detectSideDoorFromText(c.partName) || detectSideDoorFromText(c.diamondRaw) || detectSideDoorFromText(c.damage) || detectSideDoorFromText(c.rawText) || '';
}
function sideDoorLabel(c){
  const d=effectiveSideDoor(c);
  return d ? d+'유리' : '';
}
function effectiveGlassPosition(c){
  return c.glassPosition || repairCategoryPosition(c.repairCategory) || '전면';
}
/* 측면강화·측면접합일 때 화면에 보여줄 라벨 — 앞문유리/뒷문유리가 감지·선택되어 있으면 함께 표기 */
function glassPositionDisplayLabel(c){
  const pos=effectiveGlassPosition(c);
  const base=pos==='측면강화'?'측면유리(강화)':pos==='측면접합'?'측면유리(접합)':pos==='후면'?'후면유리':'전면유리';
  if(pos!=='측면강화'&&pos!=='측면접합') return base;
  const door=sideDoorLabel(c);
  return door ? `${door}·${base}` : base;
}
function glassReplacementServiceLabel(c){
  const pos=effectiveGlassPosition(c);
  if(pos==='후면') return '후면유리교체';
  if(pos==='측면강화'||pos==='측면접합'){
    const door=effectiveSideDoor(c);
    const row=door==='앞문'?'1열':door==='뒷문'?'2열':'';
    let seat='';
    for(const raw of [c.partName,c.damage,c.diamondRaw,c.rawText]){
      const t=String(raw||'');
      if(/운전석|\(\s*운\s*\)/.test(t)){seat='운전석';break;}
      if(/조수석|\(\s*조\s*\)/.test(t)){seat='조수석';break;}
    }
    return [row,seat,'측면유리교체'].filter(Boolean).join(' ');
  }
  return '전면유리교체';
}
function assignmentValidation(c){
  const missing=[];
  const p=c.matchedPart;
  const glassAmt=p ? replacementGlassAmount(c) : null;
  const priceInquiry=c.repairType==='교체'&&c.replacementPriceInquiry;
  if(!priceInquiry){
    if(!p || glassAmt===null || glassAmt===undefined || glassAmt==='') missing.push('유리교체 단가 매칭');
    if(!c.glassPriceChecked) missing.push('유리교체 단가 확인 체크');
  }
  if(c.repairType==='교체'){
    const decision=resolvedTintDecision(c);
    if(decision==='없음'){
      if(!c.tintSpecChecked) missing.push('썬팅 없음 확인 체크');
    } else {
      if(!decision) missing.push((c.tintPosition||'전면')==='전면'?'썬팅 정보 없음 → 없음/기본/등급/확인필요 선택':'썬팅 진행/미진행 선택');
      if(decision==='확인필요') missing.push('썬팅 사양 확인 필요 해결');
      const pos=c.tintPosition||'전면';
      const grade=effectiveTintGrade(c);
      if(pos==='전면' && decision!=='확인필요' && !grade) missing.push('썬팅 등급 선택');
      const tintAmt=resolvedTintVat(c);
      if(decision!=='확인필요' && (tintAmt===null || tintAmt<=0)) missing.push('썬팅 금액 확인');
      if(!c.tintSpecChecked) missing.push('썬팅 사양 확인 체크');
      if(!c.tintPriceChecked) missing.push('썬팅 금액 확인 체크');
    }
  }
  if(!c.franchise) missing.push('시공점 선택');
  if(!c.franchiseChecked) missing.push('시공점 최종 확인 체크');
  if(!c.travelMinutes) missing.push('이동시간 확인');
  if(!c.travelKm) missing.push('거리 확인');
  return {ready:missing.length===0, missing, glassAmt, tintAmt:resolvedTintVat(c), tintDecision:resolvedTintDecision(c), tintGrade:effectiveTintGrade(c)};
}

function canNavigateStep(c,targetKey){

function parseDiamondText(raw, c){
  const result={};
  const source=(raw||'').replace(/\r/g,'').trim();
  if(!source) return result;
  const partMatch=source.toUpperCase().match(/\b(?:\d{5}-[A-Z0-9]+(?:\([A-Z0-9]+\))?|\d{8,10})\b/);
  if(partMatch){
    result.partNoInput=partMatch[0].trim();
    const before=source.slice(0,partMatch.index).trim();
    const tabBefore=before.split(/\t|\n/).map(s=>s.trim()).filter(Boolean);
    let pname=tabBefore.length?tabBefore[tabBefore.length-1]:before;
    if(c && c.model && pname.startsWith(c.model)) pname=pname.slice(c.model.length).trim();
    result.partName=pname.replace(/\b(재고없음|재고 없음|비품|정품|재고있음|재고 있음)\b/gi,'').trim();
    const after=source.slice(partMatch.index+partMatch[0].length);
    const priceMatches=[...after.matchAll(/(?:^|[\s\t])([0-9]{1,3}(?:,[0-9]{3})+|[0-9]{4,})(?:원)?(?=$|[\s\t])/g)];
    if(priceMatches.length) result.partPrice=digitsOnly(priceMatches[0][1]);
  }
  return result;
}

function normalizeProcEdit(col,text){let v=String(text??'').replace(/^현재건|^추가\d+/,'').trim();if(['L','M','N','R','S','T'].includes(col))return digitsOnly(v);if(['B','C','D','P'].includes(col)){const m=v.match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;}return v;}
function paintProcSelection(){
  document.querySelectorAll('.excel-data-cell').forEach(td=>td.classList.remove('proc-selected'));
  const sel=state.procSelection;if(!sel)return;
  const r1=Math.min(sel.startRow,sel.endRow),r2=Math.max(sel.startRow,sel.endRow),c1=Math.min(sel.startCol,sel.endCol),c2=Math.max(sel.startCol,sel.endCol);
  document.querySelectorAll('.excel-data-cell').forEach(td=>{const r=Number(td.dataset.procRow),c=Number(td.dataset.procCol);if(r>=r1&&r<=r2&&c>=c1&&c<=c2)td.classList.add('proc-selected');});
  const cols=PROCESSING_HEADERS.map(x=>x[0]);const st=document.getElementById('excelCopyStatus');if(st)st.textContent=`선택: ${r1+1}~${r2+1}행 / ${cols[c1]}~${cols[c2]}열 · Ctrl+C로 원본 엑셀에 붙여넣을 수 있습니다.`;
}
function wireProcessingExcel(c){
  ensureProcessingRows(c);
  const cells=[...document.querySelectorAll('.excel-data-cell')];if(!cells.length)return;
  let dragging=false;
  cells.forEach(td=>{
    td.addEventListener('mousedown',e=>{if(e.button!==0||td.classList.contains('proc-editing'))return;e.preventDefault();dragging=true;state.procSelection={startRow:Number(td.dataset.procRow),endRow:Number(td.dataset.procRow),startCol:Number(td.dataset.procCol),endCol:Number(td.dataset.procCol)};paintProcSelection();});
    td.addEventListener('mouseenter',()=>{if(dragging&&state.procSelection){state.procSelection.endRow=Number(td.dataset.procRow);state.procSelection.endCol=Number(td.dataset.procCol);paintProcSelection();}});
    td.addEventListener('dblclick',e=>{e.preventDefault();e.stopPropagation();if(td.dataset.formula==='1'){showToast('이 셀은 원본 엑셀 수식으로 자동 계산됩니다.');return;}dragging=false;const tag=td.querySelector('.excel-row-tag');if(tag)tag.style.display='none';td.classList.add('proc-editing');td.contentEditable='true';td.focus();const range=document.createRange();range.selectNodeContents(td);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);});
    td.addEventListener('blur',async()=>{if(!td.classList.contains('proc-editing'))return;const col=td.dataset.procCell,row=Number(td.dataset.procRow);const tag=td.querySelector('.excel-row-tag');const raw=td.textContent;const val=normalizeProcEdit(col,raw);if(row===0){c.processingSheet=c.processingSheet||{};c.processingSheet[col]=val;}else{ensureProcessingRows(c);c.processingExtraRows[row-1]=c.processingExtraRows[row-1]||{};c.processingExtraRows[row-1][col]=val;}td.contentEditable='false';td.classList.remove('proc-editing');if(tag)tag.style.display='';await commit(c,{skipListRefresh:true});renderMain();});
    td.addEventListener('keydown',e=>{if(e.key==='Enter'&&td.classList.contains('proc-editing')){e.preventDefault();td.blur();}});
  });
  document.addEventListener('mouseup',()=>{dragging=false;},{once:true});
  const selBtn=document.getElementById('selectProcessingRowBtn');if(selBtn)selBtn.addEventListener('click',()=>{state.procSelection={startRow:0,endRow:0,startCol:0,endCol:PROCESSING_HEADERS.length-1};paintProcSelection();showToast('현재 건 A~W 선택됨');});
  const sel5=document.getElementById('selectProcessing5Btn');if(sel5)sel5.addEventListener('click',()=>{state.procSelection={startRow:0,endRow:4,startCol:0,endCol:PROCESSING_HEADERS.length-1};paintProcSelection();showToast('5개 행 전체 선택됨');});
  const copyBtn=document.getElementById('copyProcessingRowBtn');if(copyBtn)copyBtn.addEventListener('click',()=>copyText(processingRowText(c,'A','W',0),'처리내용 현재 건 1행'));
  const sc=document.getElementById('processingExcelScroll');const left=document.getElementById('procScrollLeft'),right=document.getElementById('procScrollRight');if(left&&sc)left.addEventListener('click',()=>sc.scrollBy({left:-650,behavior:'smooth'}));if(right&&sc)right.addEventListener('click',()=>sc.scrollBy({left:650,behavior:'smooth'}));if(sc)sc.addEventListener('wheel',e=>{if(e.shiftKey){e.preventDefault();sc.scrollLeft+=e.deltaY;}},{passive:false});
  paintProcSelection();
}

function wireStep(step, c){
  if(step==='shopSchedule'){

  }
  if(step==='intake'){
    document.getElementById('parseBtn').onclick = async ()=>{
      const raw = document.getElementById('rawText').value;

      const oldRegion=c.region, oldTint=c.tintInfo;

      if(tintDirect&&tintDirect.trim()) c.tintInfo=tintDirect.trim();
      if(parsed.tintInfo==='' && !/썬팅/.test(c.repairCategory||'') && !c.customerCallStatus){
        c.customerTintChoice='안함';c.tintDecision='없음';c.tintGrade='';c.tintSpecMode='';
      }
      if(parsed.region!==undefined&&c.region!==oldRegion){c.franchise=null;c.franchiseManual=false;c.matchRegion='';c.matchCandidates=[];c.travelMinutes='';c.travelKm='';c.franchiseChecked=false;resetAssignmentConfirmed(c);}
      if(parsed.tintInfo!==undefined&&c.tintInfo!==oldTint){c.tintDecision='';c.tintGrade='';c.manualTintVat='';c.tintSpecChecked=false;c.tintPriceChecked=false;resetAssignmentConfirmed(c);}
      await commit(c);
      renderMain();
      showToast('접수 내용 자동 인식 완료');

    const confirmAssignmentBtn=document.getElementById('confirmAssignmentBtn');

           이 초기화가 없으면 tintDecision의 오래된 '기본' 값이 새 선택을 덮어씁니다. */
        if(c.customerTintChoice==='진행' && c.tintInfo && !isTintNoneText(c.tintInfo)){
          const inferred=guessTintGrade(c.tintInfo);
          if(inferred && !c.tintGrade){
            c.tintGrade=inferred;
            c.tintDecision=inferred==='기본'?'기본':'등급선택';
            c.tintSpecMode='same';

          c.manualTintVat='';c.assignmentConfirmed=false;

    });

    });
    document.getElementById('alarmSent').addEventListener('change', async (e)=>{
      c.alarmSent = e.target.checked; await commit(c); renderMain();
    });
    const completeBtn = document.getElementById('completeCaseBtn');
    if(completeBtn) completeBtn.addEventListener('click', async ()=>{
      const check=finalValidation(c);
      if(!check.ready){showToast('완료 불가: '+check.missing.join(' / '));return;}

/* ============ V10 데이터 백업 / 복원 ============ */
function exportRedcapBackup(){
  try{
    const data={version:'V10',exportedAt:new Date().toISOString(),items:{}};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.startsWith(STORAGE_PREFIX)) data.items[k]=localStorage.getItem(k);
    }
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`레드캡_업무데이터_백업_${todayStr()}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    showToast('업무 데이터 백업파일 저장');
  }catch(e){ console.error(e); showToast('백업 실패'); }
}
async function importRedcapBackupFile(file){
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    if(!data || typeof data.items!=='object') throw new Error('올바른 백업파일이 아닙니다.');
    const keys=Object.keys(data.items).filter(k=>k.startsWith(STORAGE_PREFIX));
    if(!keys.length) throw new Error('복원할 레드캡 데이터가 없습니다.');
    if(!confirm(`백업 데이터 ${keys.length}개 항목을 복원할까요? 현재 저장내용은 백업파일 내용으로 교체됩니다.`)) return;
    const remove=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.startsWith(STORAGE_PREFIX)) remove.push(k);}
    remove.forEach(k=>localStorage.removeItem(k));
    keys.forEach(k=>localStorage.setItem(k,data.items[k]));
    alert('복원이 완료되었습니다. 화면을 다시 불러옵니다.');
    location.reload();
  }catch(e){ console.error(e); alert('백업 복원 실패: '+e.message); }
}

(function(){

    c.roadAddress='';
    return c;
  };

  function cleanRoadAddress(v){
    let s=(v||'').toString().replace(/\r?\n/g,' ').replace(/\s+/g,' ').trim();
    s=s.replace(/^도로명주소\s*[:：]?\s*/,'').replace(/^주소\s*[:：]?\s*/,'');
    s=s.replace(/^서울시(?=\s)/,'서울특별시').replace(/^서울(?=\s)/,'서울특별시')
       .replace(/^경기(?=\s)/,'경기도').replace(/^충북(?=\s)/,'충청북도').replace(/^충남(?=\s)/,'충청남도')
       .replace(/^전북(?=\s)/,'전라북도').replace(/^전남(?=\s)/,'전라남도').replace(/^경북(?=\s)/,'경상북도').replace(/^경남(?=\s)/,'경상남도');

    s=s.replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();

  /* 오른쪽 미완료/확인 목록에 고객 부재도 유지 */
  attentionReason=function(c){

  updateAttentionSidebar=function(){

  const ALARM_TEMPLATE_FRANCHISE='레드캡렌터카 장애처리 시공안내_가맹점용(수정)';
  const ALARM_TEMPLATE_PARTNER='레드캡렌터카 장애처리 시공안내_협력점용(수정)';

  function tintCallPriceRows(c){
    const p=c&&c.matchedPart;
    const rules=(typeof window!=='undefined'&&window.__TINT_RULES_V13)?window.__TINT_RULES_V13:null;
    const base=(typeof window!=='undefined'&&window.__TINT_BASE_NOVAT)?window.__TINT_BASE_NOVAT:{'기본':120000,'일반':150000,'중급':200000,'고급':250000};
    const defs=[
      ['기본',p&&p.tint30],
      ['일반',p&&p.tint50],
      ['중급',p&&p.tint70],
      ['고급',p&&p.tint90]
    ];
    return defs.map(([grade,noVat])=>{
      const hasPrice=!(noVat===undefined||noVat===null||noVat==='');
      const n=hasPrice?Number(noVat):(base[grade]||null);
      const product=(rules&&rules[grade]&&rules[grade].products)?rules[grade].products.join(' · '):'';
      return {grade,product,noVat:n,vat:n===null?null:Math.round(n*1.1),fallback:!hasPrice};
    });
  }
  function tintCallQuickMenuHtml(c){
    if(!c||c.repairType!=='교체') return '';

  alarmRows=function(c){

(function(){

lass="status" id="status">선택된 셀이 없습니다.</div></div><div class="sheetwrap"><div class="scroll"><table id="tbl"><colgroup><col style="width:30px">${headers.map(h=>`<col style="width:${widths[h.col]||100}px">`).join('')}</colgroup><thead><tr class="letters"><th></th>${headers.map(h=>`<th>${h.col}</th>`).join('')}</tr><tr class="headers"><th>선택</th>${headers.map(h=>`<th title="${v19PopupEscape(h.note||'')}">${v19PopupEscape(h.label).replace(/\n/g,'<br>')}</th>`).join('')}</tr></thead><tbody>${rows.map((vals,ri)=>`<tr class="data ${ri===0?(c.workCompleted?'done':'new-entry'):''}"><td class="rowchk"><input type="checkbox" class="rowcheck" data-rc="${ri}" ${ri===0?'checked':''}></td>${headers.map((h,ci)=>{const isHighlight=ri===0&&isPending&&NEW_ENTRY_COLS.includes(h.col);const cls=[['Q','U','V'].includes(h.col)?'formula':'',['L','M','N'].includes(h.col)?'green':'',h.col==='R'?'yellow':'',h.col==='U'?'pink':'',h.col==='W'?'note':'',isHighlight?(beforeAlarm?'new-cell':'new-cell-sent'):''].filter(Boolean).join(' ');return `<td class="${cls}" data-r="${ri}" data-c="${ci}" data-col="${h.col}" data-formula="${['Q','U','V'].includes(h.col)?'1':'0'}">${v19PopupEscape(v19PopupDisplay(h.col,vals))}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="hint">※ 원본 엑셀의 실제 행 번호가 달라도 U/V 수식은 ROW() 기준이라 붙여넣은 행에서 계산됩니다. "값만 복사"는 수식 대신 계산된 숫자만 복사해 붙여넣어도 원본 수식이 깨지지 않습니다. NO.열은 원본 엑셀의 실제 행번호를 직접 입력하세요. L/M/N/R/S/T는 숫자만 입력하면 자동으로 콤마가 붙고, 처리일자(C)를 입력하면 처리월(Q)·진행비용(U)·매출이익(V)이 자동 계산됩니다.</div></div><script>

(function(){

(function(){
  const BLOCKED_SHOPS=['금강차유리','아우라자동차유리'];
  const isBlockedShop=(name)=>BLOCKED_SHOPS.some(k=>String(name||'').includes(k));

  /* 배정 대상에서 완전히 제외: 가맹·협력점 보기 / 추천 / 드롭다운 모두 공통 데이터 사용 */
  try{
    if(Array.isArray(FRANCHISE_DATA)){
      for(let i=FRANCHISE_DATA.length-1;i>=0;i--){
        if(isBlockedShop(FRANCHISE_DATA[i]&&FRANCHISE_DATA[i].name)) FRANCHISE_DATA.splice(i,1);
      }
    }
    if(typeof ASSIGNMENT_HISTORY_BY_REGION==='object' && ASSIGNMENT_HISTORY_BY_REGION){
      Object.keys(ASSIGNMENT_HISTORY_BY_REGION).forEach(k=>{
        if(Array.isArray(ASSIGNMENT_HISTORY_BY_REGION[k])){
          ASSIGNMENT_HISTORY_BY_REGION[k]=ASSIGNMENT_HISTORY_BY_REGION[k].filter(x=>!isBlockedShop(x&&x.name));
        }
      });
    }
    if(typeof state==='object' && state && Array.isArray(state.cases)){
      state.cases.forEach(c=>{
        if(c && c.franchise && isBlockedShop(c.franchise.name||c.franchise)) c.franchise=null;
        if(c && Array.isArray(c.matchCandidates)) c.matchCandidates=c.matchCandidates.filter(x=>!isBlockedShop(x&&x.name));
      });
    }
  }catch(e){ console.warn('v28 shop filter',e); }

  if(typeof candidateFranchises==='function'){
    const __candidateFranchisesV28=candidateFranchises;
    candidateFranchises=function(){
      const rows=__candidateFranchisesV28.apply(this,arguments);
      return Array.isArray(rows)?rows.filter(x=>!isBlockedShop(x&&x.name)):rows;
    };
  }

  /*
    핵심: 같은 업무단계 안에서 renderMain()이 다시 실행되는 모든 경우
    stepBody와 브라우저 스크롤 위치를 무조건 그대로 복구한다.
    - 체크박스
    - 썬팅 진행/안함/고민중
    - 등급 선택
    - 사진 붙여넣기/삭제
    - 입력값 저장
    등 개별 이벤트마다 예외처리하지 않는다.
    단계 자체가 바뀌었을 때만 새 화면 위치를 허용한다.
  */
  const __renderMainV28=renderMain;
  let restoring=false;
  renderMain=function(){
    if(restoring) return __renderMainV28.apply(this,arguments);
    const beforeStep=state&&state.activeStep;
    const beforeBody=document.getElementById('stepBody');
    const bodyTop=beforeBody?beforeBody.scrollTop:0;
    const bodyLeft=beforeBody?beforeBody.scrollLeft:0;
    const winX=window.scrollX||0;
    const winY=window.scrollY||0;
    const out=__renderMainV28.apply(this,arguments);
    const sameStep=(state&&state.activeStep)===beforeStep;
    if(sameStep){
      const restore=()=>{
        const b=document.getElementById('stepBody');
        if(b){b.style.scrollBehavior='auto';b.scrollTop=bodyTop;b.scrollLeft=bodyLeft;}
        window.scrollTo(winX,winY);
      };
      // 여러 프레임과 타이머에서 반복 복원하면 화면이 위아래로 튀므로
      // 렌더 직후 한 번만 즉시 복원합니다.
      restore();
    }
    return out;
  };

  /* focus() 때문에 체크 후 브라우저가 선택항목을 다시 화면 중앙으로 끌어오는 것도 방지 */
  document.addEventListener('click',function(e){
    const t=e.target;
    if(!t) return;
    const control=t.closest && t.closest('input[type="checkbox"], .chip, [data-tintgrade], [data-tintchoice], [data-repairassessment]');
    if(!control) return;
    /* 필수확인사항 이동 버튼(.assignment-check-item / .req-jump)은 의도적 이동이므로 제외 */
    if(t.closest('.assignment-check-item') || t.closest('.req-jump')) return;
    const b=document.getElementById('stepBody');
    if(!b) return;
    const top=b.scrollTop,left=b.scrollLeft,wx=window.scrollX||0,wy=window.scrollY||0;
    const a=document.getElementById('stepBody');if(a){a.scrollTop=top;a.scrollLeft=left;}window.scrollTo(wx,wy);
  },true);

  try{ renderSidebar(); renderMain(); }catch(e){ console.warn('v28 refresh',e); }
})();



(function(){
  /* 고객확인사항(전화통화) 단계가 실제로 다 끝났는지 판정 */
  function callStepMissing(c){
    const missing=[];
    if(!c) return missing;
    if(c.customerCallStatus!=='통화완료'){ missing.push('고객 통화 연결(부재 시 다음 단계로 못 넘어감)'); return missing; }
    if(c.repairType==='복원'){
      if(!c.restoreGuideConfirmed) missing.push('복원 진행 확인');
      if(!c.scarNoticeConfirmed) missing.push('잔상 고지 완료');
    }
    if(c.repairType==='교체'){
      if(!c.customerTintChoice) missing.push('썬팅 진행 여부 선택');
      else if(c.customerTintChoice==='고민중'){ missing.push('썬팅 진행 여부 확정(고민중 상태)'); return missing; }
      if(!c.deductible) missing.push('계약면책금 입력(왼쪽 사이드바)');
      if((c.customerTintChoice==='진행'||c.customerTintChoice==='안함')&&!c.redcapGroupNoticeSent) missing.push('레드캡 단톡방 문구 전송 완료');
    }
    const intakeLocation=c.callLocationType==='workshop'||c.callLocationType==='redcap'||isShopIntakeCase(c)||(window.__isRedcapDepotCase&&window.__isRedcapDepotCase(c));
    if(!intakeLocation){
      if(!c.locationConfirmed) missing.push('고객 위치 확인');
      if(c.locationConfirmed==='different' && !String(c.customerAltAddress||'').trim()) missing.push('실제 주소 입력');
    }
    return missing;
  }
  window.__callStepMissing = callStepMissing;

  const __v29WireStepRedcapSend = wireStep;
  wireStep = function(step,c){
    __v29WireStepRedcapSend(step,c);
    if(step!=='call')return;
    const sentBtn=document.getElementById('redcapGroupNoticeSentBtn');
    if(sentBtn)sentBtn.addEventListener('click',async()=>{
      c.redcapGroupNoticeSent=true;
      await commit(c,{skipListRefresh:true});
      renderMain();renderSidebar();
      showToast('레드캡 문구 전송 완료로 저장했습니다.');
    });
  };

  const __v29StepDone = stepDone;
  stepDone = function(c,key){
    if(key==='call'){
      if(!c) return false;
      if(c.customerCallStatus==='부재') return false;
      return callStepMissing(c).length===0;
    }
    return __v29StepDone(c,key);
  };

  const __v29CanNavigateStep = canNavigateStep;
  canNavigateStep = function(c,targetKey){
    const r = __v29CanNavigateStep(c,targetKey);
    if(!r.ok) return r;
    const targetIdx = STEP_DEFS.findIndex(x=>x.key===targetKey);
    if(targetIdx>3 && !stepDone(c,'call')){
      const missing=callStepMissing(c);
      return {ok:false, msg:'고객확인사항을 먼저 완료해주세요: '+(missing.join(' · ')||'미완료 항목이 있습니다.')};
    }
    if(targetKey==='shopSchedule' && !c.shopForwarded && c.status!=='done'){
      return {ok:false, msg:'시공점 전달을 먼저 완료해주세요.'};
    }
    return {ok:true, msg:''};
  };

  function flowStepsSafe(c){
    const needsCeo = (typeof window.__needsCeoDecision==='function') ? window.__needsCeoDecision(c) : true;
    return needsCeo ? STEP_DEFS : STEP_DEFS.filter(x=>x.key!=='ceo');
  }

  /* 다음 버튼을 실제 이동 가능 여부에 맞춰 항상 비활성화 + 이유를 툴팁으로 안내 */
  footerNav = function(c){
    const defs = flowStepsSafe(c);
    let idx = defs.findIndex(s=>s.key===state.activeStep); if(idx<0) idx=0;
    const prev = idx>0?defs[idx-1]:null, next = idx<defs.length-1?defs[idx+1]:null;
    const gate = next ? canNavigateStep(c,next.key) : {ok:true,msg:''};
    const blocked = !!(next && !gate.ok);
    return `<div>${prev?`<button class="btn btn-ghost" id="prevStepBtn">← ${prev.label}</button>`:'<span></span>'}</div><div>${next?`<button class="btn btn-primary" id="nextStepBtn" ${blocked?'disabled':''} title="${blocked?escapeHtml(gate.msg):''}">${blocked?'확인사항 완료 후 다음':next.label+' →'}</button>`:''}</div>`;
  };
})();

(function(){
  const moneyIds=new Set(['deductible','partPrice','manualPriceAmt','manualTintVat','assignmentCost','assignmentCostTint','assignmentCostNoTint']);
  function commaMoney(value){
    const raw=String(value??'').trim();

    const neg=raw.startsWith('-');
    const digits=raw.replace(/\D/g,'');
    if(!digits)return raw;
    return (neg?'-':'')+Number(digits).toLocaleString('ko-KR');
  }
  function formatMoneyFields(root){
    (root||document).querySelectorAll('input').forEach(el=>{
      if(!moneyIds.has(el.id)&&el.dataset.money!=='true')return;

(function(){
  const ARCHIVE_DB_NAME='rc_archive_fs_v1';
  const ARCHIVE_STORE='handles';
  function idbOpen(){
    return new Promise((resolve,reject)=>{
      if(!window.indexedDB){reject(new Error('IndexedDB 미지원'));return;}
      const req=indexedDB.open(ARCHIVE_DB_NAME,1);
      req.onupgradeneeded=()=>{ try{req.result.createObjectStore(ARCHIVE_STORE);}catch(e){} };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
  }
  async function idbSet(key,val){
    try{
      const db=await idbOpen();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(ARCHIVE_STORE,'readwrite');
        tx.objectStore(ARCHIVE_STORE).put(val,key);
        tx.oncomplete=()=>resolve(true); tx.onerror=()=>reject(tx.error);
      });
    }catch(e){return false;}
  }
  async function idbGet(key){
    try{
      const db=await idbOpen();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(ARCHIVE_STORE,'readonly');
        const req=tx.objectStore(ARCHIVE_STORE).get(key);
        req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
      });
    }catch(e){return null;}
  }

  window.__archiveDirHandle = null;
  window.__archiveDirName = '';

  function cleanPart(v){
    if(typeof window.__cleanFolderPart==='function') return window.__cleanFolderPart(v);
    return String(v||'').trim().replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').replace(/[. ]+$/,'');
  }
  function completeFolderName(c){
    if(typeof window.__archiveFolderNameFn==='function') return window.__archiveFolderNameFn(c);
    const no=cleanPart(c.archiveRowNo||'')||'행번호미입력';
    const client=cleanPart((c.archiveClientLabel)||(c.franchise&&c.franchise.name)||'시공점');
    const plate=cleanPart(c.plate||'차량번호');
    return `${no}.${client}_${plate}`;
  }
  window.__completeFolderName=completeFolderName;

  function updateArchiveFolderBtn(){
    const btn=document.getElementById('archiveFolderPickBtn');
    if(!btn) return;
    if(window.__archiveDirName){
      btn.textContent = '📁 '+window.__archiveDirName;
      btn.title = '공유폴더: '+window.__archiveDirName+' (클릭하여 변경)';
    }else{
      btn.textContent = '📁 공유폴더 선택';
      btn.title = '완료사진을 저장할 공유폴더를 선택합니다.';
    }
  }
  window.__updateArchiveFolderBtn=updateArchiveFolderBtn;

  async function restoreArchiveHandle(){
    if(!window.showDirectoryPicker) return;
    try{
      const handle=await idbGet('dir');
      if(handle){
        window.__archiveDirHandle=handle;
        window.__archiveDirName=handle.name;
        updateArchiveFolderBtn();
      }
    }catch(e){}
  }

  async function pickArchiveFolder(){
    if(!window.showDirectoryPicker){
      if(typeof showToast==='function') showToast('이 브라우저는 폴더 저장 기능을 지원하지 않습니다. PC용 Chrome에서 이용해주세요.');
      return;
    }
    try{
      const handle=await window.showDirectoryPicker({mode:'readwrite'});
      window.__archiveDirHandle=handle;
      window.__archiveDirName=handle.name;
      await idbSet('dir',handle);
      updateArchiveFolderBtn();
      if(typeof showToast==='function') showToast('공유폴더가 설정되었습니다: '+handle.name+' (앞으로 계속 이 폴더에 저장됩니다)');
    }catch(e){ /* 사용자가 취소함 */ }
  }

  function wireFolderBtn(){
    const btn=document.getElementById('archiveFolderPickBtn');
    if(btn && !btn.__archiveWired){ btn.__archiveWired=true; btn.addEventListener('click',pickArchiveFolder); }
  }
  wireFolderBtn();
  document.addEventListener('DOMContentLoaded',wireFolderBtn);
  restoreArchiveHandle();

  async function ensureWritePermission(handle){
    if(!handle) return false;
    try{
      let perm=await handle.queryPermission({mode:'readwrite'});
      if(perm==='granted') return true;
      perm=await handle.requestPermission({mode:'readwrite'});
      return perm==='granted';
    }catch(e){ return false; }
  }

  async function saveCompletionPhotos(c, files){
    if(!window.__archiveDirHandle){ if(typeof showToast==='function') showToast('먼저 왼쪽 상단의 "공유폴더 선택" 버튼으로 저장할 폴더를 지정해주세요.'); return false; }
    const ok=await ensureWritePermission(window.__archiveDirHandle);
    if(!ok){ if(typeof showToast==='function') showToast('공유폴더 접근 권한이 필요합니다. 폴더를 다시 선택해주세요.'); return false; }
    try{
      const folderName=completeFolderName(c);
      const subDir=await window.__archiveDirHandle.getDirectoryHandle(folderName,{create:true});
      let i=(c.completionPhotoFiles||[]).length;
      for(const file of files){
        i++;
        const ext=(file.name.match(/\.[^.]+$/)||[''])[0];
        const base=file.name.replace(/\.[^.]+$/,'');
        const safeName=`${String(i).padStart(2,'0')}_${cleanPart(base)}${ext}`;
        const fileHandle=await subDir.getFileHandle(safeName,{create:true});
        const writable=await fileHandle.createWritable();

    </div>`;

  window.stepComplete=function(c){
    const folder=completeFolderName(c);

      <div class="stage-sub">가맹점에서 카톡으로 받은 <b>완료사진을 첨부</b>하면 지정한 공유폴더 안에 <b>${escapeHtml(folder)}</b> 폴더를 자동으로 만들어 저장합니다.</div>

    const active=typeof getActiveCase==='function'?getActiveCase():null;
    const pos=active&&typeof effectiveGlassPosition==='function'?effectiveGlassPosition(active):'';
    const raw=String(q).toLowerCase().replace(/[()]/g,' ');
    const tokens=raw.split(/\s+/).filter(Boolean);

(function(){
  let renderedRoute='';
  let forceToken=0;

  function currentRoute(){const c=getActiveCase();return (c?c.id:'none')+':'+String(state.activeStep||'');}
  function forceStepTop(){
    const token=++forceToken;
    window.__v25KeepAssignmentScroll=false;
    const apply=()=>{
      if(token!==forceToken)return;
      const body=document.getElementById('stepBody');
      if(body){body.scrollTop=0;body.scrollLeft=0;}
      const main=document.getElementById('main');if(main)main.scrollTop=0;
      window.scrollTo({top:0,left:0,behavior:'auto'});
    };
    // 단계 전환 뒤 여러 타이머로 0.45초 동안 스크롤을 반복 보정하면 화면이
    // 멈추거나 튀는 것처럼 보입니다. 다음 프레임에서 한 번만 확정합니다.
    requestAnimationFrame(apply);
  }
  window.__forceRedcapStepTop=forceStepTop;

  function missingForCurrentStep(c){
    try{
      if(state.activeStep==='assignment'&&typeof assignmentValidation==='function')return assignmentValidation(c).missing||[];
      if(state.activeStep==='call'&&typeof window.__callStepMissing==='function')return window.__callStepMissing(c)||[];
    }catch(_e){}
    return [];
  }

  const oldRenderMainV65=renderMain;
  renderMain=function(){
    const before=currentRoute();
    const routeChanged=!!renderedRoute&&renderedRoute!==before;
    renderedRoute=before;
    const out=oldRenderMainV65.apply(this,arguments);
    const c=getActiveCase();
    const info=document.querySelector('.case-header .case-info-grid');
    const missing=c?missingForCurrentStep(c):[];
    if(info&&missing.length){
      const box=document.createElement('div');
      box.className='header-missing-compact';
      box.innerHTML=`<div class="header-missing-compact-title">미처리 ${missing.length}</div><div class="header-missing-compact-items">${missing.map(x=>`<button type="button" class="header-missing-chip footer-missing-jump" data-missing-label="${escapeHtml(x)}">${escapeHtml(x)}</button>`).join('')}</div>`;
      info.insertAdjacentElement('afterend',box);
    }
    if(routeChanged||window.__redcapStepNavPending){window.__redcapStepNavPending=false;forceStepTop();}
    return out;
  };

})();



(function(){
  const compact=v=>String(v||'').toLowerCase().replace(/[\s\-().]/g,'');
  function tintAwareProcessType(c){
    if(c.repairType==='복원')return '복원 / 썬팅 X';
    if(c.repairType==='교체'){
      if(c.customerTintChoice==='진행')return '교체 / 썬팅 진행';
      if(c.customerTintChoice==='안함')return '교체 / 썬팅 X';
      if(c.customerTintChoice==='고민중')return '교체 / 썬팅 고민 중';
      return '교체 / 썬팅 확인 전';
    }
    return '처리유형 미확정 / 썬팅 확인 전';
  }
  function damageLabel(c){
    if(c.callDamageConfirm==='기타')return c.callDamageOther||'기타';
    if(c.callDamageConfirm)return c.callDamageConfirm;
    try{if(typeof glassPositionDisplayLabel==='function')return glassPositionDisplayLabel(c)||'미입력';}catch(_e){}
    return c.glassPosition||c.damage||'미입력';
  }
  function progressLabel(c){
    const options=['접수 확인중','대표님 확인중','배정비용 확인 중','고객확인중','썬팅확인중','시공점 전달','시공점 일정 확인중','확인중'];
    return options.includes(c.manualState)?c.manualState:'접수 확인중';
  }
  function progressClass(c){
    const label=progressLabel(c);
    if(label==='대표님 확인중')return 'status-owner';
    if(label==='배정비용 확인 중')return 'status-cost';
    if(label==='고객확인중')return 'status-customer';
    if(label==='썬팅확인중')return 'status-tint';
    if(label==='시공점 전달'||label==='시공점 일정 확인중')return 'status-shop';
    if(label==='확인중')return 'status-check';
    return 'status-intake';
  }
  function receivedDate(c){
    const raw=c.receivedAt||c.intakeDate||c.createdAt||'';
    const d=new Date(raw);
    if(!raw)return '미입력';
    if(isNaN(d))return String(raw);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  }
  function row(label,value,klass){return `<div class="attention-record-row ${klass||''}"><span class="k">${escapeHtml(label)}</span><span class="v">${escapeHtml(value||'미입력')}</span></div>`;}
  function attentionMemoText(c){
    const top=String(c&&c.caseMemo||'').trim();
    const call=String(c&&c.callMemo||'').trim();
    const lines=[];
    if(top)lines.push(top);
    if(call&&call!==top)lines.push(call);
    return lines.join('\n')||'메모 없음';
  }

  window.updateAttentionSidebar=function(){
    const list=document.getElementById('attentionList');if(!list)return;
    const view=window.__attentionView==='completed'?'completed':(window.__attentionView==='all'?'all':'incomplete');
    const notDone=c=>computeStatus(c)!=='done';
    let incompleteCount=0,completedCount=0,allCount=0;
    (state.cases||[]).forEach(c=>{if(!notDone(c))return;allCount++;if(c.shopScheduleDate)completedCount++;else incompleteCount++;});
    const tabList=document.getElementById('attentionTabList');
    const tabCompleted=document.getElementById('attentionTabTint');
    const tabAll=document.getElementById('attentionTabAll');
    if(tabList)tabList.textContent=`미완료 ${incompleteCount}`;
    if(tabCompleted)tabCompleted.textContent=`완료대기 ${completedCount}`;
    if(tabAll)tabAll.textContent=`전체 ${allCount}`;

    const q=String(state.sidebarSearch||'').trim().toLowerCase();
    const cq=compact(q);
    let rows=(state.cases||[]).filter(c=>{
      if(!notDone(c))return false;
      if(q){
        const f=c.franchise||{},p=c.matchedPart||{};
        const hay=[c.plate,c.model,c.diamondModel,c.vin,c.partNoInput,p.partNo,c.customerName,c.customerPhone,c.region,c.client,f.name,c.caseMemo,c.callMemo,c.manualState,damageLabel(c),tintAwareProcessType(c)].filter(Boolean).join(' ').toLowerCase();
        return hay.includes(q)||(cq&&compact(hay).includes(cq));
      }
      if(view==='all')return true;
      return view==='completed'?!!c.shopScheduleDate:!c.shopScheduleDate;
    }).sort((a,b)=>(b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||''));
    const subEl=document.getElementById('attentionSubText');if(subEl)subEl.style.display='none';
    if(!rows.length){list.innerHTML=`<div class="ref-empty">${q?'검색어와 일치하는 접수가 없습니다.':(view==='all'?'완료 전인 접수가 없습니다.':view==='completed'?'완료 대기 중인 접수가 없습니다.':'현재 미완료 접수가 없습니다.')}</div>`;return;}
    const limit=Math.max(24,Number(window.__attentionRenderLimit)||24);
    const total=rows.length;
    const visibleRows=rows.slice(0,limit);
    list.innerHTML=visibleRows.map(c=>{
      try{normalizeManualState(c);}catch(_e){}
      const part=c.matchedPart||{};
      const customer=customerDisplayName(c.customerName)||'미입력';
      const model=c.diamondModel||part.model||c.model||'미입력';
      const requestedAddress=c.customerAltAddress||c.roadAddress||c.region||'미입력';
      const shop=(c.franchise&&c.franchise.name)||'미배정';
      return `<div class="attention-card v66-list-card" data-attentioncase="${c.id}"><div class="attention-priority-section">${row('접수일',receivedDate(c))}${row('배정시공점',shop)}${row('진행상태',progressLabel(c),`attention-state-row ${progressClass(c)}`)}</div><div class="attention-record-list">${row('차량번호',c.plate||'미입력')}${row('차종',model)}${row('성함',customer)}${row('핸드폰번호',c.customerPhone||'미입력')}${row('요청 주소',requestedAddress)}${row('파손부위',damageLabel(c))}${row('처리유형',tintAwareProcessType(c),'type')}${row('메모',attentionMemoText(c),'memo')}</div></div>`;
    }).join('')+(total>visibleRows.length?`<button type="button" class="btn btn-ghost attention-load-more" id="attentionLoadMoreBtn">${visibleRows.length}건 표시 중 · 다음 ${Math.min(24,total-visibleRows.length)}건 더 보기</button>`:'');
    list.querySelectorAll('[data-attentioncase]').forEach(el=>el.addEventListener('click',(event)=>{
      /* 목록의 글자를 드래그해 복사할 때 카드 열기가 실행되어 선택이 풀리지 않게 합니다. */
      const selectedText=window.getSelection?String(window.getSelection().toString()||'').trim():'';
      if(selectedText)return;
      const c=state.cases.find(x=>x.id===el.dataset.attentioncase);if(!c)return;
      state.activeId=c.id;state.view='cases';
      state.activeStep=c.shopScheduleDate?'complete':(c.shopForwarded?'shopSchedule':((c.customerTintChoice==='고민중'||c.customerCallStatus==='부재'||c.manualState==='고객확인중'||c.manualState==='썬팅확인중')?'call':'intake'));
      render();
    }));
    const more=document.getElementById('attentionLoadMoreBtn');
    if(more)more.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();window.__attentionRenderLimit=limit+24;window.__redcapForceAttentionRender=true;window.updateAttentionSidebar();});
  };

  /* 오른쪽 목록을 복사하면 화면의 한 행이 붙여넣기에서도 한 줄로 유지됩니다. */
  document.addEventListener('copy',event=>{
    const list=document.getElementById('attentionList');
    const selection=window.getSelection&&window.getSelection();
    if(!list||!selection||selection.isCollapsed||!selection.rangeCount)return;
    if(!list.contains(selection.anchorNode)&&!list.contains(selection.focusNode))return;
    const range=selection.getRangeAt(0);
    const rows=[...list.querySelectorAll('.attention-record-row')].filter(row=>{
      try{return range.intersectsNode(row);}catch(_e){return false;}
    });
    if(!rows.length)return;
    const lines=rows.map(row=>{
      const label=String(row.querySelector('.k')?.textContent||'').replace(/\s+/g,' ').trim();
      const value=String(row.querySelector('.v')?.textContent||'').replace(/\s+/g,' ').trim();
      return `${label} ${value}`.trim();
    });
    const text=lines.join('\n');
    if(!text)return;
    event.preventDefault();
    event.stopImmediatePropagation();
    event.clipboardData.setData('text/plain',text);
    event.clipboardData.setData('text/html',lines.map(line=>`<div>${escapeHtml(line)}</div>`).join(''));
  },true);
  try{window.updateAttentionSidebar();}catch(e){console.error('V66 attention list',e);}
})();

(function(){
  const previousValidation=assignmentValidation;
  assignmentValidation=function(c){
    const result=previousValidation(c);
    if(isShopIntakeCase(c)){
      const d=shopIntakeDetails(c);
      const extra=[];
      if(!d.name)extra.push('공업사명 입력');
      if(!d.address)extra.push('공업사 주소 입력');
      if(!d.phone)extra.push('공업사 연락처 입력');
      if(extra.length){
        result.missing=[...extra,...result.missing];
        result.ready=false;
      }
    }
    return result;
  };

  const previousAssignment=stepAssignment;
  stepAssignment=function(c){
    let html=previousAssignment(c);
    const anchor='<h3 class="section-title">③ 시공점 배정 확인</h3>';

        <div><label class="field-label">공업사 연락처</label><input class="field" id="intakeShopPhone" value="${escapeHtml(d.phone)}" placeholder="예: 010-3622-1077"></div>
      </div>`:''}
    </div>`;
    return html.includes(anchor)?html.replace(anchor,anchor+box):html;
  };

  const previousWire=wireStep;

      c.shopIntakeCase=toggle.checked;

        c.intakeShopAddress=c.intakeShopAddress||d.address||'';
        c.intakeShopPhone=c.intakeShopPhone||d.phone||'';
      }
      if(c.alarmRowOverrides){
        delete c.alarmRowOverrides['■ 차량위치'];
        delete c.alarmRowOverrides['■ 처리기한'];
        delete c.alarmRowOverrides['■ 비고'];
      }
      c.franchise=null;c.franchiseManual=false;c.matchRegion='';c.matchCandidates=[];
      c.travelMinutes='';c.travelKm='';c.franchiseChecked=false;c.assignmentConfirmed=false;
      await commit(c,{skipListRefresh:true});renderMain();
    });
    const saveField=(id,key)=>{
      const el=document.getElementById(id);if(!el)return;
      el.addEventListener('change',async()=>{
        c[key]=el.value.trim();
        if(c.alarmRowOverrides){
          delete c.alarmRowOverrides['■ 차량위치'];
          delete c.alarmRowOverrides['■ 처리기한'];
          delete c.alarmRowOverrides['■ 비고'];
        }
        c.franchise=null;c.franchiseManual=false;c.matchRegion='';c.matchCandidates=[];
        c.travelMinutes='';c.travelKm='';c.franchiseChecked=false;c.assignmentConfirmed=false;
        await commit(c,{skipListRefresh:true});renderMain();

    saveField('intakeShopPhone','intakeShopPhone');
  };

(function(){

    const vehicle=[c.model,c.diamondModel,c.matchedPart&&c.matchedPart.model,c.rawText].filter(Boolean).join(' ').toLowerCase();
    const tesla=/테슬라|tesla/.test(vehicle)||/모델y|modely/.test(vehicle.replace(/\s+/g,''));
    const pos=typeof effectiveGlassPosition==='function'?effectiveGlassPosition(c):(c.glassPosition||'');
    const damage=[c.damage,c.repairCategory,c.partName,c.request].filter(Boolean).join(' ');
    const side=String(pos).startsWith('측면')||/측면|앞문유리|뒷문유리|도어유리/.test(damage);
    return tesla&&side;
  }

})();

(function(){
  const previousOpen=window.openProcessingExcelWindow;
  if(typeof previousOpen!=='function')return;

  window.openProcessingExcelWindow=function(c){
    const result=previousOpen.apply(this,arguments);
    const popup=window.open('','redcapProcessingExcel');
    if(!popup)return result;

    function configureDragCopy(){
      try{
        const doc=popup.document;
        if(!doc||!doc.body)return;

        ['copyValues1','copy1'].forEach(id=>{
          const button=doc.getElementById(id);
          if(button)button.remove();
        });

        const subtitle=doc.querySelector('.top .sub');
        if(subtitle){
          subtitle.textContent='① 필요한 셀을 마우스로 드래그 → ② Ctrl+C → ③ 원본 엑셀에서 Ctrl+V';
          subtitle.style.fontSize='15px';
          subtitle.style.fontWeight='800';
          subtitle.style.color='#174EA6';
        }

        const table=doc.getElementById('tbl');
        if(table){
          table.tabIndex=0;
          table.style.outline='none';
        }

        const status=doc.getElementById('status');
        if(status&&status.textContent.trim()==='선택된 셀이 없습니다.'){
          status.textContent='셀을 드래그해 선택하세요. 선택 후 Ctrl+C를 누르면 복사됩니다.';
        }

        const hint=doc.querySelector('.hint');
        if(hint){
          hint.textContent='※ 드래그로 선택한 범위는 Ctrl+C를 누르면 탭·줄바꿈 형식으로 복사되어 엑셀 셀에 그대로 붙여넣을 수 있습니다. 필요한 범위를 선택한 뒤 원본 엑셀에서 Ctrl+V 하세요.';
        }

        if(!doc.__dragCopyFocusBound){
          doc.__dragCopyFocusBound=true;
          doc.addEventListener('mouseup',function(){
            setTimeout(function(){
              if(!table||!doc.querySelector('td.sel'))return;
              table.focus({preventScroll:true});
              if(status&&!status.textContent.includes('복사 완료')){
                status.textContent='선택 완료 · Ctrl+C를 누른 뒤 엑셀에서 Ctrl+V 하세요.';
              }
            },0);
          });
        }
      }catch(e){console.error('V76 processing Excel drag copy',e);}
    }

    configureDragCopy();
    popup.addEventListener('load',configureDragCopy,{once:true});
    setTimeout(configureDragCopy,80);
    return result;
  };
})();
