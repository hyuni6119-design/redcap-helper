(function(){
  function fixedDamageText(c){
    if(!c)return '파손부위 확인 필요';
    const hasChosenPosition=!!(c.glassPosition||(typeof repairCategoryPosition==='function'&&repairCategoryPosition(c.repairCategory)));
    if(hasChosenPosition&&typeof glassPositionDisplayLabel==='function'){
      const label=glassPositionDisplayLabel(c);
      if(label)return label;
    }
    const raw=String(c.damage||'').trim();
    if(/후면/.test(raw))return '후면유리';
    if(/측면|앞문|뒷문|운전석|조수석/.test(raw))return '측면유리';
    if(/전면/.test(raw))return '전면유리';
    return raw||'파손부위 확인 필요';
  }
  function fixedTintState(c){
    if(c&&c.repairType==='복원')return {text:'복원',cls:'restore'};
    const customer=String(c&&c.customerTintChoice||'').trim();
    const decision=typeof resolvedTintDecision==='function'?resolvedTintDecision(c||{}):String(c&&c.tintDecision||'');
    if(customer==='진행')return {text:'썬팅 O',cls:'tint-on'};
    if(customer==='안함')return {text:'썬팅 X',cls:'tint-off'};
    if(customer==='고민중')return {text:'썬팅 확인 필요',cls:'pending'};
    if(decision==='없음')return {text:'썬팅 X',cls:'tint-off'};
    if(decision&&decision!=='확인필요')return {text:'썬팅 O',cls:'tint-on'};
    return {text:'썬팅 확인 필요',cls:'pending'};
  }

  const previousRender=renderMain;
  renderMain=function(){
    const out=previousRender.apply(this,arguments);
    const c=getActiveCase();
    const title=document.querySelector('.case-title');
    if(!c||!title)return out;

    if(!title.querySelector('.case-summary-second-row')){
      const rowBreak=document.createElement('span');
      rowBreak.className='case-summary-second-row';
      rowBreak.setAttribute('aria-hidden','true');
      title.appendChild(rowBreak);
    }

    if(!title.querySelector('.damage-position-header-badge')){
      const badge=document.createElement('span');
      badge.className='damage-position-header-badge';
      badge.textContent='파손부위 · '+fixedDamageText(c);
      title.appendChild(badge);
    }

    if(!title.querySelector('.tint-state-header-badge')){
      const tint=fixedTintState(c);
      const badge=document.createElement('span');
      badge.className='tint-state-header-badge '+tint.cls;
      badge.textContent=tint.text;
      title.appendChild(badge);
    }

    if(!title.querySelector('.assignment-shop-header-badge')){
      const badge=document.createElement('span');
      badge.className='assignment-shop-header-badge'+(c.franchise?'':' pending');
      if(c.franchise){
        const phone=String(c.franchise.phone||'').trim();
        badge.textContent='배정 · '+String(c.franchise.name||'시공점')+(phone?' · '+phone:'');
        badge.title=[c.franchise.name,c.franchise.owner,c.franchise.phone,c.franchise.address].filter(Boolean).join(' / ');
      }else{
        badge.textContent='배정 시공점 확인 필요';
      }
      title.appendChild(badge);
    }
    return out;
  };
})();



(function(){
  const PHOTO_DB='redcap_case_photos_v1';
  const PHOTO_STORE='casePhotos';
  let dbPromise=null;

  function openPhotoDb(){
    if(dbPromise)return dbPromise;
    dbPromise=new Promise((resolve,reject)=>{
      const req=indexedDB.open(PHOTO_DB,1);
      req.onupgradeneeded=()=>{
        const db=req.result;
        if(!db.objectStoreNames.contains(PHOTO_STORE))db.createObjectStore(PHOTO_STORE);
      };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||new Error('사진 저장공간을 열 수 없습니다.'));
    });
    return dbPromise;
  }
  async function photoStoreGet(caseId){
    const db=await openPhotoDb();
    return new Promise(resolve=>{
      const tx=db.transaction(PHOTO_STORE,'readonly');
      const req=tx.objectStore(PHOTO_STORE).get(caseId);
      req.onsuccess=()=>resolve(Array.isArray(req.result)?req.result:[]);
      req.onerror=()=>resolve([]);
    });
  }
  async function photoStorePut(caseId,photos){
    const db=await openPhotoDb();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(PHOTO_STORE,'readwrite');
      const store=tx.objectStore(PHOTO_STORE);
      const list=Array.isArray(photos)?photos:[];
      if(list.length)store.put(list,caseId);else store.delete(caseId);
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error||new Error('사진을 저장할 수 없습니다.'));
    });
  }
  async function photoStoreDelete(caseId){
    try{await photoStorePut(caseId,[]);}catch(_e){}
  }

  /* v115: 사진 처리 최적화
     - 저장 버튼/상태 변경마다 사진(수 MB)을 매번 다시 쓰지 않고, 사진이 바뀐 경우에만 저장
     - 완료·보관된 건의 사진은 시작할 때 전부 메모리에 올리지 않고, 그 건을 열 때 불러옴
       (건수가 쌓일수록 메모리가 커져 브라우저가 멈추거나 다운되던 원인) */
  const photoLoaded=new Set();
  const photoLoading=new Map();
  const photoSig=new Map();
  function photoListSig(list){list=Array.isArray(list)?list:[];return list.length+':'+list.map(p=>{const v=String(p||'');return v.length+v.slice(-24);}).join('|');}
  function isClosedCase(c){return !!(c&&(c.archiveDone||c.status==='done'||c.manualState==='완료'));}
  async function ensureCasePhotos(c){
    if(!c||photoLoaded.has(c.id))return false;
    if(photoLoading.has(c.id))return photoLoading.get(c.id);
    const loading=(async()=>{
    // A failed read is not an empty photo list: retain data and allow retry.
    const stored=await photoStoreGet(c.id);
    if(photoLoaded.has(c.id))return false;
    const cur=Array.isArray(c.photos)?c.photos:[];
    const merged=stored.concat(cur.filter(p=>!stored.includes(p)));
    c.photos=merged;
    photoLoaded.add(c.id);
    photoSig.set(c.id,photoListSig(stored));
    return merged.length!==cur.length;
    })();
    photoLoading.set(c.id,loading);
    try{return await loading;}finally{photoLoading.delete(c.id);}
  }
  window.__ensureCasePhotos=ensureCasePhotos;

  const previousSaveCase=saveCase;
  saveCase=async function(c){
    await previousSaveCase(c);
    try{
      if(!photoLoaded.has(c.id))await ensureCasePhotos(c);
      const list=Array.isArray(c.photos)?c.photos:[];
      const sig=photoListSig(list);
      if(photoSig.get(c.id)===sig)return;
      await photoStorePut(c.id,list);
      photoSig.set(c.id,sig);
    }catch(e){
      console.error('photo save fail',e);
      if(typeof showToast==='function')showToast('파손사진 저장에 실패했습니다. 브라우저 저장공간을 확인해주세요.');
    }
  };

  const previousLoadCases=loadCases;
  loadCases=async function(){
    const cases=await previousLoadCases();
    cases.forEach(c=>{if(!Array.isArray(c.photos))c.photos=[];});
    // Load only the open case; the render hook loads other cases on demand.
    const active=cases.find(c=>c.id===state.activeId);
    if(active)await ensureCasePhotos(active);
    return cases;
  };

  const previousDeleteCaseStorage=deleteCaseStorage;
  deleteCaseStorage=async function(id){
    await previousDeleteCaseStorage(id);
    await photoStoreDelete(id);
    photoLoaded.delete(id);photoSig.delete(id);
  };

  async function rehydrateCurrentCases(){
    if(!state||!Array.isArray(state.cases))return;
    const active=typeof getActiveCase==='function'?getActiveCase():null;
    const targets=active&&!photoLoaded.has(active.id)?[active]:[];
    if(!targets.length)return;
    const results=await Promise.all(targets.map(c=>ensureCasePhotos(c).catch(()=>false)));
    if(results.some(Boolean)){renderSidebar();renderMain();}
  }

  /* 완료된 건을 열었을 때 그 건의 사진만 불러와서 다시 그림 */
  const previousRenderMainPhoto=renderMain;
  renderMain=function(){
    const out=previousRenderMainPhoto.apply(this,arguments);
    const c=typeof getActiveCase==='function'?getActiveCase():null;
    if(c&&!photoLoaded.has(c.id)){
      ensureCasePhotos(c).then(changed=>{if(changed&&getActiveCase()===c)renderMain();}).catch(()=>{});
    }
    return out;
  };
  setTimeout(rehydrateCurrentCases,120);
  window.addEventListener('pageshow',()=>setTimeout(rehydrateCurrentCases,80));
})();



(function(){
  const STORAGE_KEY='redcap_attention_rail_collapsed_v1';
  function readCollapsed(){
    try{return localStorage.getItem(STORAGE_KEY)==='1';}catch(_e){return false;}
  }
  function installAttentionRailToggle(){
    const rail=document.getElementById('attentionSidebar');
    if(!rail)return;
    let btn=rail.querySelector('.attention-rail-toggle');
    if(!btn){
      btn=document.createElement('button');
      btn.type='button';
      btn.className='attention-rail-toggle';
      btn.addEventListener('click',function(e){
        e.preventDefault();
        e.stopPropagation();
        const next=!document.body.classList.contains('attention-rail-collapsed');
        applyAttentionRailState(next);
        try{localStorage.setItem(STORAGE_KEY,next?'1':'0');}catch(_e){}
      });
      rail.appendChild(btn);
    }
    applyAttentionRailState(readCollapsed());
  }
  function applyAttentionRailState(collapsed){
    document.body.classList.toggle('attention-rail-collapsed',collapsed);
    const btn=document.querySelector('#attentionSidebar .attention-rail-toggle');
    if(!btn)return;
    btn.textContent=collapsed?'미완료건 펼치기':'접기';
    btn.title=collapsed?'미완료건 목록 펼치기':'미완료건 목록 접기';
    btn.setAttribute('aria-label',btn.title);
    btn.setAttribute('aria-expanded',collapsed?'false':'true');
  }
  installAttentionRailToggle();
  const observer=new MutationObserver(function(){
    if(document.getElementById('attentionSidebar')&&!document.querySelector('#attentionSidebar .attention-rail-toggle'))installAttentionRailToggle();
  });
  // The sidebar renders its own list. Watching the whole body caused every
  // step render to run this callback; limit observation to the sidebar itself.
  const rail=document.getElementById('attentionSidebar');
  if(rail)observer.observe(rail,{childList:true,subtree:true});
})();



(function(){
  const REDCAP_DEPOT_DEFAULT_ADDRESS='서울특별시 강남구 논현로 508 GS타워';
  function isRedcapDepotCase(c){return !!(c&&c.redcapDepotCase===true);}
  function formatPhone(v){
    const d=String(v||'').replace(/\D/g,'').slice(0,11);
    if(d.length===11)return d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');
    if(d.length===10)return d.startsWith('02')?d.replace(/(\d{2})(\d{4})(\d{4})/,'$1-$2-$3'):d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3');
    if(d.length>7)return d.replace(/(\d{3})(\d{3,4})(\d{0,4})/,'$1-$2-$3').replace(/-$/,'');
    if(d.length>3)return d.replace(/(\d{3})(\d+)/,'$1-$2');
    return d;
  }
  window.__isRedcapDepotCase=isRedcapDepotCase;

  const TINT_REPRESENTATIVE={
    '기본':'루마 GG 35%',
    '일반':'레이노 S5 35%',
    '중급':'스미스클럽 델타 30%',
    '고급':'스미스클럽 벨라 30%'
  };
  function hasReceivedTintSpec(c){
    const raw=String(c&&c.tintInfo||'').trim();
    if(!raw)return false;
    if(typeof isTintNoneText==='function'&&isTintNoneText(raw))return false;
    if(/^(기본|일반|중급|고급)(\s*썬팅)?$/.test(raw))return false;
    return !/확인\s*필요|미정|미상|모름|없음|썬팅\s*[xX]/.test(raw);
  }
  function receivedTintSpec(c){
    let raw=canonicalTintInfoText(c&&c.tintInfo||'');
    if(!hasReceivedTintSpec(c))return '';
    /* 레드캡 접수명과 시공점 사용명이 다른 대표 품목은 전달용 명칭으로 통일합니다.
       가맹점/협력점 구분 없이 루마 버텍스 300은 스미스클럽 델타로 표기합니다. */
    raw=raw.replace(/(?:루마\s*)?버텍스\s*300/gi,'스미스클럽 델타');
    raw=raw.replace(/스미스클럽\s*델타/gi,'스미스클럽 델타');
    if(/스미스클럽 델타/i.test(raw)&&/(?:루마\s*)?버텍스\s*300/i.test(c.tintInfo||''))return '스미스클럽 델타 30%';
    if(/\d{1,3}\s*%/.test(raw))return canonicalTintInfoText(raw);
    const grade=typeof guessTintGrade==='function'?guessTintGrade(raw):'';
    const density=(grade==='중급'||grade==='고급')?30:35;
    return canonicalTintInfoText(`${raw} ${density}%`);
  }

  /* 고급 등급은 시공점 전달 문구와 알림톡 모두 스미스클럽 벨라 30%로 통일합니다. */
  const previousTintDelivery=window.__tintDeliverySpec;
  window.__tintDeliverySpec=function(c){
    const shop=c&&(c.franchise||nearestFranchise(c.region));
    const isPartner=!!(shop&&shop.type==='협력점');
    const rawReceived=receivedTintSpec(c);
    if(isPartner){
      let base='';
      if(c&&c.tintPosition==='후면')base='루마GG 15%';
      else if(c&&c.tintPosition==='측면'&&!c.tintDeliveryOverride)base='루마GG 15%';
      else if(hasReceivedTintSpec(c)){
        base=rawReceived.replace(/\s+/g,' ').trim();
        if(!/\d{1,3}\s*%/.test(base)){
          const receivedGrade=typeof guessTintGrade==='function'?guessTintGrade(base):'';
          base+=` ${(receivedGrade==='중급'||receivedGrade==='고급')?30:35}%`;
        }
      }else{
        const partnerGrade=typeof effectiveTintGrade==='function'?effectiveTintGrade(c||{}):String(c&&c.tintGrade||'');
        base=TINT_REPRESENTATIVE[partnerGrade]||'고객 기존 썬팅 사양 확인 필요';
      }
      return `기존 ${base} 또는 해당 필름지와 비슷한 등급의 썬팅필름 시공 요청드립니다`;
    }
    if(c&&c.tintPosition==='후면')return '루마GG 15%';
    if(c&&c.tintPosition==='측면')return String(c.tintDeliveryOverride||'').trim()||'루마GG 15%';
    const grade=typeof effectiveTintGrade==='function'?effectiveTintGrade(c||{}):String(c&&c.tintGrade||'');
    /* 사용자가 등급 버튼으로 변경한 경우에는 그 선택이 최초 접수 사양보다 우선입니다. */
    if(c&&c.tintSpecMode==='different'&&TINT_REPRESENTATIVE[grade])return TINT_REPRESENTATIVE[grade];
    const received=receivedTintSpec(c);
    if(received)return received;
    if(TINT_REPRESENTATIVE[grade])return TINT_REPRESENTATIVE[grade];
    const previous=typeof previousTintDelivery==='function'?previousTintDelivery(c):'';
    /* 협력점 전용 문구가 수동값에 남아 있어도 가맹점 알림톡에는 절대 노출하지 않습니다. */
    if(/비슷한\s*등급|썬팅작업\s*부탁|썬팅필름\s*시공\s*요청|\bor\b/i.test(previous||''))return '';
    return previous;
  };

  /* 대표님 확인 문구는 협력점 알림톡 문구와 분리하여 제품 사양만 간단히 표시합니다. */
  function assignmentTintSpec(c){
    if(!c)return '';
    if(c.tintPosition==='후면')return '루마GG 15%';
    if(c.tintPosition==='측면')return String(c.tintDeliveryOverride||'').trim()||'루마GG 15%';
    const grade=typeof effectiveTintGrade==='function'?effectiveTintGrade(c):String(c.tintGrade||'');
    /* 고객 통화에서 다른 등급을 직접 선택한 경우에는 변경된 대표 제품을 표시합니다. */
    if(c.tintSpecMode==='different'&&TINT_REPRESENTATIVE[grade])return TINT_REPRESENTATIVE[grade];
    const manual=String(c.tintDeliveryOverride||'').trim();
    if(manual&&!/비슷한\s*등급|썬팅작업\s*부탁|썬팅필름\s*시공\s*요청|\bor\b/i.test(manual))return manual;
    let raw=String(c.tintInfo||'').replace(/\s+/g,' ').trim();
    if(hasReceivedTintSpec(c)){
      const density=(raw.match(/(\d{1,3})\s*%/)||[])[1]||((typeof guessTintGrade==='function'&&['중급','고급'].includes(guessTintGrade(raw)))?'30':'35');
      if(/(?:루마\s*)?버텍스\s*300/i.test(raw)){
        return '스미스클럽 델타 30%';
      }
      if(!/\d{1,3}\s*%/.test(raw))raw+=` ${density}%`;
      return raw;
    }
    return TINT_REPRESENTATIVE[grade]||'';
  }
  const previousAssignmentReport=assignmentReportText;
  assignmentReportText=function(c){
    let text=previousAssignmentReport(c);
    const priceInquiry=c&&c.repairType==='교체'&&c.replacementPriceInquiry;
    if(priceInquiry){
      const p=c.matchedPart||{};
      const vehicle=[c.diamondModel,p.model,c.model].map(v=>String(v||'').trim()).find(v=>v&&v!==String(c.partName||'').trim()&&!/^(?:앞문|뒷문|전면|후면|측면)유리/.test(v))||'차종 확인필요';
      const part=String(c.partNoInput||p.partNo||'').replace(/[^a-z0-9]/gi,'').toUpperCase()||'-';
      const lines=text.split('\n');
      lines[0]=`${vehicle}  ${c.partName||'-'}\t${part}  ${c.partPrice?fmtNum(c.partPrice):'문의'}`;
      text=lines.join('\n');
    }
    if(priceInquiry)text=text.split('\n').map(line=>line.startsWith('유리교체시_')?line.replace(/^유리교체시_[^\s]+\s*/,(/측면/.test(effectiveGlassPosition(c))?'측면유리교체':effectiveGlassPosition(c)==='후면'?'후면유리교체':'전면유리교체')+'단가 확인필요'+(line.includes('썬팅')?' / ':'')):line).join('\n');
    const noTint=c&&(c.customerTintChoice==='안함'||(typeof resolvedTintDecision==='function'&&resolvedTintDecision(c)==='없음'));
    if(noTint){
      return text.split('\n').map(line=>c.repairType==='교체'&&(line.startsWith('유리교체시_')||line.includes('유리교체단가 확인필요'))?line.split(/\s*\/\s*썬팅|\s+썬팅/)[0].trimEnd()+' / 썬팅 미진행':line).join('\n');
    }
    const spec=assignmentTintSpec(c);
    if(spec){
      // 기존 접수 썬팅지와 대표님이 지정한 전달 사양이 다르면 대체 사양임을 명확히 표시합니다.
      const original=String(c.tintInfo||'').replace(/\s+/g,' ').trim();
      const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9가-힣]/g,'');
      const replacement=original&&norm(original)!==norm(spec)?' 대체':'';
      const displaySpec=`${spec}${replacement}`;
      text=text.split('\n').map(line=>line.includes('썬팅')?line.replace(/\s*\([^)]*\)\s*$/,'').trimEnd()+`${priceInquiry?'':' '}(${displaySpec})`:line).join('\n');
    }
    return text;
  };

  /* 레드캡 건물 입고 건은 거리·시공점 추천도 실제 입고지 주소를 기준으로 합니다. */
  const previousAssignmentTarget=assignmentTargetAddress;
  assignmentTargetAddress=function(c){
    if(isRedcapDepotCase(c))return String(c.redcapDepotAddress||REDCAP_DEPOT_DEFAULT_ADDRESS).trim();
    return previousAssignmentTarget(c);
  };

  const previousStepAssignment=stepAssignment;
  stepAssignment=function(c){
    let html=previousStepAssignment(c);
    const rules=window.__TINT_RULES_V13||{};
    const catalog=`<div class="assignment-tint-catalog"><div class="assignment-tint-catalog-title">썬팅 단가표 사양 · 제품 목록</div>${['기본','일반','중급','고급'].map(grade=>{
      const products=(rules[grade]&&rules[grade].products)||[];
      const rep=TINT_REPRESENTATIVE[grade];
      return `<div class="assignment-tint-catalog-row"><div class="grade">${grade}</div><div class="products"><span class="representative">대표 적용: ${escapeHtml(rep)}</span>${products.length?`<br>단가표 제품: ${escapeHtml(products.join(' · '))}`:''}</div></div>`;
    }).join('')}</div>`;
    const tintHeading='<h3 class="section-title">② 썬팅 사양 · 금액 확인</h3>';
    if(html.includes(tintHeading))html=html.replace(tintHeading,tintHeading+catalog);
    const active=isRedcapDepotCase(c);
    const panel=`<div class="redcap-depot-box">
      <label class="redcap-depot-toggle"><input type="checkbox" id="redcapDepotCase" ${active?'checked':''}> 레드캡 건물 입고 차량</label>
      <div class="redcap-depot-note">차량이 고객 위치가 아닌 레드캡 입고지에 있으면 체크하세요. 알림톡의 차량위치·처리기한·비고가 담당자 기준으로 자동 변경됩니다.</div>
      ${active?`<div class="redcap-depot-fields">
        <div><label class="field-label">레드캡 입고지 주소</label><input class="field" id="redcapDepotAddress" value="${escapeHtml(c.redcapDepotAddress||REDCAP_DEPOT_DEFAULT_ADDRESS)}" placeholder="서울특별시 강남구 논현로 508 GS타워"></div>
        <div><label class="field-label">전달받은 담당자 연락처</label><input class="field" id="redcapDepotPhone" value="${escapeHtml(formatPhone(c.redcapDepotPhone||''))}" placeholder="예: 010-2752-5104" inputmode="tel"></div>
      </div><div class="redcap-depot-preview">알림톡 자동 반영 · 처리기한: <b>담당자통화 일정조율</b> · 비고: <b>담당자 / ${escapeHtml(formatPhone(c.redcapDepotPhone||'')||'연락처 입력 필요')}</b></div>`:''}
    </div>`;
    const anchor='<h3 class="section-title">③ 시공점 배정 확인</h3>';
    return html.includes(anchor)?html.replace(anchor,panel+anchor):panel+html;
  };

  const previousAlarmRows=alarmRows;
  alarmRows=function(c){
    const rows=previousAlarmRows(c);
    if(!isRedcapDepotCase(c))return rows;
    const auto={
      '■ 차량위치':String(c.redcapDepotAddress||REDCAP_DEPOT_DEFAULT_ADDRESS).trim(),
      '■ 처리기한':'담당자통화 일정조율',
      '■ 비고':'담당자 / '+(formatPhone(c.redcapDepotPhone||'')||'연락처 확인 필요')
    };
    const overrides=c&&c.alarmRowOverrides||{};
    return rows.map(([key,value])=>[key,Object.prototype.hasOwnProperty.call(auto,key)&&!Object.prototype.hasOwnProperty.call(overrides,key)?auto[key]:value]);
  };

  const previousWireStep=wireStep;
  wireStep=function(step,c){
    previousWireStep(step,c);
    if(step!=='assignment')return;
    const toggle=document.getElementById('redcapDepotCase');
    if(toggle)toggle.addEventListener('change',async()=>{
      c.redcapDepotCase=toggle.checked;
      if(toggle.checked&&!String(c.redcapDepotAddress||'').trim())c.redcapDepotAddress=REDCAP_DEPOT_DEFAULT_ADDRESS;
      if(!toggle.checked){c.redcapDepotAddress='';c.redcapDepotPhone='';}
      c.franchise=null;c.franchiseManual=false;c.matchRegion='';c.matchCandidates=[];c.franchiseChecked=false;
      resetAssignmentConfirmed(c);
      await commit(c);renderMain();
    });
    const saveField=(id,key,resetMatch)=>{const el=document.getElementById(id);if(!el)return;el.addEventListener('change',async()=>{
      c[key]=el.value.trim();
      if(resetMatch){c.franchise=null;c.franchiseManual=false;c.matchRegion='';c.matchCandidates=[];c.franchiseChecked=false;}
      resetAssignmentConfirmed(c);await commit(c);renderMain();
    });};
    saveField('redcapDepotAddress','redcapDepotAddress',true);
    const phone=document.getElementById('redcapDepotPhone');
    if(phone){
      phone.addEventListener('input',()=>{phone.value=formatPhone(phone.value);});
      phone.addEventListener('change',async()=>{c.redcapDepotPhone=formatPhone(phone.value);resetAssignmentConfirmed(c);await commit(c);renderMain();});
    }
  };

})();



(function(){
  const previousRepCallScript=repCallScript;
  function partnerExistingTintSpec(c){
    if(c&&c.tintPosition==='후면')return '루마GG 15%';
    const raw=String(c&&c.tintInfo||'').trim();
    const unusable=!raw||/옵션\s*없음|확인\s*필요|미정|미상|모름|없음|썬팅\s*[xX]/i.test(raw);
    if(!unusable){
      if(/\d{1,3}\s*%/.test(raw))return raw.replace(/\s+/g,' ').trim();
      const grade=typeof guessTintGrade==='function'?guessTintGrade(raw):'';
      return `${raw.replace(/\s+/g,' ').trim()} ${(grade==='중급'||grade==='고급')?30:35}%`;
    }
    const grade=typeof effectiveTintGrade==='function'?effectiveTintGrade(c||{}):String(c&&c.tintGrade||'');
    const defaults={'기본':'루마GG 35%','일반':'레이노 S5 35%','중급':'스미스클럽 델타 30%','고급':'스미스클럽 벨라 30%'};
    return defaults[grade]||'고객 기존 사양 확인 필요';
  }
  repCallScript=function(c){
    const shop=c&&(c.franchise||nearestFranchise(c.region));
    const isPartner=!!(shop&&shop.type==='협력점');
    const tintConfirmed=c&&c.repairType==='교체'&&c.customerTintChoice==='진행';
    if(!isPartner||!tintConfirmed)return previousRepCallScript(c);
    const existing=partnerExistingTintSpec(c);
    return `대표님 안녕하세요\n알림톡으로 레드캡 유리교체건 발송해드렸습니다.\n기존 고객님 썬팅지는 (${existing})로 되어 있는데, 비슷한 등급의 썬팅지는 어떤 제품으로 진행되는 걸까요?\n\n고객님 통화 후 일정 나오면 공유 부탁드리겠습니다.`;
  };
})();



(function(){
  function isPartnerTintCase(c){
    const shop=c&&(c.franchise||nearestFranchise(c.region));
    return !!(shop&&shop.type==='협력점'&&c.repairType==='교체'&&c.customerTintChoice==='진행');
  }
  function pendingTintSpec(c){
    if(c.tintPosition==='후면')return '루마GG 15%';
    const manual=String(c.tintDeliveryOverride||'').trim();
    if(manual&&!/비슷한\s*등급|썬팅작업\s*부탁|썬팅필름\s*시공\s*요청|\bor\b/i.test(manual))return manual;
    let raw=String(c.tintInfo||'').replace(/\s+/g,' ').trim();
    if(raw&&!/옵션\s*없음|확인\s*필요|미정|미상|모름|없음|썬팅\s*[xX]/i.test(raw)){
      if(!/\d{1,3}\s*%/.test(raw)){
        const grade=typeof guessTintGrade==='function'?guessTintGrade(raw):'';
        raw+=` ${(grade==='중급'||grade==='고급')?30:35}%`;
      }
      return raw;
    }
    const grade=typeof effectiveTintGrade==='function'?effectiveTintGrade(c||{}):String(c.tintGrade||'');
    return {'기본':'루마GG 35%','일반':'레이노 S5 35%','중급':'스미스클럽 델타 30%','고급':'스미스클럽 벨라 30%'}[grade]||'썬팅 사양 확인 필요';
  }

  const previousMemoText=memoText;
  memoText=function(c){
    if(!isPartnerTintCase(c))return previousMemoText(c);
    const part=c.partNoInput||(c.matchedPart&&c.matchedPart.partNo)||'';
    const finalSpec=String(c.actualTintProduct||'').trim();
    const density=String(c.actualTintDensity||'').replace(/[^0-9]/g,'');
    const spec=finalSpec+(finalSpec&&density&&!new RegExp(`${density}\\s*%`).test(finalSpec)?` ${density}%`:'');
    const shown=spec||pendingTintSpec(c);
    return `${part?part+' / ':''}${shown}${/[.]$/.test(shown)?'':'.'}`;
  };
  window.memoText=memoText;

  const previousStepWrapup=stepWrapup;
  stepWrapup=function(c){
    let html=previousStepWrapup(c);
    if(!isPartnerTintCase(c))return html;
    const quick=`<div class="partner-final-tint-quick"><label class="field-label" for="partnerFinalTintQuick">협력점 답변 · 최종 진행 썬팅지</label><input class="field" id="partnerFinalTintQuick" value="${escapeHtml(c.actualTintProduct||'')}" placeholder="예: 레이노 S5 35%"><div class="hint">협력점에서 답변받은 제품명과 농도를 입력하면 엑셀 비고란에 이 값이 우선 반영됩니다.</div></div>`;
    const re=/(<div class="copy-block edit-block[^>]*><textarea class="editable-text" data-textkey="rep_call"[\s\S]*?<\/textarea><button[^>]*>[\s\S]*?<\/button><\/div>)/;
    return re.test(html)?html.replace(re,'$1'+quick):html+quick;
  };

  const previousWireStep=wireStep;
  wireStep=function(step,c){
    previousWireStep(step,c);
    if(step!=='wrapup')return;
    const input=document.getElementById('partnerFinalTintQuick');
    if(input)input.addEventListener('change',async()=>{
      c.actualTintProduct=input.value.trim();
      c.actualTintDensity='';
      c.actualTintConfirmed=false;
      c.partnerTintReported=false;
      await commit(c,{skipListRefresh:true});
      renderMain();
    });
  };
})();



(function(){
  const LABELS='차량번호|차종|차대번호|고객사|고객정보|고객지역|파손부위|썬팅여부|썬팅|요청사항|요청';
  function labeledValue(raw,label){
    for(const line of String(raw||'').split(/\\r?\\n/)){
      const m=line.trim().match(new RegExp(`^(?:[ㅇoO0]\\s*)?(${LABELS})\\s*[:：]\\s*(.*)$`,'i'));
      if(m&&m[1].replace(/\\s+/g,'').includes(label))return m[2].trim();
    }
    return '';
  }
  function explicitPosition(text){
    const t=String(text||'').replace(/\s+/g,' ');
    /* '조수석 앞 창문'은 고객이 앞유리를 뜻할 수도, 조수석 앞문 유리를 뜻할 수도 있어 자동 확정하지 않습니다. */
    if(/조수석|운전석/.test(t)&&/(?:앞|전)?\s*(?:창문|창유리)/.test(t)&&!/문유리|도어유리|도어|문짝/.test(t))return '확인필요';
    if(/조수석|운전석/.test(t)&&/(?:앞|뒤|전|후)?\s*(?:문유리|도어유리|도어|문짝)/.test(t))return '측면';
    if(/측면|사이드|옆유리|옆문|앞문유리|뒷문유리|프론트도어|리어도어|도어유리/.test(t))return '측면';
    if(/후면|뒷유리|리어글라스|리어윈도우|백글라스|뒷창/.test(t))return '후면';
    if(/파노라마|썬루프|선루프/.test(t))return '파노라마';
    if(/고정창/.test(t))return '고정창';
    if(/전면|앞유리|프론트글라스|윈드쉴드|윈드실드/.test(t))return '전면';
    return '';
  }
  function requestPosition(text){return explicitPosition(text);}
  function syncExplicitDamage(c){
    if(!c||!c.rawText)return;
    const damage=labeledValue(c.rawText,'파손부위');
    if(!damage)return;
    const request=labeledValue(c.rawText,'요청')||String(c.request||'');
    const pos=explicitPosition(damage),reqPos=requestPosition(request);
    const sig=[damage,request,pos,reqPos].join('|');
    if(c.damageSourceSignature===sig)return;
    c.damageSourceSignature=sig;c.damage=damage;
    if(pos==='측면'){
      c.sideDoor=/뒤|후|뒷/.test(damage)?'뒷문':'앞문';
      c.glassPosition='측면강화';c.tintPosition='측면';
      if(!c.repairCategoryManual)c.repairCategory=(c.tintInfo&&!isTintNoneText(c.tintInfo))?'측면유리교체 및 썬팅':'측면유리교체';
    }else if(pos==='후면'){
      c.glassPosition='후면';c.tintPosition='후면';
      if(!c.repairCategoryManual)c.repairCategory=(c.tintInfo&&!isTintNoneText(c.tintInfo))?'후면유리교체 및 썬팅':'후면유리교체';
    }else if(pos==='전면'){
      c.glassPosition='전면';c.tintPosition='전면';
      if(!c.repairCategoryManual)c.repairCategory=(c.tintInfo&&!isTintNoneText(c.tintInfo))?'전면유리교체 및 썬팅':'전면유리교체';
    }else if(pos==='확인필요'){
      c.glassPosition='';c.tintPosition='';if(!c.repairCategoryManual)c.repairCategory='';c.sideDoor='';
    }
    if(pos&&reqPos&&pos!==reqPos){
      c.damageConflict={damage,request,damagePosition:pos,requestPosition:reqPos};
      c.damageConflictConfirmed=false;
      c.assignmentConfirmed=false;c.glassPriceChecked=false;c.tintSpecChecked=false;c.tintPriceChecked=false;
    }else{c.damageConflict=null;c.damageConflictConfirmed=true;}
  }

  const previousParseRawText=parseRawText;
  parseRawText=function(raw){
    const parsed=previousParseRawText(raw);
    const plate=labeledValue(raw,'차량번호'),model=labeledValue(raw,'차종'),vin=labeledValue(raw,'차대번호');
    const client=labeledValue(raw,'고객사'),customer=labeledValue(raw,'고객정보'),region=labeledValue(raw,'고객지역');
    const damage=labeledValue(raw,'파손부위');
    const request=labeledValue(raw,'요청');
    const tint=labeledValue(raw,'썬팅');
    if(plate)parsed.plate=plate;if(model)parsed.model=model;if(vin)parsed.vin=vin;if(client)parsed.client=client;if(region)parsed.region=region;
    if(customer){
      const phone=(customer.match(/01[0-9][\s-]?\d{3,4}[\s-]?\d{4}/)||[])[0]||'';
      parsed.customerPhone=phone;
      parsed.customerName=customer.replace(phone,'').replace(/고객/g,'').replace(/[\/,]/g,' ').replace(/\s+/g,' ').trim();
    }
    if(damage)parsed.damage=damage;if(request)parsed.request=request;parsed.tintInfo=tint?canonicalTintInfoText(tint):'';
    const temp={...parsed,rawText:raw};syncExplicitDamage(temp);
    return {...parsed,damage:temp.damage,request:temp.request,tintInfo:temp.tintInfo,repairCategory:temp.repairCategory,glassPosition:temp.glassPosition,tintPosition:temp.tintPosition,sideDoor:temp.sideDoor,damageConflict:temp.damageConflict,damageConflictConfirmed:temp.damageConflictConfirmed,damageSourceSignature:temp.damageSourceSignature};
  };

  const previousStepIntake=stepIntake;
  stepIntake=function(c){
    syncExplicitDamage(c);
    let html=previousStepIntake(c);
    if(!c.damageConflict)return html;
    const damageLabel=c.damageConflict.damagePosition==='측면'?'측면유리':c.damageConflict.damagePosition==='확인필요'?'전면/측면 확인 필요':c.damageConflict.damagePosition+'유리';
    const requestLabel=c.damageConflict.requestPosition==='전면'?'전면유리':c.damageConflict.requestPosition==='측면'?'측면유리':c.damageConflict.requestPosition+'유리';
    const box=`<div class="damage-source-conflict"><strong>⚠ 파손부위와 요청사항이 서로 다릅니다</strong>‘조수석 앞 창문’처럼 애매한 표현은 전면이나 측면으로 자동 확정하지 않습니다. 실제 파손 부위를 확인하기 전에는 다음 단계로 진행할 수 없습니다.<div class="compare"><div><b>파손부위 항목</b><br>${escapeHtml(c.damageConflict.damage)} → <b>${escapeHtml(damageLabel)}</b></div><div><b>요청사항</b><br>${escapeHtml(c.damageConflict.request||'-')} → <b>${escapeHtml(requestLabel)}</b></div></div><label><input type="checkbox" id="damageConflictConfirmed" ${c.damageConflictConfirmed?'checked':''}> 고객 또는 접수 담당자에게 실제 파손부위 확인 완료</label></div>`;
    return box+html;
  };

  const previousCanNavigate=canNavigateStep;
  canNavigateStep=function(c,targetKey){
    syncExplicitDamage(c);
    const targetIdx=STEP_DEFS.findIndex(x=>x.key===targetKey);
    if(targetIdx>0&&c.damageConflict&&!c.damageConflictConfirmed)return {ok:false,msg:`파손부위가 서로 다릅니다. 접수 확인에서 '${c.damageConflict.damage}' 기준 진행을 먼저 확인해주세요.`};
    return previousCanNavigate(c,targetKey);
  };

  const previousWireStep=wireStep;
  wireStep=function(step,c){
    previousWireStep(step,c);
    if(step==='intake'){
      const check=document.getElementById('damageConflictConfirmed');
      if(check)check.addEventListener('change',async()=>{
        c.damageConflictConfirmed=check.checked;
        await commit(c,{skipListRefresh:true});
        const box=check.closest('.damage-source-conflict');
        if(box)box.classList.toggle('confirmed',check.checked);
        const footer=document.querySelector('.footer-nav');
        if(footer){footer.innerHTML=footerNav(c);wireFooterNav(c);}
        if(window.updateAttentionSidebar)window.updateAttentionSidebar();
      });
    }
  };

  const previousRenderMain=renderMain;
renderMain=function(){const c=getActiveCase();if(c){sanitizeAutoFranchise(c);syncExplicitDamage(c);}return previousRenderMain.apply(this,arguments);};
})();

/* ===== intake fast path: 자동추출은 전체 앱 대신 접수 본문과 헤더만 갱신 ===== */
(function(){
  function refreshIntakeHeaderLite(c){
    const plate=document.getElementById('plateBadgeText');
    if(plate)plate.innerHTML=`${escapeHtml(c.plate)||'차량번호 미입력'}${c.plate?`<button class="plate-copy-btn" id="plateCopyBtn" title="차량번호 복사">복사</button>`:''}`;
    const model=document.querySelector('.case-title .model-text');
    if(model)model.textContent=c.diamondModel||(c.matchedPart&&c.matchedPart.model)||c.model||'차종 미입력';
    const phone=document.querySelector('.case-title .customer-phone-badge');
    if(phone)phone.textContent=c.customerPhone||'고객번호 미입력';
    const values=document.querySelectorAll('.case-header .case-info-grid .case-info-item .val');
    if(values[0])values[0].textContent=c.repairType==='복원'?'🔧 복원':c.repairType==='교체'?'🪟 교체':'판정 전';
    if(values[1])values[1].textContent=c.client||'미입력';
    if(values[2])values[2].textContent=customerDisplayName(c.customerName)||'미입력';
    const damage=document.querySelector('.damage-position-header-badge');
    if(damage){let label='파손부위 확인 필요';try{label=glassPositionDisplayLabel(c)||c.damage||label;}catch(_e){label=c.damage||label;}damage.textContent='파손부위 · '+label;}
    const tint=document.querySelector('.tint-state-header-badge');
    if(tint){const off=c.repairType==='복원'||c.tintDecision==='없음'||c.customerTintChoice==='안함'||/없음|미진행|안함/.test(c.tintInfo||'');tint.textContent=c.repairType==='복원'?'복원':off?'썬팅 X':'썬팅 O';tint.className='tint-state-header-badge '+(c.repairType==='복원'?'restore':off?'tint-off':'tint-on');}
    const copy=document.getElementById('plateCopyBtn');
    if(copy)copy.onclick=e=>{e.stopPropagation();copyText(c.plate||'','차량번호');};
  }

  const previousWireStep=wireStep;
  wireStep=function(step,c){
    previousWireStep(step,c);
    if(step!=='intake')return;
    const parse=document.getElementById('parseBtn');
    if(!parse)return;
    parse.onclick=async()=>{
      const raw=document.getElementById('rawText')?.value||'';
      c.rawText=raw;
      const parsed=parseRawText(raw);
      if(c.repairCategoryManual&&c.repairCategory){delete parsed.repairCategory;delete parsed.repairType;}
      const oldRegion=c.region,oldTint=c.tintInfo;
      Object.assign(c,parsed);
      if(parsed.tintInfo==='' && !/썬팅/.test(c.repairCategory||'') && !c.customerCallStatus){
        c.customerTintChoice='안함';c.tintDecision='없음';c.tintGrade='';c.tintSpecMode='';
      }
      if(parsed.region!==undefined&&c.region!==oldRegion){c.franchise=null;c.franchiseManual=false;c.matchRegion='';c.matchCandidates=[];c.travelMinutes='';c.travelKm='';c.franchiseChecked=false;resetAssignmentConfirmed(c);}
      if(parsed.tintInfo!==undefined&&c.tintInfo!==oldTint){c.tintDecision='';c.tintGrade='';c.manualTintVat='';c.tintSpecChecked=false;c.tintPriceChecked=false;resetAssignmentConfirmed(c);}
      await commit(c,{skipListRefresh:true});
      renderStepBody(c);
      const footer=document.querySelector('.footer-nav');
      if(footer){footer.innerHTML=footerNav(c);wireFooterNav(c);}
      refreshIntakeHeaderLite(c);
      if(window.updateAttentionSidebar)window.updateAttentionSidebar();
      showToast('접수 내용 자동 인식 완료');
    };
  };
})();

try{render();}catch(e){console.error('optimized final render',e);}

</script>

<script src="workflow-history.js?v=205"></script>
<script src="workflow-history-seed.js"></script>
<script src="workflow-history-seed-2025.js?v=145"></script>
<script src="workflow-sheet-view.js?v=159"></script>
<script src="workflow-history-ui.js?v=210"></script>
<script src="workflow-alarm-tint.js?v=146"></script>
<script src="workflow-reconfirm.js?v=176"></script>
<script src="workflow-performance.js"></script>
<script src="workflow-shop-rules.js?v=209"></script>
<script>
/* 고객 통화 중 썬팅 결제 문의와 시공점 전달 내용을 같은 건에 보관합니다. */
(function(){
  const oldCall=stepCall;
  stepCall=function(c){
    let html=oldCall(c);
    if(c.repairType!=='교체')return html;
    const tintStart=html.indexOf('id="tintDetailsBlock"');
    if(tintStart<0)return html;
    const tintEnd=html.indexOf('</details>',tintStart);
    if(tintEnd<0)return html;
    const info=`<div class="customer-payment-guide">
      <div class="customer-payment-title">유리교체 소요시간 · 썬팅비 안내</div>
      <div>현장 유리교체 약 <b>2~3시간</b> · 시공점 입고 교체 약 <b>3~5시간</b> (이동시간 포함, 일정은 시공점 확인)</div>
      <div>썬팅비는 시공 후 레드캡 측에서 면책금과 함께 청구할 수 있습니다. 썬팅비만 시공점에 별도 계좌이체하는 방법도 있습니다. 시공점 현장 카드결제는 단말기 사정상 어려울 수 있습니다.</div>
      <div class="customer-payment-qa"><b>“썬팅비는 누가 내나요?”</b><br>계약된 곳으로 청구되는 부분이라 레드캡이나 고객님 회사 측에 확인해보셔야 정확합니다.</div>
      <button type="button" class="btn btn-ghost" id="tintCardInquiryBtn" aria-expanded="${!!c.tintCardInquiryOpen}" aria-controls="tintCardInquiryPanel">카드결제 문의 ${c.tintCardInquiryOpen?'접기':'보기'}</button>
      <div id="tintCardInquiryPanel" ${c.tintCardInquiryOpen?'':'hidden'}>
        <div class="customer-payment-qa"><b>“썬팅비 카드결제가 되나요?”</b><br>가맹점·협력점 모두 본사에서 카드결제 가능합니다. 실물카드 결제는 어려워 카드번호를 받아 본사에서 결제해드리고, 영수증은 사진으로 보내드릴 수 있습니다. 괜찮으실까요?</div>
        <div class="customer-payment-choice"><div class="customer-payment-choice-title">고객 답변</div>
          <label><input type="radio" name="tintCardReceiptChoice" value="photo" ${c.tintCardReceiptChoice==='photo'?'checked':''}> 사진 영수증 동의</label>
          <label><input type="radio" name="tintCardReceiptChoice" value="paper" ${c.tintCardReceiptChoice==='paper'?'checked':''}> 실물 영수증 요청</label>
        </div>
        ${c.tintCardReceiptChoice==='photo'?`<div class="customer-payment-qa"><b>고객에게 안내</b><br>결제하실 카드 사진 찍어서 지금 전화드린 이 번호로 남겨놔 주시면 결제 후 영수증 문자로 남겨드리겠습니다.</div>`:''}
        ${c.tintCardReceiptChoice==='paper'?`<div class="customer-payment-qa"><b>고객에게 안내</b><br>시공점에 내용 전달해드리겠습니다.<br><b>후속 조치</b><br>시공점 전달의 대표님 통화 및 알림톡 비고에 카드결제·실물 영수증 요청이 표시됩니다.</div>`:''}
      </div>
    </div>`;
    return html.slice(0,tintEnd+10)+info+html.slice(tintEnd+10);
  };
  const oldRep=repCallScript;
  repCallScript=function(c){
    const text=oldRep(c);
    return c.customerTintChoice==='진행'&&c.tintCardReceiptChoice==='paper'?text+'\n\n썬팅비는 카드결제로 진행하실 예정인데 실물 영수증이 필요하다고 하셔서, 이 부분도 함께 확인해서 진행 부탁드립니다.':text;
  };
  const oldAlarm=alarmRows;
  alarmRows=function(c){
    const rows=oldAlarm(c);
    if(c.customerTintChoice!=='진행'||c.tintCardReceiptChoice!=='paper')return rows;
    return rows.map(([key,value])=>key.replace(/^■\s*/,'').trim()==='비고'?[key,String(value||'')+' / 썬팅비 카드결제 요청 · 실물 영수증 필요']:[key,value]);
  };
  const oldWire=wireStep;
  wireStep=function(step,c){
    oldWire(step,c);
    if(step!=='call')return;
    document.getElementById('tintCardInquiryBtn')?.addEventListener('click',()=>{
      c.tintCardInquiryOpen=!c.tintCardInquiryOpen;
      const panel=document.getElementById('tintCardInquiryPanel');
      const button=document.getElementById('tintCardInquiryBtn');
      if(panel)panel.hidden=!c.tintCardInquiryOpen;
      if(button){button.setAttribute('aria-expanded',String(!!c.tintCardInquiryOpen));button.textContent='카드결제 문의 '+(c.tintCardInquiryOpen?'접기':'보기');}
    });
    document.querySelectorAll('input[name="tintCardReceiptChoice"]').forEach(input=>input.addEventListener('change',async()=>{
      c.tintCardReceiptChoice=input.value;
      c.tintCardInquiryOpen=true;
      await commit(c,{skipListRefresh:true});renderMain();
    }));
  };
})();
</script>
<script>
/* 최종 인라인 이벤트 이후에도 썬팅여부를 보존하는 최종 보정 */
(function(){
  if(typeof parseRawText==='function'&&!parseRawText.__tintForced){
    const oldParseRawText=parseRawText;
    const forcedParseRawText=function(raw){
      const parsed=oldParseRawText(raw)||{};
      const m=String(raw||'').match(/(?:^|\n)\s*[ㅇoO0]?\s*썬팅(?:여부)?\s*[:：]\s*([^\n]*)/i);
      if(m&&m[1].trim())parsed.tintInfo=typeof canonicalTintInfoText==='function'?canonicalTintInfoText(m[1].trim()):m[1].trim();
      return parsed;
    };
    forcedParseRawText.__tintForced=true;
    parseRawText=forcedParseRawText;
  }
  document.addEventListener('click',function(e){
    const btn=e.target&&e.target.closest?e.target.closest('#parseBtn'):null;
    if(!btn)return;
    const raw=document.getElementById('rawText')?.value||'';
    const m=raw.match(/(?:^|\n)\s*[ㅇoO0]?\s*썬팅(?:여부)?\s*[:：]\s*([^\n]*)/i);
    if(!m||!m[1].trim())return;
    setTimeout(async function(){
      const c=typeof getActiveCase==='function'?getActiveCase():null;
      if(!c)return;
      const tint=typeof canonicalTintInfoText==='function'?canonicalTintInfoText(m[1].trim()):m[1].trim();
      if(c.tintInfo===tint)return;
      c.tintInfo=tint;
      await commit(c,{skipListRefresh:true});
      renderMain();
      if(typeof showToast==='function')showToast('썬팅여부를 원문에서 반영했습니다.');
    },1000);
    setTimeout(function(){
      const field=document.querySelector('[data-field="tintInfo"]');
      if(!field||field.value.trim())return;
      field.value=m[1].trim();
      field.dispatchEvent(new Event('input',{bubbles:true}));
      field.dispatchEvent(new Event('change',{bubbles:true}));
    },1400);
  },true);
})();
</script>
